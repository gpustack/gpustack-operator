apiVersion: worker.gpustack.ai/v1
kind: ModelStore
metadata:
  name: bench-models
spec:
  nodeSelector:
    matchLabels:
      feature.gpustack.ai/acceleratable: "true"
---
apiVersion: worker.gpustack.ai/v1
kind: ModelStoreBinding
metadata:
  name: bench-models
  namespace: gpustack-bench
spec:
  storeRefs:
    - name: bench-models
  quota:
    bytes: 220Gi
  allowPinned: true
---
apiVersion: worker.gpustack.ai/v1
kind: ModelPrefetch
metadata:
  name: qwen2-5-vl-7b-instruct
  namespace: gpustack-bench
spec:
  artifactRef:
    name: qwen2-5-vl-7b-instruct
  bindingRef:
    name: bench-models
  placement:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: computeinstance-e00v6dnves0rw6f2j2
  minReady: 1
  retention:
    pinned: true
---
