decar</text><text x="676" y="227" class="tiny">Runs in Decode Pod</text><text x="676" y="246" class="tiny">Coordinates stage requests</text><rect x="883" y="253" width="58" height="22" rx="11" class="badge"/><text x="892" y="268" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">ACTIVE</text><path d="M245 230 H310" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M245 230 H310"/></circle><path d="M530 230 H660" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M530 230 H660"/></circle><rect x="40" y="380" width="275" height="145" rx="13" class="card"/><rect x="40" y="390" width="4" height="125" rx="2" fill="var(--amber)"/><text x="56" y="408" class="head">Encode Role Pod</text><text x="56" y="432" class="tiny">--mm-encoder-only</text><text x="56" y="451" class="tiny">Visual encoder · no KV cache</text><text x="56" y="470" class="tiny">No language-model weights</text><rect x="243" y="493" width="58" height="22" rx="11" class="badge"/><text x="252" y="508" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">READY</text><rect x="450" y="380" width="275" height="145" rx="13" class="card"/><rect x="450" y="390" width="4" height="125" rx="2" fill="var(--blue)"/><text x="466" y="408" class="head">Prefill Role Pod</text><text x="466" y="432" class="tiny">Prompt tokens + embeddings</text><text x="466" y="451" class="tiny">Fills KV cache</text><rect x="653" y="493" width="58" height="22" rx="11" class="badge"/><text x="662" y="508" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">READY</text><rect x="860" y="380" width="295" height="145" rx="13" class="card"/><rect x="860" y="390" width="4" height="125" rx="2" fill="var(--purple)"/><text x="876" y="408" class="head">Decode Role Pod</text><text x="876" y="432" class="tiny">Receives KV state</text><text x="876" y="451" class="tiny">Streams completion tokens</text><rect x="1083" y="493" width="58" height="22" rx="11" class="badge"/><text x="1092" y="508" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">READY</text><path d="M720 285 V315 H175 V380" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M720 285 V315 H175 V380"/></circle><text x="210" y="304" class="tiny">A · multimodal</text><path d="M780 285 V340 H587 V380" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M780 285 V340 H587 V380"/></circle><text x="600" y="333" class="tiny">B · text bypasses encode</text><path d="M315 450 H450" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M315 450 H450"/></circle><text x="330" y="438" class="tiny">visual embeddings</text><path d="M725 450 H860" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M725 450 H860"/></circle><text x="765" y="438" class="tiny">KV state</text><path d="M1155 485 H1180 V140 H150 V175" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M1155 485 H1180 V140 H150 V175"/></circle><text x="625" y="132" class="tiny">stream completion</text><rect x="65" y="552" width="650" height="55" rx="10" class="panel"/><text x="83" y="575" class="label">ENCODER CACHE CONNECTOR</text><text x="83" y="594" class="tiny">vLLM: ECCPUConnector / ECExampleConnector · SGLang: encoder URLs</text><rect x="40" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="62.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="62.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="77" y="662" class="body">Dedicated Visual Encoder Pods</text><rect x="420" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="442.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="442.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="457" y="662" class="body">Text-Only Requests Bypass Encode</text><rect x="800" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="822.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="822.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="837" y="662" class="body">Independent Per-Stage Hardware</text><text x="40" y="692" class="tiny">GPUStack Operator  ·  Conceptual flow</text></svg>