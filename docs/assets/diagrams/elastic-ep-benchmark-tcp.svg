<text class="title" x="40" y="78">Elastic EP width 2 vs width 4 over TCP, concurrency sweep</text>
<text class="sub" x="40" y="104">In-place expansion from 4 to 8 GPUs (TP = 2 per Pod, allgather_reducescatter over TCP); 439/439 live-resize requests succeeded.</text>
