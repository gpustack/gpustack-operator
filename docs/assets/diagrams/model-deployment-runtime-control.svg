<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Online Runtime Control</title><desc id="desc">ModelDeployment reconciles live engine parameters, role pause state, and Elastic EP width through an Envoy inference allowlist and a read-only engine sentinel.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)}
.title{font-size:29px;font-weight:750;letter-spacing:-.4px}
.sub{font-size:14px;fill:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}
.head{font-size:16px;font-weight:700;fill:var(--ink)}
.body{font-size:13px;font-weight:600;fill:var(--ink)}
.tiny{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.3}
.pill{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.badge{display:none}
.line{fill:none;stroke:var(--teal);stroke-width:2;marker-end:url(#arrow)}
.dot{fill:var(--teal)}
.headline{font-size:16px;font-weight:750;letter-spacing:.35px}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="var(--teal)"/></marker></defs><rect width="1200" height="700" fill="var(--bg)"/><rect width="1200" height="700" fill="url(#grid)" opacity=".65"/><rect x="1122" y="34" width="38" height="38" rx="9" fill="var(--blue)"/><text class="headline" x="1141" y="61" text-anchor="middle" fill="white" style="fill:white">G</text><text x="40" y="48" class="label">MODEL DEPLOYMENT · CAPABILITY</text><text x="40" y="90" class="title">Online Runtime Control</text><text x="40" y="118" class="sub">Reconcile live parameters, role pause, and Elastic EP behind an Envoy allowlist without restarting worker Pods.</text><rect x="35" y="195" width="275" height="235" rx="13" class="card"/><rect x="35" y="205" width="4" height="215" rx="2" fill="var(--blue)"/><text x="51" y="225" class="head">ModelDeployment Spec</text><text x="51" y="251" class="tiny">roles[].runtimeControl.parameters</text><text x="51" y="273" class="tiny">roles[].pause (zero Pod roll)</text><text x="51" y="295" class="tiny">extraArgs static boot ceilings</text><text x="51" y="317" class="tiny">Translator &amp; webhook checks</text><text x="51" y="339" class="tiny">spec.router hash decoupled</text><text x="255" y="414" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">SPEC</text><rect x="400" y="175" width="375" height="275" rx="13" class="card"/><rect x="400" y="185" width="4" height="255" rx="2" fill="var(--purple)"/><text x="416" y="205" class="head">Operator Reconciler</text><text x="416" y="231" class="tiny">Router allowlist gate (:8000 / :9091)</text><text x="416" y="253" class="tiny">Role-sharded ConfigMap ledger</text><text x="416" y="275" class="tiny">Pause: withdraw -&gt; drain -&gt; gate</text><text x="416" y="297" class="tiny">Ambiguous POST live readback fence</text><text x="416" y="319" class="tiny">Elastic EP resize + param replay</text><text x="416" y="341" class="tiny">ModelDeploymentScaler RolePaused</text><text x="692" y="434" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">RECONCILE</text><rect x="870" y="170" width="295" height="140" rx="13" class="card"/><rect x="870" y="180" width="4" height="120" rx="2" fill="var(--teal)"/><text x="886" y="198" class="head">Envoy Inference Allowlist</text><text x="886" y="223" class="tiny">:8000 LLM &amp; omni routes -&gt; 200</text><text x="886" y="244" class="tiny">/gpustack/v1/* &amp; admin -&gt; 403</text><text x="886" y="265" class="tiny">Internal :9091/observer/endpoints</text><text x="886" y="286" class="tiny">Zero operator-managed Secrets</text><rect x="870" y="335" width="295" height="155" rx="13" class="card"/><rect x="870" y="345" width="4" height="135" rx="2" fill="var(--amber)"/><text x="886" y="363" class="head">gpustack-engine-sentinel</text><text x="886" y="388" class="tiny">Read-only PYTHONPATH sitecustomize</text><text x="886" y="409" class="tiny">Fail-closed /ready + /ack latch</text><text x="886" y="430" class="tiny">Live /gpustack/v1/runtime_config</text><text x="886" y="451" class="tiny">ASGI /pause (503) &amp; PreStop drain</text><text x="1106" y="474" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">LIVE</text><path d="M310 312 H400" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M310 312 H400"/></circle><text x="322" y="301" class="tiny">validate</text><path d="M775 238 H870" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M775 238 H870"/></circle><text x="795" y="227" class="tiny">isolate</text><path d="M775 410 H870" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M775 410 H870"/></circle><text x="782" y="399" class="tiny">apply / ack</text><path d="M1018 490 V555 H172 V430" class="line"/><circle r="4" class="dot"><animateMotion dur="3.4s" repeatCount="indefinite" path="M1018 490 V555 H172 V430"/></circle><text x="415" y="544" class="tiny">boot_id, appliedConfigDigest &amp; RuntimeControlSynced status</text><text x="405" y="485" class="tiny">Router-first isolation · boot-local latch · monotonic Elastic EP</text><rect x="40" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="62.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="62.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="77" y="662" class="body">Zero Pod Restart &amp; Boot-Default Reset</text><rect x="420" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="442.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="442.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="457" y="662" class="body">Envoy Allowlist &amp; Zero Auth Secrets</text><rect x="800" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="822.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="822.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="837" y="662" class="body">Fail-Closed Latch &amp; RolePaused Guard</text><text x="40" y="692" class="tiny">GPUStack Operator  ·  Conceptual flow</text></svg>
