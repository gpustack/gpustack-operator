<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Model Deployment Scaling</title><desc id="desc">A closed loop plans replica counts from engine metrics and applies guarded decisions.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)}
.title{font-size:29px;font-weight:750;letter-spacing:-.4px}
.sub{font-size:14px;fill:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}
.head{font-size:16px;font-weight:700;fill:var(--ink)}
.body{font-size:13px;font-weight:600;fill:var(--ink)}
.tiny{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
.panel{fill:var(--soft);stroke:var(--line);stroke-width:1.3}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.3}
.pill{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.badge{display:none}
.line{fill:none;stroke:var(--teal);stroke-width:2;marker-end:url(#arrow)}
.dash{stroke-dasharray:5 5}
.dot{fill:var(--teal)}
.headline{font-size:16px;font-weight:750;letter-spacing:.35px}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="var(--teal)"/></marker></defs><rect width="1200" height="700" fill="var(--bg)"/><rect width="1200" height="700" fill="url(#grid)" opacity=".65"/><rect x="1122" y="34" width="38" height="38" rx="9" fill="var(--blue)"/><text class="headline" x="1141" y="61" text-anchor="middle" fill="white" style="fill:white">G</text><text x="40" y="48" class="label">MODEL DEPLOYMENT · CAPABILITY</text><text x="40" y="90" class="title">Model Deployment Scaling</text><text x="40" y="118" class="sub">A closed loop plans replica counts from engine metrics and applies guarded decisions.</text><rect x="35" y="220" width="260" height="205" rx="13" class="card"/><rect x="35" y="230" width="4" height="185" rx="2" fill="var(--blue)"/><text x="51" y="248" class="head">Serving replicas</text><text x="51" y="272" class="tiny">ModelDeployment · live engines</text><text x="51" y="291" class="tiny">QueueDepth: running + waiting</text><text x="51" y="310" class="tiny">Tokens/s throughput</text><text x="51" y="329" class="tiny">TTFT &amp; ITL latency signals</text><rect x="223" y="393" width="58" height="22" rx="11" class="badge"/><text x="232" y="408" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">LIVE</text><rect x="410" y="185" width="370" height="275" rx="13" class="card"/><rect x="410" y="195" width="4" height="255" rx="2" fill="var(--purple)"/><text x="426" y="213" class="head">ModelDeploymentScaler</text><text x="426" y="237" class="tiny">Proportional · QueueDepth</text><text x="426" y="256" class="tiny">TokenThroughput</text><text x="426" y="275" class="tiny">Predictive · Kalman forecast</text><text x="426" y="294" class="tiny">Optional offline capacity priors</text><text x="426" y="313" class="tiny">Stable / panic windows · step limits</text><text x="426" y="332" class="tiny">Pending timeout · opposing / priority</text><rect x="708" y="428" width="58" height="22" rx="11" class="badge"/><text x="717" y="443" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">ACTIVE</text><rect x="900" y="180" width="265" height="105" rx="13" class="card"/><rect x="900" y="190" width="4" height="85" rx="2" fill="var(--teal)"/><text x="916" y="208" class="head">Shadow mode</text><text x="916" y="232" class="tiny">Writes status recommendations</text><text x="916" y="251" class="tiny">No replica-count writes</text><rect x="1093" y="253" width="58" height="22" rx="11" class="badge"/><text x="1102" y="268" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">PLAN</text><rect x="900" y="370" width="265" height="125" rx="13" class="card"/><rect x="900" y="380" width="4" height="105" rx="2" fill="var(--amber)"/><text x="916" y="398" class="head">Active mode</text><text x="916" y="422" class="tiny">Single-writer binding + term</text><text x="916" y="441" class="tiny">Updates spec.roles[].replicas</text><text x="916" y="460" class="tiny">Retirement / graceful drain</text><rect x="1093" y="463" width="58" height="22" rx="11" class="badge"/><text x="1102" y="478" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">WRITE</text><path d="M295 320 H410" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M295 320 H410"/></circle><text x="325" y="309" class="tiny">metrics</text><path d="M780 230 H900" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M780 230 H900"/></circle><text x="795" y="219" class="tiny">recommend</text><path d="M780 415 H900" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M780 415 H900"/></circle><text x="810" y="403" class="tiny">commit</text><path d="M1030 495 V555 H165 V425" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M1030 495 V555 H165 V425"/></circle><text x="460" y="545" class="tiny">reconcile replicas and retire</text><text x="415" y="490" class="tiny">Select one algorithm · apply bounds, ratios and safety guards</text><rect x="40" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="62.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="62.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="77" y="662" class="body">Queue, Throughput &amp; Predictive Scaling</text><rect x="420" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="442.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="442.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="457" y="662" class="body">Shadow Dry-Run &amp; Active Modes</text><rect x="800" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="822.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="822.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="837" y="662" class="body">Single-Writer Fence &amp; Graceful Drain</text><text x="40" y="692" class="tiny">GPUStack Operator  ·  Conceptual flow</text></svg>