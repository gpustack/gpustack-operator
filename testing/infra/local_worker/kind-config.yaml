kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            - name: enable-aggregator-routing
              value: "true"
        controllerManager:
          extraArgs:
            - name: controllers
              value: "*,-endpointslicemirroring"
