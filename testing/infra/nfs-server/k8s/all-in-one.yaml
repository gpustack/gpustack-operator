---
kind: Service
apiVersion: v1
metadata:
  name: nfs-server
  namespace: default
  labels:
    app.kubernetes.io/part-of: nfs-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: nfs-server
  ports:
    - name: tcp-2049
      port: 2049
      protocol: TCP
    - name: udp-111
      port: 111
      protocol: UDP
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nfs-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nfs-server
      app.kubernetes.io/component: server
      app.kubernetes.io/name: nfs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nfs-server
        app.kubernetes.io/component: server
        app.kubernetes.io/name: nfs-server
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: main
          image: gists/nfs-server:2.6.4
          env:
            - name: NFS_DIR
              value: "/share"
          volumeMounts:
            - mountPath: /share
              name: nfs-data-dir
          securityContext:
            privileged: true
          ports:
            - name: tcp-2049
              containerPort: 2049
              protocol: TCP
            - name: udp-111
              containerPort: 111
              protocol: UDP
      volumes:
        - name: nfs-data-dir
          emptyDir: { }
