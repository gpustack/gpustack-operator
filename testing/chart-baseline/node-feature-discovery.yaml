# Regenerate: go test ./pkg/worker/kuberess/ -run TestDumpChartValuesBaseline -args -update
fullnameOverride: node-feature-discovery
gc:
  annotations:
    gpustack.ai/managed: "true"
  deploymentAnnotations:
    gpustack.ai/managed: "true"
  enable: true
  serviceAccount:
    annotations:
      gpustack.ai/managed: "true"
    create: true
  tolerations:
  - operator: Exists
image:
  pullPolicy: IfNotPresent
  repository: docker.io/gpustack/mirrored-node-feature-discovery
master:
  annotations:
    gpustack.ai/managed: "true"
  config:
    restrictions:
      allowOverwrite: true
      denyNodeFeatureLabels: false
      disableAnnotations: false
      disableExtendedResources: false
      disableLabels: false
      disableTaints: false
      nodeFeatureNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gpustack-system
  deploymentAnnotations:
    gpustack.ai/managed: "true"
  enable: true
  serviceAccount:
    annotations:
      gpustack.ai/managed: "true"
    create: true
  tolerations:
  - operator: Exists
namespaceOverride: gpustack-system
nodeFeatureRule:
  create: true
  name: gpustack-cpu-info
  rules:
  - annotations:
      feature.gpustack.ai/cpu-boost-freq: '@cpu.model.boost_freq'
      feature.gpustack.ai/cpu-cache-l1d: '@cpu.model.cache_l1d'
      feature.gpustack.ai/cpu-cache-l1i: '@cpu.model.cache_l1i'
      feature.gpustack.ai/cpu-cache-l2: '@cpu.model.cache_l2'
      feature.gpustack.ai/cpu-cache-l3: '@cpu.model.cache_l3'
      feature.gpustack.ai/cpu-cache-line: '@cpu.model.cache_line'
      feature.gpustack.ai/cpu-family: '@cpu.model.family'
      feature.gpustack.ai/cpu-hz: '@cpu.model.hz'
      feature.gpustack.ai/cpu-logical-cores: '@cpu.model.logical_cores'
      feature.gpustack.ai/cpu-name: '@cpu.model.name'
      feature.gpustack.ai/cpu-physical-cores: '@cpu.model.physical_cores'
      feature.gpustack.ai/cpu-stepping: '@cpu.model.stepping'
      feature.gpustack.ai/cpu-threads-per-core: '@cpu.model.threads_per_core'
    matchFeatures:
    - feature: cpu.model
      matchExpressions:
        vendor_id:
          op: Exists
    name: attached cpu info to annotations
  - matchFeatures:
    - feature: pci.device
      matchExpressions:
        class:
          op: InRegexp
          value:
          - ^02
          - ^03
          - ^0b
          - ^12
        vendor:
          op: In
          value:
          - "1002"
          - 10de
          - "19e5"
          - 1d94
          - 1ded
          - 1e3e
          - 1ed5
          - "9999"
          - cabc
    name: detect whether the node has acceleratable devices
    vars:
      has-acceleratable-devices: "true"
  - labels:
      feature.gpustack.ai/acceleratable: "false"
    matchFeatures:
    - feature: rule.matched
      matchExpressions:
        has-acceleratable-devices:
          op: DoesNotExist
    name: identify the node without any acceleratable device
prometheus:
  enable: false
topologyUpdater:
  enable: false
worker:
  annotations:
    gpustack.ai/managed: "true"
  config:
    core:
      labelSources:
      - cpu
      - pci
      - custom
      labelWhiteList: ^(pci-|cpu-model\.|acceleratable)
    sources:
      pci:
        deviceClassWhitelist:
        - "02"
        - "03"
        - 0b
        - "12"
        deviceLabelFields:
        - vendor
  daemonsetAnnotations:
    gpustack.ai/managed: "true"
  enable: true
  serviceAccount:
    annotations:
      gpustack.ai/managed: "true"
    create: true
  tolerations:
  - operator: Exists
