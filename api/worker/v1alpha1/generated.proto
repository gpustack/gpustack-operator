// InstanceTypeUnitResources describes the unit resources of the InstanceType.
message InstanceTypeUnitResources {
  // CPU is the unit CPU resource(cores) of the InstanceType.
  optional string cpu = 1;

  // RAM is the unit RAM resource(Mi) of the InstanceType.
  optional string ram = 3;
}

// InstanceVolume defines the volume to mount in the Instance,
// which can be either ephemeral or persistent.
message InstanceVolume {
  // Ephemeral is the ephemeral volume to mount in the Instance.
  optional InstanceEphemeralVolume ephemeral = 1;

  // Persistent is the reference to the InstancePersistentVolume to mount in the Instance.
  optional .k8s.io.api.core.v1.LocalObjectReference persistent = 2;
}

