  optional string os = 7;

  // Arch is the architecture of the InstanceType, e.g. "amd64", "arm64".
  //
  // It is a required admin-writable input, enforced by the validating webhook.
  optional string arch = 8;

  // UnitResources describes the unit resources of the InstanceType.
  //
  // It is a required admin-writable input, enforced by the validating webhook, and is
  // immutable after creation. A derived InstanceType is stamped once at creation: an
  // accelerated one from the per-product preset table, falling back to 4 CPU / 16Gi for a
  // product the table does not recognize, and a CPU-only one with 1 CPU / 2Gi.
  optional InstanceTypeUnitResources unitResources = 9;

  // LocalStorage is the ephemeral local storage of the InstanceType, e.g. "100Gi".
  //
  // It is a required admin-writable input carrying a case-sensitive "Gi" suffix, enforced
  // by the validating webhook, and is immutable after creation; a derived InstanceType is
  // stamped with a fixed 100Gi, which no preset varies.
  optional string localStorage = 10;
}

// InstanceTypeStatus describes the observed state of the InstanceType.
message InstanceTypeStatus {
  // Detail is the observed hardware descriptor of the InstanceType, computed by the
  // reconciler from the matched ResourceFlavor's notes and the pool's Devices ledger.
  optional InstanceTypeDetail detail = 1;

  // Entrance is the name of the namespaced LocalQueue that fronts this
  // InstanceType's backing ClusterQueue — the value a workload sets as its
  // "kueue.x-k8s.io/queue-name" label to be admitted. It is derived from the
  // InstanceType name (see nodefeature.FormatLocalQueueName).
  optional string entrance = 2;

  // Phase is the summary of conditions.
  optional string phase = 3;

  // PhaseMessage is the message of the phase.
  optional string phaseMessage = 4;

  // Accelerator is the allocatable-as-exclusive view: whole accelerators that are
  // entirely free, e.g. "1", "4".
  optional InstanceTypeResource accelerator = 5;

  // AcceleratorShared is the shareable view: per-accelerator ownership shares (up to
  // SharedResourceMaxSize owners per accelerator) summed over free and already-shared
  // accelerators.
  optional InstanceTypeResource acceleratorShared = 6;

  // AcceleratorSliced is the sliceable view: per-accelerator VRAM-percent units (one
  // hundred per accelerator) summed over free and already-sliced accelerators.
  optional InstanceTypeResource acceleratorSliced = 7;

  // AcceleratorPartitioned is the hardware-partitionable view: the partition instances the
  // pool's partitioned accelerators can still host, summed over those accelerators. It is
  // disjoint from the three views above — an accelerator in a partitioning mode can serve no
  // other kind of claim — so a pool with no partitioned accelerator reports zero here.
  optional InstanceTypePartitionedResource acceleratorPartitioned = 9;

  // CPU is the CPU resource of the InstanceType, e.g. "4", "8".
  optional InstanceTypeResource cpu = 8;
}

// InstanceTypeUnitResources describes the unit resources of the InstanceType.
message InstanceTypeUnitResources {
  // CPU is the unit CPU resource(cores) of the InstanceType.
  optional string cpu = 1;

  // RAM is the unit RAM resource(Mi) of the InstanceType.
  optional string ram = 3;
}

// InstanceVolume defines the volume to mount in the Instance,
// which can be either ephemeral or persistent.
message InstanceVolume {
  // Ephemeral is the ephemeral volume to mount in the Instance.
  optional InstanceEphemeralVolume ephemeral = 1;

  // Persistent is the reference to the InstancePersistentVolume to mount in the Instance.
  optional .k8s.io.api.core.v1.LocalObjectReference persistent = 2;
}

// KVCacheBackend is the schema for worker.gpustack.ai.
//
// It declares which machines contribute what medium to one KV cache backend, and reports the
// backend's OBSERVED state. It is cluster-scoped because it is a privileged physical resource: it
// names nodes, claims host memory and host paths, and on the RDMA path needs hostNetwork plus
// /dev/infiniband. Tenant isolation is a different axis, owned one layer up.
//
// +genclient
// +genclient:nonNamespaced
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Cluster",categories=["gpustack"],shortName=["kvcb"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Type",type="string",jsonPath=".spec.type"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Endpoint",type="string",jsonPath=".status.endpoints[?(@.name=='Client')].address"
// +k8s:crd-gen:printcolumn:name="Capacity",type="string",jsonPath=".status.capacity.total"
// +k8s:crd-gen:printcolumn:name="Age",type="date",jsonPath=".metadata.creationTimestamp"
message KVCacheBackend {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional KVCacheBackendSpec spec = 2;

  optional KVCacheBackendStatus status = 3;
}

// KVCacheBackendCapacity is the backend's capacity AS THE LEADER REPORTS IT. Both figures are
// ABSENT when the scrape failed: a zero here would read as an empty cache, and a retained previous
// value would read as a current one.
message KVCacheBackendCapacity {
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity total = 1;

  optional .k8s.io.apimachinery.pkg.api.resource.Quantity used = 2;
}

// KVCacheBackendConnection is how the backend is reached. Exactly one branch is set; the webhook
// refuses both and neither, because a spec with no branch describes nothing and a spec with two
// describes two different backends.
message KVCacheBackendConnection {
  // Managed asks this operator to run the leader and the store members.
  optional KVCacheBackendManaged managed = 1;

  // External names a backend somebody else runs. Nothing is rendered for it; the reconciler
  // only observes.
  optional KVCacheBackendExternal external = 2;
}

// KVCacheBackendEndpoint is one named address of a backend. The same type serves the external
// branch's input and the status's output, so a reader learns one shape.
message KVCacheBackendEndpoint {
  // Address is host:port.
  //
  // 259 and not 253: the bound is on host:port, and the host alone may be a DNS subdomain of the
  // full 253 characters, which leaves room for a colon and a five-digit port. At 253 the schema
  // refused an address the webhook's own host:port rule accepts.
  //
  // +required
  // +k8s:validation:maxLength=259
  optional string address = 1;

  // Name says who the address is for. Client is what an inference engine connects to; Admin is the
  // port serving the Prometheus exposition and the HTTP admin API both, which is what THIS
  // OPERATOR reads. A consumer handed the wrong one fails at connect time with nothing to point
  // at, which is why the distinction is carried in the API rather than left to a convention.
  //
  // +required
  // +k8s:validation:enum=["Client","Admin"]
  optional string name = 2;
}

// KVCacheBackendExternal is a backend this operator does not run.
//
// TWO OF THESE MAY NAME THE SAME BACKEND, AND NOTHING HERE NOTICES. The same leader is reachable
// under more than one spelling, and this operator compares no addresses across objects, deliberately:
// every identity it could compare is either editable or needs the leader reachable at admission.
// Keeping two objects off one leader is YOURS, and three things go wrong when they are not, none of
// them a refusal on any object:
//
//   - The quota of a shared reuse domain flips and never settles. Uniqueness is enforced only
//     between Bindings whose pools name the SAME backend object, so two Bindings reaching one leader
//     through two objects are both admitted on one domain name, and each pool's reconciler writes
//     its own quotaCeiling back over the other's on every pass.
//   - An undersized quota shows up as a LOW HIT RATE and nothing else. Exceeding it does not refuse
//     the write: the store frees room by dropping that tenant's own older objects and retries,
//     irreversibly, without any counter moving.
//   - Two Bindings claiming one domain.name with a different blockSize or dtype CORRUPT each other's
//     blocks — the only one of the three that produces wrong answers rather than slow ones. The
//     reuse identity an engine is handed is the domain NAME alone, so two differently-shaped caches
//     land under one identity: the writes succeed, the reads succeed, and the tensors are wrong.
message KVCacheBackendExternal {
  // Endpoints are the addresses of a backend somebody else runs, one entry per named role. Both
  // roles are required: this operator reads the Admin address and publishes the Client one, so an
  // external backend that named only one leaves either the scrape or every engine with nothing to
  // point at. It is a list rather than a single address so that a multi-leader backend needs no
  // API change to describe.
  //
  // +required
  // +k8s:validation:minItems=1
  // +listType=map
  // +listMapKey=name
  repeated KVCacheBackendEndpoint endpoints = 1;
}

// KVCacheBackendLeader is the leader process: how many of it, how it places new writes, and the
// escape hatch for flags this API does not enumerate.
message KVCacheBackendLeader {
  // Replicas is how many leader processes run, of which exactly one serves at a time. The rest are
  // standbys: they hold no data, answer no request, and exist to take over.
  //
  //   - More than one REQUIRES HighAvailability. Electing a leader among several needs a leadership
  //     record, and the webhook refuses the pair without one rather than silently running two
  //     leaders against the same members.
  //   - Raising this adds no capacity, which members do. The ceiling is here to catch the reading
  //     that it does, and it is duplicated in the webhook on purpose: this one still holds when
  //     the webhook is not installed, which is when a second leader would be rendered rather than
  //     refused. Raise both together; widening a maximum is not a breaking change.
  //
  // +k8s:validation:default=1
  // +k8s:validation:minimum=1
  // +k8s:validation:maximum=5
  optional int32 replicas = 1;

  // HighAvailability elects the leader through a Kubernetes Lease, and it is what allows Replicas
  // above 1. It carries no settings: the Lease is named after this backend, so there is no
  // connection target to supply, and the API access the election needs is rendered beside the
  // workload.
  //
  //   - Unset, the leader runs as a single process exactly as before — no election flag, no extra
  //     object, the command line it ran before this field existed.
  //   - With MultiTenancy on, a failover costs HIT RATE for up to one KVCachePool reconcile
  //     interval. Each replica seeds its tenant quota policy at its own start, so a standby that
  //     took over after a quota was raised applies the older, lower ceiling, and an over-quota
  //     write in this store is not refused — it evicts that tenant's own older objects,
  //     irreversibly and without moving any counter. The quota itself is not lost: the pool
  //     reconciler is the authority and writes the difference back on its next pass.
  optional KVCacheBackendLeaderHighAvailability highAvailability = 6;

  // AllocationStrategy is how the leader picks which member takes a new write. Random spreads
  // them; FreeRatioFirst biases toward the emptier member.
  //
  // The enum is deliberately the two any pooled store would have, not every value the current
  // artifact's flag accepts: the rest are specific to one medium or one locality model, are
  // reachable through ExtraArgs, and would fix this API to one implementation's vocabulary.
  // Widening the enum later is not a breaking change.
  //
  // +k8s:validation:default="FreeRatioFirst"
  // +k8s:validation:enum=["Random","FreeRatioFirst"]
  optional string allocationStrategy = 2;

  // MultiTenancy turns on the leader's per-tenant quota ledger and the tenant-scoped shard index
  // behind it. Off, every request falls into one default tenant and the index degrades to a plain
  // key hash, so two callers using different tenant names read each other's cache.
  //
  // It is a FIELD rather than an extraArgs entry because another API validates against it: a
  // KVCachePool is refused when its backend has no ledger to write quota into, and a webhook
  // reading an unschema'd "true", "1" or "True" would be judging a value domain that belongs to
  // whoever typed it. The store's global -quota_bytes flag stays in extraArgs for the converse
  // reason: no other API needs to interpret it.
  //
  // Unset and false both mean no ledger, and unset renders NO flag rather than an explicit false.
  optional bool multiTenancy = 4;

  // ExtraArgs passes flags this API does not enumerate straight through to the leader, after
  // the derived ones. A key that collides with a flag rendered from a field above is refused
  // at admission, because two sources for one flag make the rendered command ambiguous.
  //
  // EVERY VALUE HERE IS WORLD-READABLE: stored verbatim on this cluster-scoped object, then
  // rendered into the leader container's argv as -key=value, readable by anyone who can reach the
  // Pod or the Deployment, for the life of the object. A credential does not belong here, and
  // since this operator renders no flag that carries one, this field is the only way one arrives.
  map<string, string> extraArgs = 3;

  // Offload turns on writing evicted keys to the members' local disk tier. It is the leader's
  // half of a pair: the other half is members[].localDisk, which says where on each node those
  // bytes go, and admission refuses either half alone because the store degrades on both
  // mismatches without reporting either.
  optional KVCacheBackendLeaderOffload offload = 5;
}

// KVCacheBackendLeaderHighAvailability turns leader election on, and carries nothing.
//
// It is a STRUCT rather than a bool on purpose: a bool would admit `enabled: false` beside
// `replicas: 3`, a third state admission would have to adjudicate and every reader would have to
// remember, while presence has no such state. Lease tuning — duration, renew deadline — can also be
// added here later without a breaking change.
message KVCacheBackendLeaderHighAvailability {
}

// KVCacheBackendLeaderOffload turns the local disk tier on, leader side.
//
// Both settings are the leader's, and Enabled gates the feature outright: every offload entry point
// returns early without it. A tier configured on the member alone is inert, which is why admission
// requires the two halves together rather than letting one render on its own.
message KVCacheBackendLeaderOffload {
  // Enabled turns on offloading to the members' local disks. Unset and false both mean no
  // offloading, and unset renders NO flag rather than an explicit false.
  optional bool enabled = 1;

  // OnEvict defers the write to disk from the moment a key is stored to the moment it is evicted,
  // so a key that is never evicted is never written to disk.
  //
  // It REQUIRES Enabled and Enabled REQUIRES it, and admission refuses both directions. The store
  // ANDs the two, so this alone is accepted, echoed back in the leader's own startup log, and then
  // does nothing. Enabled alone selects write-through, which the store leaves unprotected: an
  // object queued for offload is held in memory only on the deferred branch this field selects, so
  // evicting without it destroys the sole replica of an object whose bucket has not been flushed.
  optional bool onEvict = 2;
}

// KVCacheBackendList holds the list of KVCacheBackend.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message KVCacheBackendList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated KVCacheBackend items = 2;
}

// KVCacheBackendManaged is the operator-run shape of a backend: the leader, and the member groups
// that contribute media to it.
message KVCacheBackendManaged {
  // Leader is the metadata service every member and every client talks to. The name is this
  // API's, not the artifact's: the rendered flags and environment variables keep the vendor's
  // own "master" spelling, and the mapping lives in the renderer.
  //
  // +required
  optional KVCacheBackendLeader leader = 1;

  // Members are the groups of store members. Each entry selects nodes, names the medium those
  // nodes contribute, and may add a local disk tier on the same nodes.
  //
  // A group's POSITION in this list is its identity: the DaemonSet's name, its immutable selector
  // labels and its members' HTTP port all derive from it. Giving a group a name of its own is
  // possible and DELIBERATELY not done — a DaemonSet's selector is immutable, so introducing one
  // deletes and recreates every member and the whole cache goes with them.
  //
  //   - Appending a group, removing from the END of the list, and editing a group where it stands
  //     are all ALLOWED, including the widening of a nodeSelector that is how a group gains nodes.
  //   - Moving a group to another position is REFUSED at admission: it redefines every later
  //     position and rebuilds those members against a different group's spec, cache included.
  //   - Two shapes are knowingly not caught, because without a name neither can be told from an
  //     ordinary edit: a reorder combined with an edit to the same group, and removing a group
  //     that an identical later group replaces. Both leave two identical groups in the list.
  //   - To take a group out of service without removing it, narrow its nodeSelector until it
  //     matches no node. The group keeps its position and nothing is rebuilt.
  //
  // The cap of 32 is a SAFETY BOUND, not a statement about how many groups are useful: the port
  // derivation stays valid to 57455, but an unbounded list can render a port outside the valid
  // range with nothing reporting it.
  //
  // +required
  // +k8s:validation:minItems=1
  // +k8s:validation:maxItems=32
  // +listType=atomic
  repeated KVCacheBackendMember members = 2;

  // ScaleIn is what a member does on its way out. Left unset, a member is stopped the way any
  // Pod is: it gets SIGTERM and the time its own shutdown needs, and nothing waits for the
  // readers of what it held.
  optional KVCacheBackendScaleIn scaleIn = 3;
}

// KVCacheBackendMember is one group of store members: the nodes it selects, the medium each
// contributes, and how much.
message KVCacheBackendMember {
  // NodeSelector selects the nodes that contribute this medium. One member runs per selected
  // node; widening the selector adds members and the leader admits their segments into
  // subsequent allocation immediately, with no leader or member restart.
  //
  // +required
  map<string, string> nodeSelector = 1;

  // Medium is what the SEGMENT this member group mounts is made of. One value: host memory.
  //
  // It is an identity rather than a choice, which is why the field survives with a single value
  // exactly as spec.type does: a second medium widens this enum instead of being inferred from a
  // field that is not there.
  //
  //   - A local disk, NVMe-oF, a DAX device and a distributed filesystem are NOT member groups, and
  //     each is reached elsewhere: the first through localDisk below, NVMe-oF as a target
  //     coordinate with no Pod, and the last two on the leader's own process.
  //   - Narrowing the enum carries a RESIDUAL RISK, knowingly accepted. An object created with one
  //     of those values, while this CRD was installed but the webhook was not, becomes undeletable:
  //     schema validation runs on the write path only, so it reads back fine while every update is
  //     refused, the controller's finalizer removal included. The exposure is development clusters
  //     only, this type being absent from every tag through v0.8.6, so clearing it is the first
  //     shipping release's job — confirm no leftover object exists, or write a recovery procedure.
  //
  // +required
  // +k8s:validation:enum=["DRAM"]
  optional string medium = 2;

  // CapacityPerMember sizes ONE member, not one node. It becomes the member's global segment size
  // and is counted into the member Pod's own resource request, so a member that does not fit stays
  // Pending instead of overcommitting the node.
  //
  //   - A group carrying LocalDisk needs at least one BUCKET here, which is the unit that tier is
  //     written in. A bucket's bytes are held in this segment until the bucket is complete, so a
  //     smaller segment never holds a bucket's worth at once and the tier stays empty under every
  //     workload, which nothing else reports. A group with no tier has no such floor.
  //   - The name is "per member" for a shape that is DECIDED AND NOT DONE: several members per
  //     node, split by NUMA domain. Today one selected node runs one member.
  //   - What would reopen that is a two-socket node reporting RDMA interfaces on more than one NUMA
  //     node AND that node's member observed transferring across the socket boundary, there being
  //     nothing else on this path that consumes the NUMA affinity this operator already discovers.
  //     One group per NUMA domain is not the shape it would take — a group selects nodes through
  //     nodeSelector, while NUMA is a property inside a node rather than a label on one.
  //
  // +required
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity capacityPerMember = 3;

  // LocalBufferSize is the member client's local staging buffer, counted into the Pod's
  // memory request beside CapacityPerMember.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity localBufferSize = 4;

  // ExtraArgs passes config keys this API does not enumerate straight through to the member. It
  // is keyed by CONFIG KEY rather than by environment-variable name — one namespace per side,
  // each the one its own binary documents. A key that collides with one derived from a field
  // above is refused at admission.
  //
  // EVERY VALUE HERE IS WORLD-READABLE: stored verbatim on this cluster-scoped object, then
  // rendered into the member container's argv as -D key=value, readable by anyone who can reach
  // the Pod or the DaemonSet, for the life of the object. A credential does not belong here, and
  // since this operator renders no flag that carries one, this field is the only way one arrives.
  map<string, string> extraArgs = 5;

  // ExtraEnvs passes environment variables this API does not enumerate straight through to the
  // member container.
  //
  //   - It is NOT a second spelling of ExtraArgs: the two reach different places. ExtraArgs renders
  //     as the entrypoint's "-D key=value" config override, while a whole family of this store's
  //     settings — the local disk tier's flush thresholds, its promotion behavior, the rest of its
  //     eviction knobs — has no config key at all and is read from the ENVIRONMENT only.
  //   - A name this operator already renders is REFUSED at admission, for the same reason a
  //     colliding ExtraArgs key is: Kubernetes accepts a container carrying one name twice and
  //     leaves the winner to the runtime, so the collision would not even be reported. That
  //     includes the tier's bucket thresholds, which this operator sizes itself; a tuner who needs
  //     to move them needs a field, and this hatch is deliberately not it.
  //
  // EVERY VALUE HERE IS WORLD-READABLE: stored verbatim on this cluster-scoped object, then
  // rendered into the member container's environment, readable by anyone who can reach the Pod or
  // the DaemonSet, for the life of the object. A credential does not belong here, and since this
  // operator renders no variable that carries one, this field is the only way one arrives.
  map<string, string> extraEnvs = 8;

  // Image overrides the backend's Image for this member group only. Left unset, the group runs
  // the backend's Image.
  //
  // A group's NodeSelector is what makes this necessary: two groups can select nodes of different
  // accelerator vendors or generations, and the store's client ships as one wheel per vendor, each
  // carrying the transports it was compiled with and the runtime it links. The transport itself is
  // backend-wide, so this is NOT a per-group transport — it is the per-group runtime that one
  // transport needs on differing hardware.
  //
  // +k8s:validation:maxLength=512
  optional string image = 6;

  // LocalDisk declares a directory on the nodes this group already selects and points the store
  // client's offload keys at it. Left unset, the group is memory only.
  //
  //   - What the tier is written in is a BUCKET, and that is why this operator sizes one. The store
  //     writes nothing until a bucket is full, by bytes or by object count, so under the store's
  //     own thresholds — sized for a saturated production store — the tier stays empty while every
  //     other signal looks healthy. The pair this operator renders instead is not in this API, and
  //     members[].extraEnvs refuses those names.
  //   - It is a LAYER on this group rather than a group of its own, which is the store's shape: the
  //     leader routes an offload task to the client that owns the key's memory replica, so a member
  //     holding no memory segment is never chosen and would report a cold tier that never fills.
  //   - To check what the tier actually holds rather than what it declared, read the leader's own
  //     master_allocated_file_size_bytes; status.capacity reports the declared CAPACITY only.
  optional KVCacheBackendMemberLocalDisk localDisk = 7;
}

// KVCacheBackendMemberLocalDisk is the local SSD tier this member group's nodes contribute.
//
// It is the member's half of a pair; the leader's half is leader.offload, and admission refuses
// either half alone. Set on its own, the leader never enqueues an offload task and the disk stays
// empty while the member reports its capacity, which is a tier that reads as present and is not.
message KVCacheBackendMemberLocalDisk {
  // Path is the directory on each selected node that holds this tier, mounted into the member
  // container from the host at the same location. It is REQUIRED and has no default: choosing a
  // host directory on somebody else's nodes is not a default this operator may pick, because the
  // wrong one fills a filesystem that nothing in Kubernetes accounts for.
  //
  //   - Declaring a tier REQUIRES a shell in the group's image. An init container surveys this
  //     directory before the member starts, so that reusing a path is something an administrator is
  //     told rather than discovers through a key that reads back as somebody else's. It runs
  //     `sh -c`, and an image without a shell keeps the member from starting at all.
  //   - Creating this directory and giving it the right owner is YOURS, not this operator's, and a
  //     member whose container cannot write it fails at start. The omission is deliberate: an init
  //     container that chowns has to name a uid, while members[].image can put a different vendor's
  //     build on each group, and a chmod 0777 instead opens the directory to every process on the
  //     node. An operator whose uid holds for a whole backend has what would settle it.
  //
  // +required
  // +k8s:validation:maxLength=4096
  optional string path = 1;

  // Capacity caps what this tier stores, in bytes. Left unset, the store's own ceiling applies and
  // nothing is rendered, so a ceiling that moves upstream is a change to investigate rather than
  // one this API silently restated.
  //
  //   - It is also the figure EVICTION measures against, which is why Eviction below is not usable
  //     without it: the store's watermark quota defaults to zero, which that path reads as "no
  //     quota" and returns from having evicted nothing. One value is rendered into both ceilings.
  //   - A set capacity must hold one BUCKET, the unit this tier is written in: the store stops
  //     taking offload work as soon as one more bucket would not fit, so a smaller tier never
  //     receives a key. The bucket size is this operator's to choose, so the floor moves with it.
  //   - It is NOT counted into the Pod's resource requests, unlike CapacityPerMember. The tier is a
  //     host directory, outside the kubelet's ephemeral-storage accounting entirely, so a request
  //     against it would reserve a figure nothing polices and would then keep the member off the
  //     very node that has the disk. Watching that filesystem is the operator's.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity capacity = 2;

  // KeyLimit caps how many keys this tier holds. It is Capacity's other HALF rather than an
  // alternative to it: the store bounds the tier by bytes AND by key count, stops taking offload
  // work when either would be exceeded, and applies its own ceiling to whichever this object
  // leaves out. Left unset or zero, nothing is rendered, on the same rule as Capacity. It carries
  // the same bucket floor and for the same reason — the store checks against one whole bucket's
  // worth of keys, so a limit below that is a tier that can never receive one.
  //
  // +k8s:validation:minimum=0
  optional int64 keyLimit = 3;

  // Eviction is what this tier does once it is full. Left unset, nothing is rendered and the
  // store's own behavior applies, so a default that moves upstream is a change to investigate
  // rather than one this API silently restated.
  optional KVCacheBackendMemberLocalDiskEviction eviction = 4;

  // CleanAfterDelete asks this operator to empty Path when the backend is deleted, on every node
  // this group's NodeSelector picks AT THAT MOMENT. It DEFAULTS TO FALSE, and left alone the
  // directory keeps whatever it holds.
  //
  // It is a switch rather than a default because what is on that disk is the administrator's, and
  // deleting it is not a decision this operator may take on their behalf. That is also why it is
  // reachable where preparing the directory is not: removing content needs no uid, creating does.
  //
  //   - "At that moment" is the whole of the promise. Nothing stores the selector's history and the
  //     members are gone by the time cleanup runs, so narrowing NodeSelector or removing the
  //     LocalDisk block before deleting the backend leaves the dropped nodes holding their content
  //     with nothing reported about them. Delete the backend first and edit afterwards.
  //   - WHAT IS REMOVED IS THE CONTENT, NOT THE DIRECTORY, which was made by whoever prepared the
  //     node, may be a mount point, and carries an owner this operator did not choose.
  //   - The cleanup runs the image THIS GROUP runs, on the nodes it selects, with the backend's
  //     imagePullSecrets, so it does not wait on a pull the members already did.
  //   - A node this operator cannot reach in time keeps its content, and deletion is not held open
  //     for it: a finalizer waiting on a node that is gone leaves an object nobody can delete. The
  //     node gets a warning Event naming what was left.
  //   - A node where another KVCacheBackend declares an overlapping path is SKIPPED, with the same
  //     kind of Event. Nothing refuses two backends naming one directory, and emptying it for this
  //     one would take the other one's live data with it.
  optional bool cleanAfterDelete = 5;
}

// KVCacheBackendMemberLocalDiskEviction is what the tier does once it is full: drop what it already
// holds to make room, or stop taking new work.
//
// The two are different OUTCOMES rather than two settings of one knob: evicting, the tier goes on
// accepting writes indefinitely and its oldest content leaves; not evicting, the tier fills to its
// Capacity and the store stops sending it work, so what is already there stays readable.
message KVCacheBackendMemberLocalDiskEviction {
  // Enabled is whether this tier evicts at all. It DEFAULTS TO TRUE, so declaring this block
  // without it asks for eviction rather than against it.
  //
  // OMITTING THIS KEY AND WRITING `enabled: false` ARE DIFFERENT, and the default is what makes
  // them different: only the explicit false turns eviction off. Without that, declaring this block
  // merely to set a Watermark would stop the tier evicting for everyone who did so.
  //
  // Turning it off renders TWO settings, not one: an eviction policy of "none", the store's own
  // name for that value, and an explicit false on its watermark-eviction switch. They belong to
  // different layers, and eviction should be off at whichever layer ends up asking.
  //
  // +k8s:validation:default=true
  optional bool enabled = 1;

  // Policy is the order in which entries leave. FIFO drops the oldest written first, LRU the least
  // recently read. It is REFUSED together with Enabled set to false, because there is no order in
  // which nothing leaves.
  //
  //   - The enum is the two any cache would offer, deliberately, rather than every string the
  //     store's parser happens to read. It carries NO value meaning "do not evict": that is
  //     Enabled's job, and a third value saying the same thing would be a second spelling
  //     admission would then have to adjudicate against the first.
  //   - Left unset NOTHING IS RENDERED and the store's own default applies, which is first-in
  //     first-out. That earns more here than usual: the store maps a policy string it does not
  //     recognize onto no eviction at all — no error, no warning, no failure to start — so a policy
  //     is only ever sent when this API is the one that chose it, from a fixed set of spellings.
  //
  // +k8s:validation:enum=["FIFO","LRU"]
  optional string policy = 2;

  // Watermark is WHEN eviction runs: it starts once the tier passes High and stops once it is back
  // under Low, both as a percentage of Capacity. Left unset, nothing is rendered and the store's
  // own marks apply.
  //
  // It REQUIRES Capacity, which is what the percentages are of, and it is refused together with
  // Enabled set to false.
  optional KVCacheBackendMemberLocalDiskEvictionWatermark watermark = 3;
}

// KVCacheBackendMemberLocalDiskEvictionWatermark is the band eviction works between.
//
// It is a STRUCT and not two optional fields on the block above, because either mark alone describes
// nothing this operator would want to render: a high mark on its own leaves the store pairing it
// with a low mark this object never states, and the member refuses that pair at startup whenever the
// unstated default is not below it, for a reason that appears only in a container log.
message KVCacheBackendMemberLocalDiskEvictionWatermark {
  // High is the percentage of Capacity at which eviction starts. A PERCENTAGE and not a quantity:
  // the store takes a fraction of its own quota rather than a size, and a size here would restate
  // a figure Capacity already carries — one that would quietly stop matching the moment Capacity
  // moved.
  //
  // +required
  // +k8s:validation:minimum=1
  // +k8s:validation:maximum=100
  optional int32 high = 1;

  // Low is the percentage of Capacity eviction stops at, and it MUST be below High. Equal marks
  // would make every write past the mark evict, which is the thrashing a band exists to prevent.
  // The store refuses the pair when its member starts; admission refuses it here instead, where
  // the message reaches whoever wrote it.
  //
  // +required
  // +k8s:validation:minimum=1
  // +k8s:validation:maximum=100
  optional int32 low = 2;
}

// KVCacheBackendMemberStatus is one observed store member.
message KVCacheBackendMemberStatus {
  // SegmentID is the segment's unique identifier as the leader reports it.
  //
  // +required
  optional string segmentID = 6;

  // ClientID is the identifier the member process minted when it started. Unlike the advertised
  // address, it remains distinct when several host-network members run on one node.
  //
  // +required
  optional string clientID = 7;

  // SegmentName is the member's advertised address as the leader reports it. It is not unique:
  // host-network members placed on one node advertise the same address.
  //
  // +required
  optional string segmentName = 1;

  // NodeName is the node contributing this member's medium.
  optional string nodeName = 2;

  // Medium is what this member contributes, echoed from the group that selected its node.
  optional string medium = 3;

  // Protocol is the transport this member REGISTERED with when it mounted its segment.
  //
  // It is NOT an observation. The value travels from the member's own mount request through the
  // leader's listing unchanged, so it cannot disagree with spec.transport.protocol: a member that
  // asks for a host fabric and comes up on TCP because the device is missing still reports the
  // fabric here, while serving. Agreement with the spec is therefore not confirmation that the
  // request took effect; the transport the data plane installed is only in the member's own log.
  optional string protocol = 4;

  // State is the member's state AS THE LEADER REPORTS IT, read from the leader's own segment
  // listing rather than inferred from the member Pod. The states the store defines, in this API's
  // casing: OK, Draining, Drained, GracefullyUnmounting, Unmounting, Undefined.
  //
  //   - Draining and the two unmounting states are what a shrink passes through, so the field can
  //     distinguish a member on its way out from one that is simply gone. That is the whole reason
  //     it carries the store's vocabulary instead of a summary of it.
  //   - It carries no "unreached" sentinel, because there is no pass that would write one: a
  //     listing that cannot be read leaves the PREVIOUS entries in place and says so through
  //     MembersMounted, rather than rewriting them as blank. Whether what is here was just
  //     refreshed is that condition's question, and this field never answers it.
  //   - It carries no enum marker, deliberately, unlike every enum on the spec side. The value's
  //     domain belongs to the store: a store version that adds a state would make the whole status
  //     write fail validation — not this one field, the entire object — leaving every other status
  //     field frozen at its last value. Phase, further up, is open for the same reason.
  optional string state = 5;
}

// KVCacheBackendScaleIn is what a member does on its way out.
//
// It carries a duration and NOT a policy enum. The only other policy — migrating a member's data
// before it leaves — needs the store's drain job API, which reaches the memory and NVMe-oF replicas
// alone and reports success over a disk tier it left untouched, so a policy field would ship with
// one value. It arrives when there are two; widening an enum is not a breaking change.
message KVCacheBackendScaleIn {
  // GracePeriodSeconds is the wait the operator asks a departing member for, after that member
  // deregisters its local disk tier. It renders into the preStop hook as the endpoint's
  // grace_period_seconds and nothing else reads it. A plain int32, because unset and zero mean the
  // same thing here: deregister the tier, then do not wait.
  //
  //   - The TIER is the only thing deregistered on the way out. A memory segment is dropped rather
  //     than drained, so shrinking a group loses the memory it held — a cost rather than a fault
  //     for a cache, whose content is recomputable.
  //   - No hook drains that segment because the member REFUSES to unmount it. Measured against
  //     Mooncake 0.3.13, on members this operator rendered: both of the member's unmount routes
  //     answer 500 for the segment its rendered startup asks for, at every grace period tried, using
  //     the id the leader itself publishes for that segment; the two refusals name two different
  //     record sets as the ones searched. On the same member in the same session, the same route
  //     answers 200 for a segment mounted through the member's own mount route.
  //     So this is NOT a question of identifying the member: one holding the exactly correct id for
  //     a segment it is certain is its own is refused just the same. No identity supplied here --
  //     a Pod address, a client id -- changes that answer.
  //   - It does NOT hold the tier open, so sizing it to let in-flight peer reads finish sizes it
  //     against something that does not happen. Measured against Mooncake 0.3.13: deregistration
  //     takes effect at once and the process then waits the full value regardless, so a peer
  //     reading a disk-resident key gets a clean miss for the whole window rather than at the end
  //     of it. Another backend image may behave otherwise; what this operator guarantees is the
  //     value it sends.
  //   - The Pod's terminationGracePeriodSeconds is DERIVED from this rather than set beside it, so
  //     the kubelet cannot kill the container in the middle of the wait this configures.
  //   - Setting it does NOT protect the same edit that shrinks the group: a Pod runs the template
  //     it was CREATED from, so a departing member leaves with whatever grace it started with. To
  //     make a grace apply to a shrink, change only this field and wait for the members to be
  //     recreated with it — their pod-spec-hash annotation moves — then narrow the selector.
  //   - The upper bound is the entrypoint's own, which refuses a larger value with HTTP 400.
  //
  // +k8s:validation:minimum=0
  // +k8s:validation:maximum=3600
  optional int32 gracePeriodSeconds = 1;
}

// KVCacheBackendSpec defines the desired spec of KVCacheBackend.
message KVCacheBackendSpec {
  // Type is the backend IMPLEMENTATION — who does placement, eviction, replication and metadata.
  // It is NOT the medium: where the bytes live is members[].medium.
  //
  // One value ships, spelled out rather than assumed, so a second implementation widens an enum
  // instead of reinterpreting an absent field.
  //
  // +k8s:validation:default="Mooncake"
  // +k8s:validation:enum=["Mooncake"]
  optional string type = 1;

  // Image is the container image every role of this backend runs.
  //
  //   - Left unset, the cluster-wide "kv-cache-backend-image" Setting applies, which is where a
  //     version this project has verified belongs. Set here, it overrides that Setting for this
  //     backend alone.
  //   - Unset in BOTH places is refused at admission, naming both.
  //   - It is never DERIVED from the operator's own image the way the Device Manager's is: the
  //     master and the engine client can be builds against different accelerator generations, so
  //     a derived image would silently pair a master with a runtime it cannot load.
  //
  // +k8s:validation:maxLength=512
  optional string image = 2;

  // ImagePullPolicy is the policy every role of this backend pulls its image with.
  //
  //   - Left unset, the operator RESOLVES it from the image tag by the rule the API server would
  //     otherwise have applied: Always for :latest or for an image naming no tag at all,
  //     IfNotPresent for anything else. It re-resolves whenever the image or this field moves,
  //     and resolves rather than leaving the field empty so the rendered workload stays
  //     comparable against it.
  //   - It does NOT inherit the cluster-wide "image-pull-policy" Setting, which is a value of the
  //     bundled-application chart install and reaches nothing a controller renders.
  //
  // +k8s:validation:enum=["Always","IfNotPresent","Never"]
  optional string imagePullPolicy = 5;

  // ImagePullSecrets names the secrets that pull this backend's images, on every role. They live
  // in the namespace the workloads run in, which is this operator's own.
  //
  //   - Without it a private registry is unreachable: no role runs under a service account of
  //     ours carrying credentials, and the cluster-wide "image-pull-secrets" Setting reaches only
  //     the bundled-application chart.
  //   - The list is ATOMIC, replaced whole rather than merged. A structural schema keys a list
  //     only by a required, non-nullable field, and LocalObjectReference's name is neither.
  //
  // +listType=atomic
  // +k8s:validation:maxItems=32
  repeated .k8s.io.api.core.v1.LocalObjectReference imagePullSecrets = 6;

  // Connection describes how this backend is reached: managed by this operator, or external.
  // Exactly one is set, enforced by the webhook.
  //
  // +required
  optional KVCacheBackendConnection connection = 3;

  // Transport describes the data plane the members use.
  //
  // The empty object is the default, and it has to be: structural-schema defaulting does not
  // descend into an ABSENT object, so a spec that never mentions a transport would store no
  // protocol at all and protocol's own default would silently not apply.
  //
  // +k8s:validation:default={}
  optional KVCacheBackendTransport transport = 4;
}

// KVCacheBackendStatus defines the observed state of KVCacheBackend.
message KVCacheBackendStatus {
  // Phase summarizes the conditions: Provisioning, Ready, Degraded, Error, Deleting. It is
  // derived from the leader's own health document rather than from its Pod phase — a Running
  // Pod whose leader reports its service not ready is Provisioning, not Ready.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis: LeaderAvailable, MembersMounted,
  // CapacityObserved, Deletable. Every one is derived from an observed document.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // Endpoints are this backend's addresses, one entry per named role — the same shape the
  // external branch takes as input. A managed backend fills both from its own Service; an
  // external one echoes what was declared.
  //
  // +listType=map
  // +listMapKey=name
  repeated KVCacheBackendEndpoint endpoints = 4;

  // Capacity is what the leader reports it has and has allocated. It is ABSENT until a scrape
  // succeeds, and absent again is not the same as reporting zero: an empty object here would be
  // indistinguishable from a scrape that returned nothing.
  optional KVCacheBackendCapacity capacity = 5;

  // Members is one entry per observed store member.
  //
  // +listType=map
  // +listMapKey=segmentID
  repeated KVCacheBackendMemberStatus members = 6;

  // UsedBy names the objects that consume this backend. A non-empty UsedBy is what the
  // finalizer refuses deletion on, so the field is the enforcement input and not a display.
  //
  // It is written by the CONSUMERS, not by this backend's own reconciler, which only reads it and
  // holds its teardown on it. Today exactly one consumer writes here: a KVCachePool claims the
  // backend it draws from, under kind KVCachePool, and drops the claim only after removing what it
  // registered on that backend's master. Entries leave Namespace empty, a backend being
  // cluster-scoped and so is everything that claims one. KVCacheObjectReference's own doc says why
  // the shape is neither of the two core reference types.
  //
  // +listType=map
  // +listMapKey=kind
  // +listMapKey=namespace
  // +listMapKey=name
  repeated KVCacheObjectReference usedBy = 7;
}

// KVCacheBackendTransport is the data plane the members use.
message KVCacheBackendTransport {
  // Protocol is the transport the members are ASKED to use. Auto resolves to TCP.
  //
  //   - TCP is the universal fallback. RDMA, EFA, HIP and Ascend are peers of one another, each a
  //     fabric- or vendor-specific fast path rather than a spelling of TCP: EFA in particular is
  //     reached through libfabric's SRD provider and has no RC queue pairs, so the RDMA transport
  //     cannot drive it.
  //   - Whether a member came up on what it asked for is NOT visible through this API.
  //     status.members[].protocol echoes this request back rather than reporting a result, so a
  //     member that fell back to TCP still reads as the fabric there, while serving. Only the
  //     member's own log says which transport the data plane installed.
  //   - Auto is deliberately NOT a per-node probe that promotes itself to a faster fabric: a member
  //     group renders one DaemonSet, whose single Pod template cannot carry a different transport
  //     per node, and promoting to RDMA grants hostNetwork and two capabilities — a privilege is
  //     requested, never inferred on an operator's behalf.
  //   - Membership in this enum means MEASURED AS COMPILED into a published artifact, which is what
  //     excludes the other ten strings that artifact's config parser accepts. It does not mean
  //     measured to move bytes: only TCP has been exercised end to end.
  //   - A host fabric needs two things this API cannot check: the member image must carry the
  //     runtime its transport links — CANN for Ascend, libfabric for EFA — and the NODE must run a
  //     device plugin, since a hostPath alone leaves the device cgroup refusing to open the device.
  //     Which resource the member asks for is deviceResourceName below.
  //
  // +k8s:validation:default="Auto"
  // +k8s:validation:enum=["Auto","TCP","RDMA","EFA","HIP","Ascend"]
  optional string protocol = 1;

  // DeviceResourceName is the extended resource a host-fabric member asks one of, so the device
  // cgroup lets it open the fabric device. It is CONSULTED ONLY on the RDMA and EFA protocols;
  // beside any other it renders nothing.
  //
  //   - It is DECLARED rather than derived: the name belongs to whichever plugin the cluster's
  //     administrator installed, so no name hard-coded here would be right on two clusters, and no
  //     admission rule can check a node for a plugin whose resource it cannot know.
  //   - EFA is the exception. Its plugin advertises exactly one name, so an EFA member asks for
  //     vpc.amazonaws.com/efa when this is unset. That is a default rather than a property of the
  //     protocol, and setting the field overrides it.
  //   - UNSET IS NOT A SAFE DEFAULT, IT IS THE OLD BEHAVIOR. A fabric member naming no resource
  //     mounts the device tree and requests nothing, so the cgroup refuses the open, the store
  //     installs TCP, and the object still reads as the fabric it asked for. Naming one instead
  //     keeps the member off a node that advertises none, which is the safer failure but not
  //     always the wanted one, so both stay reachable.
  //
  // The bounds below are the API server's own for a resource name: 63 characters after the slash
  // and for each domain label, refused here rather than on the DaemonSet rendered from it, where
  // they strand reconciliation with no obvious cause. The domain's 253-character limit is NOT among
  // them — no regular expression can bound a repeated group whose labels vary in length, so
  // 63.63.63.62 makes a domain of 254 that the 317 below still admits — and admission carries that
  // one instead, so it is absent when the webhook is not installed.
  //
  // +k8s:validation:pattern="^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*/[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$"
  // +k8s:validation:maxLength=317
  optional string deviceResourceName = 2;
}

// KVCacheObjectReference names an object that consumes another one in this group. It is the ONE
// shape every usedBy in this family carries, so a reader learns it once.
//
// It names NO API GROUP, and that is a constraint rather than an omission: a usedBy entry may only
// name a kind in this API group, within which kind and name identify an object. The constraint is
// what lets the list be keyed at all — core.TypedLocalObjectReference carries an optional,
// defaultless apiGroup, which a structural schema refuses as a list map key, so keying on kind and
// name alone would silently merge two objects that differ only by group.
//
// All three fields are REQUIRED, and all three are list map keys: a structural schema accepts a key
// only where it is required or defaulted, and two consumers collapsing into one entry would let a
// finalizer release while a consumer still holds. Namespace carries the EMPTY STRING when the
// referent is in the holder's own scope, so empty is a value here, not an absence.
message KVCacheObjectReference {
  // +required
  optional string kind = 1;

  // +required
  optional string namespace = 2;

  // +required
  optional string name = 3;
}

// KVCachePool is the schema for worker.gpustack.ai.
//
// A KVCacheBackend declares the physical cache; this declares which namespaces are granted a quota on
// it, how much of it, and under which reuse identity. It is Kueue's ClusterQueue to
// KVCachePoolBinding's LocalQueue: the quota domain over exactly one backend, and the registry of the
// reuse domains its Bindings have claimed.
//
// It GRANTS AND ACCOUNTS; IT DOES NOT ADMIT — nothing here keeps a pod that knows a reuse domain's
// name from reaching that domain on the store, and KVCachePoolBinding says what the grant is not. It
// is cluster-scoped for the reason its backend is: only an admin declares a privileged physical
// resource, pools must be shareable across namespaces, and a cross-namespace reference FROM a
// namespaced object is an anti-pattern. Data-plane isolation is a different axis, solved by the
// storage layer's tenant rather than by this object's scope.
//
// +genclient
// +genclient:nonNamespaced
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Cluster",categories=["gpustack"],shortName=["kvcp"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Quota",type="string",jsonPath=".spec.quota.total"
// +k8s:crd-gen:printcolumn:name="Usage",type="string",jsonPath=".status.usage.total"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Endpoint",type="string",jsonPath=".status.clientEndpoint"
// +k8s:crd-gen:printcolumn:name="Age",type="date",jsonPath=".metadata.creationTimestamp"
message KVCachePool {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional KVCachePoolSpec spec = 2;

  optional KVCachePoolStatus status = 3;
}

// KVCachePoolBinding is the schema for worker.gpustack.ai.
//
// It is the PROVISIONING POINT: creating one in a namespace is what gives that namespace a quota on
// a pool and registers the ONE reuse domain it will write under, so both are objects an admin can
// RBAC and audit rather than strings a tenant types into a workload.
//
// The storage layer's tenant IS the domain, so registering one creates a quota ledger, which is what
// makes naming a domain a privileged act rather than something a workload could mint at will.
// Workloads pointing at the SAME Binding share KV; a namespace needing two reuse boundaries creates
// two Bindings, exactly as one with two scheduling boundaries has two Kueue LocalQueues.
//
// It is NOT an enforcement boundary, and must not be described as one. The store accepts whatever
// tenant id a caller sends, over a Service any pod in the cluster can dial, and nothing derives a
// credential from this object — so a workload that knows another namespace's domain name can read
// and write that domain's cache today. What a Binding governs is who is GRANTED capacity and under
// which name. Enforcement needs an authenticated proxy or network isolation, and neither exists yet.
//
// +genclient
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Namespaced",categories=["gpustack"],shortName=["kvcpb"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Pool",type="string",jsonPath=".spec.poolRef.name"
// +k8s:crd-gen:printcolumn:name="Domain",type="string",jsonPath=".spec.domain.name"
// +k8s:crd-gen:printcolumn:name="Effective",type="string",jsonPath=".status.effectiveQuota"
// +k8s:crd-gen:printcolumn:name="Usage",type="string",jsonPath=".status.usage"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Age",type="date",jsonPath=".metadata.creationTimestamp"
message KVCachePoolBinding {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional KVCachePoolBindingSpec spec = 2;

  optional KVCachePoolBindingStatus status = 3;
}

// KVCachePoolBindingDomain is the reuse identity: what the cache isolates on, and what its blocks
// are shaped like.
message KVCachePoolBindingDomain {
  // Name is the domain, and it becomes the storage layer's tenant_id verbatim.
  //
  //   - It must be claimed by NO OTHER BINDING on a master that serves this Binding's pool, which
  //     the webhook enforces: two Bindings on one domain over one master would share cache —
  //     possibly intended — but collide on one quota ledger, which never is. Uniqueness is per
  //     master rather than per pool because one master can serve several pools and the tenant space
  //     is master-global; it is not cluster-wide because two masters hold two ledgers.
  //   - The accepted shape is a DNS-1123 label, checked by the webhook. That is strictly inside
  //     what the master accepts as a tenant_id and is what a Kubernetes object name already looks
  //     like, so nobody learns a second naming rule. This is the ONLY place the shape is judged;
  //     every consumer downstream copies the name rather than re-judging it.
  //
  // +required
  // +k8s:validation:maxLength=63
  optional string name = 1;

  // BlockSize is the number of tokens one cache block holds.
  //
  // +required
  optional int32 blockSize = 2;

  // Dtype is the element type the cached tensors carry, in the engine's own lowercase spelling.
  //
  // The exhaustive set belongs to whatever spec owns workloads, so this API does not enumerate it —
  // that would make a new engine dtype an API change — and the webhook judges the syntactic form
  // only. It is spelled to match its JSON name exactly; DType would not, and the openapi generator
  // records every such mismatch as a checked-in API rule violation.
  //
  // +required
  // +k8s:validation:maxLength=32
  optional string dtype = 3;
}

// KVCachePoolBindingList holds the list of KVCachePoolBinding.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message KVCachePoolBindingList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated KVCachePoolBinding items = 2;
}

// KVCachePoolBindingPoolReference names the cluster-scoped pool this Binding grants.
//
// It carries no namespace, and that is the point: a pool is cluster-scoped, so there is none to
// name, and no namespaced object here ever reads across a namespace boundary.
message KVCachePoolBindingPoolReference {
  // +required
  optional string name = 1;
}

// KVCachePoolBindingReference names one KVCachePoolBinding.
//
// It carries no kind, unlike KVCacheObjectReference, because it is not a usedBy: it is the back
// pointer from a registered domain to the one object that could have declared it, and only a
// KVCachePoolBinding ever can. Both fields are required, a Binding being namespaced.
message KVCachePoolBindingReference {
  // +required
  optional string namespace = 1;

  // +required
  optional string name = 2;
}

// KVCachePoolBindingSpec defines the desired spec of KVCachePoolBinding.
message KVCachePoolBindingSpec {
  // PoolRef names the pool this namespace is being granted. It is IMMUTABLE, webhook-enforced:
  // re-pointing a Binding would move a namespace's grant silently and leave its bytes on
  // the old master.
  //
  // +required
  optional KVCachePoolBindingPoolReference poolRef = 1;

  // Domain is the reuse identity this Binding registers, and it is REQUIRED. It maps to the
  // storage layer's tenant_id (isolation) and cache_salt (prefix identity), so registering a
  // domain creates a tenant with a quota ledger of its own.
  //
  // It is a STRUCT rather than a list deliberately, so the cardinality is structural and not a
  // webhook rule: one Binding is one tenant, every figure in Status is a single series rather than
  // a sum, and no rule for dividing one ceiling among several domains has to be invented.
  //
  // EVERY FIELD IS IMMUTABLE, webhook-enforced. Name re-points this namespace at a different
  // ledger and strands the old one. BlockSize or Dtype changed under a warm cache is silent
  // corruption: the writes succeed, the reads succeed, and the tensors are wrong.
  //
  // +required
  optional KVCachePoolBindingDomain domain = 2;

  // QuotaCeiling is what this namespace may consume in its reuse domain, written verbatim into that
  // one tenant's requested quota rather than kept as a total this operator maintains.
  //
  //   - IT IS A REQUEST, NOT A GRANT. The pool reduces every tenant's effective quota in proportion
  //     when the sum of requests exceeds allocatable capacity, and Status.EffectiveQuota is what
  //     was actually granted.
  //   - EXCEEDING IT EVICTS RATHER THAN REFUSES, which is the opposite of what the word suggests.
  //     A write past the ceiling is not rejected: the store frees room by dropping this namespace's
  //     own older objects and retries. A ceiling set too low therefore costs cache inside this
  //     namespace rather than failed writes, and costs it without any counter moving. Writes are
  //     refused only when eviction cannot free enough, which needs those older objects held by
  //     unexpired read leases.
  //   - It is REQUIRED, because the state it would otherwise allow does not work: the storage layer
  //     has no default policy and refuses a tenant it holds no policy for, so a Binding without
  //     this field would pass admission, report Ready and refuse every byte its workloads wrote.
  //   - A value that is not positive is refused at admission.
  //
  // +required
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity quotaCeiling = 3;
}

// KVCachePoolBindingStatus is the namespace's own view of the pool: what it asked for, what the pool
// actually granted, what it is using, and whether it is over.
//
// Every figure below is read from ONE tenant's series, because a Binding registers exactly one reuse
// domain and the storage layer's tenant IS that domain: nothing here is summed, and no figure can
// hide a second domain behind it.
//
// Every observed figure below is ABSENT rather than zero when it was not observed, and the two say
// different things: a figure reading zero was measured as zero, and a missing figure was not
// measured at all. Reading an absent one as zero is the mistake this distinction exists to prevent.
message KVCachePoolBindingStatus {
  // Phase summarizes the conditions: Provisioning, Ready, Degraded, Error, Deleting.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // RequestedQuota is what the operator asked the pool for on this namespace's behalf: the
  // requested quota it wrote for this Binding's one tenant. It is absent, with a Condition saying
  // why, whenever the operator refused to write — a master that answered that multi-tenancy is
  // off, or a policy source it cannot rewrite.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity requestedQuota = 4;

  // EffectiveQuota is what the pool actually granted. It is LOWER than RequestedQuota whenever the
  // sum of every tenant's request exceeds the pool's allocatable capacity: the pool then recomputes
  // each tenant's effective quota in proportion to what that tenant requested. A pool with no
  // mounted members grants ZERO to everyone, and that case carries its own Condition rather than
  // appearing as an ordinary shortfall. A granted zero is reported as zero; a quota nobody could
  // read is absent instead, because the two are different answers.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity effectiveQuota = 5;

  // Usage is what the master reports this namespace's reuse domain as holding, and WHICH figure
  // that is depends on the master's version rather than on this API.
  //
  // A master exposing used bytes apart from reservations is read as committed bytes, in-flight
  // writes deliberately left out — a burst of concurrent writes would otherwise read as consumption
  // that never happened. A master exposing one charged figure instead, the shape 0.3.13 introduced,
  // charges it when a write STARTS, so in-flight reservations are inside this number and cannot be
  // subtracted. The Binding's own QuotaObserved message says which of the two answered.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity usage = 6;

  // OverQuota is true when Usage exceeds EffectiveQuota, and it does NOT mean the domain tried to
  // write more than it was granted. The store never charges a domain past its grant, so writing past
  // it leaves Usage AT the grant and this false; what happens on that path instead is that the store
  // evicts the domain's OWN objects to make room and admits the write, and a write fails only while
  // every object holding the grant is pinned and nothing can be evicted.
  //
  // So this reports ONE situation: the grant was RECUT below what the domain already holds, which is
  // what a proportional cut does when the pool's members shrink or another Binding joins. Waiting on
  // it as the signal that writes are being refused is waiting for something that never arrives.
  //
  // An observed false — the ordinary, healthy case — is reported AS false. This field is absent only
  // when the tenant could not be scraped at all. Those two readings are the easiest pair here to
  // confuse and they mean opposite things.
  optional bool overQuota = 7;

  // Blocks and HitRate are OBSERVED from the master and the engine, never declared. They are absent
  // when the scrape does not carry this tenant, because a fabricated zero hit rate on a warm cache
  // is worse than no number at all. Zero blocks and "not in the scrape" are different facts here as
  // well: zero is a measurement, absence is the lack of one.
  optional int64 blocks = 8;

  // HitRate is a ratio held as a STRING with a pattern, never a float. See the pool's own HitRate
  // for why a pattern is safe on a computed ratio and what it obliges of whoever writes it.
  //
  // +k8s:validation:pattern="^(0(\\.[0-9]{1,4})?|1(\\.0{1,4})?)$"
  optional string hitRate = 9;

  // UsedBy names the workloads in THIS namespace that hold the pool through this Binding — always a
  // single-scope query, and a non-empty UsedBy is what the finalizer refuses deletion on.
  //
  // IT IS WRITTEN BY THE CONSUMER, NOT BY THIS API'S OWN RECONCILER, which only reads it and
  // enforces on it. The kind that writes it is ModelDeployment, whose spec.kvCache.poolRef names a
  // Binding in its own namespace, so an empty list is not evidence that nobody holds the pool.
  // Entries leave Namespace empty, everything that can appear being in this Binding's own namespace.
  //
  // +listType=map
  // +listMapKey=kind
  // +listMapKey=namespace
  // +listMapKey=name
  repeated KVCacheObjectReference usedBy = 10;
}

// KVCachePoolDomain is one reuse identity registered against this pool: what it is, who declared it,
// and what the master reports about it.
message KVCachePoolDomain {
  // Name is the reuse identity, and it is the storage layer's tenant_id.
  //
  // +required
  // +k8s:validation:maxLength=63
  optional string name = 1;

  // Binding is the object that declared this domain. It is the only place a domain can be
  // declared, which is what keeps naming one a privileged act.
  //
  // +required
  optional KVCachePoolBindingReference binding = 2;

  // BlockSize and Dtype are echoed from the Binding that registered the domain, so a reader of
  // the registry does not have to fetch every Binding to learn what a domain's blocks are.
  //
  // Both are REQUIRED, unlike the observed figures below, because they are copied from a Binding
  // that already requires them: an entry missing one could only be a writer bug, and leaving them
  // optional would let the registry answer "this domain's blocks are of unknown shape", which is
  // not a state that exists.
  //
  // Dtype is spelled to match its JSON name exactly. DType would not, and the openapi generator
  // records every such mismatch as a checked-in API rule violation.
  //
  // +required
  optional int32 blockSize = 3;

  // +required
  optional string dtype = 4;

  // Blocks and HitRate are OBSERVED, never declared, and they are ABSENT when the scrape does not
  // carry this domain. A fabricated zero hit rate on a warm cache is worse than no number, and
  // zero blocks is a different fact from "not in the scrape".
  optional int64 blocks = 5;

  // HitRate is a ratio held as a STRING with a pattern, never a float, matching the shape the
  // measured surface itself uses. The pattern is safe here in a way an enum on an echoed vendor
  // value would not be, because this ratio is COMPUTED by this operator. It does oblige whoever
  // writes it to format to this shape: a value that fails the pattern fails the WHOLE status write,
  // freezing every other field at its last value, not just this one.
  //
  // +k8s:validation:pattern="^(0(\\.[0-9]{1,4})?|1(\\.0{1,4})?)$"
  optional string hitRate = 6;
}

// KVCachePoolList holds the list of KVCachePool.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message KVCachePoolList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated KVCachePool items = 2;
}

// KVCachePoolQuota is the pool's declared ceiling.
//
// It is OUR number, not the master's. The master reports its own allocatable capacity and the two
// can disagree; the case where the disagreement is total — a ceiling declared over a backend that
// has mounted nothing — is a Condition rather than a silence.
message KVCachePoolQuota {
  // Total is required: a pool with no declared ceiling has nothing to write into any ledger.
  //
  // +required
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity total = 1;
}

// KVCachePoolSpec defines the desired spec of KVCachePool.
message KVCachePoolSpec {
  // Backends names the KVCacheBackend this pool draws from. Each entry is the backend's NAME, not
  // an object reference: there is no kind or namespace to write alongside it.
  //
  //   - Exactly one entry is admitted, and the rule is the webhook's rather than the schema's so the
  //     refusal can carry its reason: quota lands on a single master's per-tenant ledger, and one
  //     master cannot account for bytes held in another backend.
  //   - It is IMMUTABLE, webhook-enforced. Moving a pool to another backend would strand every
  //     tenant quota on the old master's ledger with nothing left to delete them with.
  //   - The reverse is NOT exclusive: one backend may be referenced by several pools, which is why
  //     the ledger and the rendered policy converge per MASTER rather than per pool.
  //
  // +required
  // +listType=atomic
  repeated string backends = 1;

  // Quota is the ceiling this pool declares over its backend.
  //
  // +required
  optional KVCachePoolQuota quota = 2;
}

// KVCachePoolStatus defines the observed state of KVCachePool.
message KVCachePoolStatus {
  // Phase summarizes the conditions: Provisioning, Ready, Degraded, Error, Deleting.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // ClientEndpoint is the address an inference engine connects to, echoed from the backend's
  // Client endpoint.
  //
  // It is absent, with a Condition saying why, whenever the backend has published no endpoints yet,
  // and is never filled from a Service name derived from the backend's own — a guessed address that
  // happens to resolve is how a pool would silently drive the wrong master.
  //
  // The backend's ADMIN address is deliberately republished NOWHERE. That one port serves the
  // Prometheus exposition and the HTTP admin API both, so it is the write face of the quota ledger,
  // while this object is cluster-scoped and readable by anyone holding a pool RBAC rule.
  //
  // +k8s:validation:maxLength=259
  optional string clientEndpoint = 4;

  // Usage is what this pool's own tenants are holding. It is ABSENT until a scrape succeeds, and
  // absent is not the same as reporting zero.
  optional KVCachePoolUsage usage = 5;

  // Domains is the registry of reuse identities claimed against this pool, one entry per Binding.
  //
  // It is AUTHORITATIVE rather than advisory: an entry exists because a Binding declares it, not
  // because a workload announced itself, so assembling it is one pass over the Binding index and
  // needs no watch on any workload kind.
  //
  // +listType=map
  // +listMapKey=name
  repeated KVCachePoolDomain domains = 6;

  // UsedBy names the Bindings that hold this pool. A non-empty UsedBy is what the finalizer
  // refuses deletion on, so the field is the enforcement input and not a display.
  //
  // Unlike the Binding's own list, THIS one is written by this API's reconciler, which already
  // lists the Bindings of a pool through its index. The two levels of usedBy therefore have
  // different writers, and only this one is self-contained.
  //
  // +listType=map
  // +listMapKey=kind
  // +listMapKey=namespace
  // +listMapKey=name
  repeated KVCacheObjectReference usedBy = 7;
}

// KVCachePoolUsage is what the pool's tenants hold, as the master reports it.
message KVCachePoolUsage {
  // Total is the sum of the occupancy the master reports for the tenants THIS pool owns — never its
  // whole ledger, which a shared backend makes larger than this pool. An unobserved total is ABSENT
  // rather than zero, because a zero here would read as an empty cache.
  //
  // WHAT occupancy means is the master's choice, not this API's, and it changed: a master exposing
  // used bytes apart from reservations is summed as committed bytes, while one exposing a single
  // charged figure — the shape 0.3.13 introduced — charges at the start of a write, so in-flight
  // reservations are already inside this total. Do not read it as committed usage without knowing
  // which the backend runs.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity total = 1;
}

// ModelDeployment is the schema for worker.gpustack.ai.
//
// It is N replicas of one inference-engine role attached to a KV cache pool, so that the replicas
// hit each other's cached prefixes instead of each re-computing the same prefill.
//
// It RENDERS PODS DIRECTLY. The admission chain keys on Pods, so rendering Pods reuses every
// existing gate with no new integration point.
//
// +genclient
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Namespaced",categories=["gpustack"],shortName=["md"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Engine",type="string",jsonPath=".spec.engine"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Endpoint",type="string",jsonPath=".status.endpoint"
message ModelDeployment {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional ModelDeploymentSpec spec = 2;

  optional ModelDeploymentStatus status = 3;
}

// ModelDeploymentKVCache attaches the deployment to a KV cache pool.
//
// THE REUSE DOMAIN IS NOT DECLARED HERE, AND THAT IS A SECURITY PROPERTY. The storage layer's tenant
// IS the reuse domain, so every distinct domain is a tenant with its own quota ledger: a workload
// free to name arbitrary domains could mint unlimited tenants in its namespace and escape the
// namespace quota ceiling entirely. Domain naming therefore lives on the KVCachePoolBinding, which
// an admin owns.
message ModelDeploymentKVCache {
  // PoolRef names a KVCachePoolBinding IN THIS NAMESPACE. The Binding is the authorization point:
  // an admin creating one in a namespace is what grants that namespace access to the pool. The
  // type is a LocalObjectReference rather than a namespaced one so that reaching another
  // namespace — or naming the cluster-scoped pool, or a bare endpoint URL — is unrepresentable
  // rather than merely rejected.
  //
  // +required
  optional .k8s.io.api.core.v1.LocalObjectReference poolRef = 1;

  // Connector selects how the engine's transfer configuration is produced. "auto" synthesizes it
  // from the pool's backend type and the engine. There is no "none" — synthesizing nothing is
  // reachable through a full command replacement, which also marks the role unmanaged and moves
  // CacheAttached to Unknown.
  //
  // THE KV TRANSFER CONVERGES ON MOONCAKE, and that is why the enum has one value. Mooncake is the
  // implementation that supports heterogeneous prefill and decode, which is the shape this API
  // exists to express. NIXL and ROCm NIXL stay reachable; nothing here has run them, and no claim
  // that they would work is made by this field's existence.
  //
  // THE RESERVATION IS IN THE SCHEMA AND IN NOTHING ELSE. This field is read by no code: binding
  // resolution passes a domain, an endpoint and a protocol; connector synthesis takes an engine, a
  // kind, a manufacturer and that connection; and the renderer dispatches on the ENGINE. The struct
  // named Connector in the render path is the synthesized result, not this value. So the
  // discriminator is reserved for an API that names a second one, and the seam it would dispatch
  // through does not exist yet.
  //
  // WIDENING THE ENUM IS FOUR THINGS, NOT ONE: one sub-package under pkg/worker/kvcache, one entry
  // here, one renderer, AND the wiring that threads this value to a dispatch point. That last item
  // is what the reservation does not already cover, and it is the reason a second implementation is
  // a piece of work rather than a constant.
  //
  // A WIDENED ENUM REACHES NEW DEPLOYMENTS ONLY. This field answers which deployment this is, so it
  // is frozen after creation: an existing deployment is recreated onto a second connector rather
  // than edited onto one. That is stated here because "widening the enum" otherwise reads as a
  // migration path for deployments that are already running.
  //
  // +k8s:validation:default="auto"
  // +k8s:validation:enum=["auto"]
  optional string connector = 2;
}

// ModelDeploymentKVCacheDomain is the reuse identity echoed from the Binding.
message ModelDeploymentKVCacheDomain {
  // Name is the reuse identity, and it is the storage layer's tenant. Two deployments echoing the
  // same name share KV; two echoing different names do not.
  //
  // +required
  // +k8s:validation:maxLength=63
  optional string name = 1;

  // BlockSize and Dtype are what this domain's blocks are made of. They are echoed rather than
  // validated here: the Binding requires and freezes both, so an entry missing one could only be
  // a writer bug.
  //
  // +required
  optional int32 blockSize = 2;

  // +required
  optional string dtype = 3;
}

// ModelDeploymentKVCacheStatus is the reuse domain this deployment attached to.
//
// Every field is READ FROM THE BINDING, never declared here. It is echoed onto this object so that
// diagnosing a cache that is not shared takes one object rather than two — a wrong block size or
// dtype is silent cache pollution, where writes succeed, reads succeed and the tensors are wrong.
message ModelDeploymentKVCacheStatus {
  // Binding is the KVCachePoolBinding this deployment resolved, in this namespace.
  //
  // +required
  optional string binding = 1;

  // Pool is the KVCachePool that Binding points at.
  //
  // +required
  optional string pool = 2;

  // Domain is the reuse identity, echoed from the Binding's immutable domain block.
  //
  // +required
  optional ModelDeploymentKVCacheDomain domain = 3;
}

// ModelDeploymentList holds the list of ModelDeployment.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message ModelDeploymentList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated ModelDeployment items = 2;
}

// ModelDeploymentModel names the model the engine serves.
//
// It provisions nothing. Weights arrive through the role template's volumes or through the engine's
// own hub client; a weight-provisioning block here would be the first step towards the
// general-purpose serving CR this deliberately is not.
message ModelDeploymentModel {
  // Name is the identifier the engine serves, e.g. "Qwen/Qwen2.5-72B-Instruct".
  //
  // +required
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=253
  optional string name = 1;
}

// ModelDeploymentRole is one engine role and its replicas.
//
// Replicas and InstanceType are STRUCTURED FIELDS AND MUST STAY SO. They are inputs to admission and
// scheduling — Kueue PodSet counts and flavor selection — so a template that could shadow them would
// make the admission feasibility check read a ledger that does not match reality. The template may
// override container content and nothing else.
message ModelDeploymentRole {
  // Name identifies the role, and it is also the name of the Kueue PodSet the role becomes.
  //
  //   - The pattern is Kueue's own PodSetReference shape, enforced here because the name is written
  //     verbatim into each Pod's role-hash annotation: Kueue groups a pod group's Pods into PodSets
  //     by that annotation, so a name it cannot take as a PodSet reference is a name whose role does
  //     not survive the grouping.
  //   - UNIQUENESS IS THE SCHEMA'S. Roles is a list-map keyed on this field, so the API server
  //     refuses a duplicate before any webhook runs; the webhook carries the same rule only as a
  //     backstop for that marker being dropped. Two roles sharing a name would collapse into one
  //     PodSet whose count is their sum, which is a silent merge rather than an error.
  //
  // +required
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=63
  // +k8s:validation:pattern="^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  optional string name = 1;

  // Replicas is how many Pods this role runs. They are NOT independent Workloads: every replica of
  // every role joins one Kueue pod group, so the deployment is admitted as a unit or not at all.
  //
  // CHANGING THIS NUMBER REBUILDS THE GROUP. It moves the total the group declares, which every Pod
  // carries and which Kueue requires them all to agree on, so the operator deletes the group's Pods
  // and recreates them under the new total rather than adding or trimming a few. A replica that
  // leaves loses its cached blocks to its siblings.
  //
  // +k8s:validation:default=1
  // +k8s:validation:minimum=1
  optional int32 replicas = 2;

  // InstanceType is the name of the InstanceType whose pool this role's Pods are admitted against.
  // It is what the queue-name entrance label is derived from.
  //
  // +required
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=253
  optional string instanceType = 3;

  // Resources is what one replica of this role asks of an accelerator, and it is a STRUCTURED
  // FIELD FOR THE SAME REASON Replicas and InstanceType are: admission and scheduling read it.
  //
  // It carries only the ACCELERATOR half of a request, because that is the only half a workload
  // decides. CPU, memory and ephemeral storage are DERIVED from the InstanceType's per-unit
  // resources scaled by the requested card count, so they are not expressible here at all — a
  // stronger guarantee than refusing them, since a field that does not exist cannot be shadowed by
  // a template either.
  //
  // InstanceType alone cannot supply this half: its UnitResources size ONE card, and how many cards
  // a replica wants is a property of the model being served, so two deployments on one InstanceType
  // routinely want different counts.
  optional ModelDeploymentRoleResources resources = 4;

  // ExtraArgs is appended AFTER the operator-synthesized arguments. An entry naming a key the
  // operator owns is REJECTED rather than merged: a silent merge produces two values for one
  // connector argument and no way to tell which one won.
  //
  // +listType=atomic
  repeated string extraArgs = 5;

  // Env is appended the same way and refused on the same terms. Keys the operator merely defaults
  // are not owned: a user's value wins there and no rejection follows.
  //
  // +patchMergeKey=name
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=name
  repeated InstanceEnvVar env = 6;

  // Template overlays the rendered container: the operator renders first and merges this on top.
  //
  //   - A non-empty Command is the TAKE-OVER tier — the user owns the whole argv, the operator
  //     synthesizes no engine arguments and no client environment, the role is marked unmanaged and
  //     CacheAttached goes to Unknown. Arguments fold into Command; there is deliberately no Args,
  //     because a second append tier beside ExtraArgs would have no defined precedence.
  //   - It is MUTABLE, unlike the one an Instance carries, which is what makes a rollout possible
  //     at all.
  //   - EDITING IT RESTARTS EVERY ROLE, not just the replicas this template belongs to: every
  //     replica of the deployment is one member of a single Kueue pod group whose members cannot
  //     leave one at a time, so the group is rebuilt whole. The same is true of a `replicas` change,
  //     of adding or removing a role, and of a departure this operator did not initiate — see
  //     docs/reference/model-deployment.md under "Rollout is recreate".
  //   - Its Resources are refused at admission. The accelerator request belongs in the role's own
  //     Resources and the rest is derived from the InstanceType, so a template able to shadow either
  //     would make the admission feasibility check read a ledger that does not match reality.
  optional ModelDeploymentTemplate template = 7;

  // Kind is what the engine is told this role is. It is CLOSED and it is NOT the role's name: Name
  // is free-form and identifies the PodSet, while this selects behavior, and a semantic reachable
  // by typing a string is one typo away from silently changing. Two roles may share a kind and
  // differ in name ONLY where that kind is Server, because a pair of servers is a set of equals and
  // two prefillers are not: nothing that consumes these roles expresses a second prefiller, so a
  // deployment declaring one would render a role no reader of the rendered configuration could
  // reach. It defaults to Server, the shape a deployment written before disaggregation existed has,
  // so such a deployment renders exactly as it did.
  //
  // +k8s:validation:default="server"
  // +k8s:validation:enum=["server","prefill","decode"]
  optional string kind = 8;
}

// ModelDeploymentRoleResources is what one replica of a role asks of an accelerator.
//
// It deliberately mirrors the accelerator fields of InstanceResources — the same names, the same
// meanings — rather than inventing a second vocabulary for one request, and it deliberately omits
// that type's CPU, RAM and LocalStorage, which are derived here rather than declared.
message ModelDeploymentRoleResources {
  // Accelerator is how many accelerator cards ONE REPLICA asks for.
  //
  //   - Left unset on an acceleratable InstanceType it DEFAULTS TO ONE at admission, on create and
  //     on update alike, the same way an Instance's does. The value is written into the stored
  //     object rather than applied at render time, so what was admitted is what can be read back.
  //   - AN EXPLICIT ZERO IS KEPT, because it is a value the user wrote, and on an acceleratable
  //     InstanceType it asks for nothing that pool's queue accounts in. Such a role is admitted
  //     only while it is the deployment's ONLY role: add a second and the deployment is never
  //     admitted and never reports why. A zero is safe to state alone and unsafe to combine.
  //   - A replica meant to run without an accelerator belongs on an InstanceType that is not
  //     acceleratable, where CPU is what the queue accounts in.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity accelerator = 1;

  // AcceleratorSlicedMemoryPercentage is the per-accelerator VRAM budget requested on a sliced
  // InstanceType, as a percentage in [0,100]. 0 disables slicing, making the request an exclusive
  // whole-accelerator one. It is ignored by an InstanceType offering no slicing.
  //
  // +k8s:validation:minimum=0
  // +k8s:validation:maximum=100
  optional int32 acceleratorSlicedMemoryPercentage = 2;

  // AcceleratorSlicedCoresPercentage is the per-accelerator compute budget requested on a sliced
  // InstanceType, as a percentage in [0,100], independent of the memory percentage.
  //
  // +k8s:validation:minimum=0
  // +k8s:validation:maximum=100
  optional int32 acceleratorSlicedCoresPercentage = 3;

  // AcceleratorPartitionedProfile is the hardware partition profile requested on a
  // partition-offering InstanceType, e.g. "3g.40gb". A non-empty value is mutually exclusive with
  // the two slice percentages: hardware partitioning and software slicing cannot both apply to one
  // accelerator. It is ignored by an InstanceType offering no partition.
  //
  // +k8s:validation:maxLength=64
  optional string acceleratorPartitionedProfile = 4;
}

// ModelDeploymentRoleStatus is one role's observed readiness.
message ModelDeploymentRoleStatus {
  // Name is the role this entry describes.
  //
  // +required
  optional string name = 1;

  // Desired is how many Pods the spec asks for, and Ready is how many of them are Ready. Both are
  // ALWAYS present: they are counted from a Pod list that succeeded, so a zero here is an observed
  // zero. A failed list writes no status at all.
  optional int32 desired = 2;

  optional int32 ready = 3;

  // Unmanaged is true when the role replaced the whole command line, so the operator synthesized
  // no engine argument and no client environment for it. It is ALWAYS present, for the same reason
  // the counts are: false is the ordinary case and has to be visible as an answer rather than as a
  // missing field.
  optional bool unmanaged = 4;

  // Kind echoes the role's kind, so reading the status alone answers which half of a
  // disaggregated deployment an entry describes. It is ALWAYS present: every role has a kind,
  // defaulted if the user named none, so an absent value would mean the status was written by
  // something that did not know about kinds rather than that the role has none.
  //
  // The enum is the same one the spec field carries and has to stay that way: this field is written
  // from the spec field with the unset case resolved, so a value the writer can produce and this
  // list does not name would make every later status write on the object fail, taking every other
  // figure down with the kind. The marker sits on the field because the type's own enum marker is a
  // Go-level one and does not become schema validation.
  //
  // +k8s:validation:enum=["server","prefill","decode"]
  optional string kind = 5;

  // AssignedFlavor is the ResourceFlavor Kueue assigned to this role's PodSet for its ACCELERATOR
  // credits.
  //
  //   - NOT ASSIGNED YET AND ASSIGNED ARE DIFFERENT FACTS, so a role waiting for quota reports no
  //     flavor at all rather than an empty name, which would read as an assignment to a flavor
  //     called "".
  //   - Per role rather than per deployment, because Kueue assigns a flavor per PodSet and two
  //     roles of one deployment can be assigned different ones.
  //   - AN ADMITTED ROLE MAY STILL REPORT NOTHING HERE, and that is the field's contract rather
  //     than a gap in it. The answer is read through the same function the per-accelerator
  //     admission gate uses, which speaks only of accelerator credits, so a role admitted on a pool
  //     carrying no accelerator names a flavor for `cpu` and nothing here. The two answers are kept
  //     identical on purpose: a flavor reported here that the gate would not fit against would be
  //     worse than none.
  optional string assignedFlavor = 6;
}

// ModelDeploymentRouter is the router that fronts a deployment's roles, and how much of it this
// operator runs.
//
// Three of its five fields apply to one mode only. They are here rather than in a nested
// mode-specific struct because a user reading the type should see the whole surface at once, and
// because a field that is meaningless in the current mode is REFUSED rather than ignored -- a field
// silently dropped is a field its author believes took effect.
message ModelDeploymentRouter {
  // Mode decides who runs the router. Managed means this operator renders and owns it; External
  // means the cluster already runs one and this operator only publishes what that router needs.
  //
  // It is required when this struct is present. The two modes render disjoint sets of objects, so a
  // default would pick one of them on behalf of a user who was asking only for the contract in
  // status.
  //
  // +required
  // +k8s:validation:enum=["managed","external"]
  optional string mode = 1;

  // Name selects which router implementation fronts this deployment. It is required under BOTH
  // modes: External deploys nothing, but the admission check comparing what a router requires
  // against what the engine exposes still has to know which router is asking.
  //
  // THE VALUE FOLLOWS THE PROJECT'S OWN SPELLING, NOT THIS API'S HOUSE STYLE, and the difference is
  // visible in the same word twice: the transport protocol on the cache backend types spells it
  // "Auto" while the connector here spells it "auto". The casing convention is per API type, and the
  // reason is the one ModelDeploymentRoleKind states about itself -- these values are terms the
  // outside tool understands, not terms this operator invents. "llm-d" is how that project spells
  // itself in its module path, its API group and its label domain, so it is spelled that way here.
  //
  // ONE VALUE TODAY IS A CHOICE TAKEN FOR NOW, NOT THE ABSENCE OF ONE. This field exists ahead of a
  // second implementation precisely so that adding one is a widening of this enum rather than a new
  // field appearing on an API that already shipped without it.
  //
  // WIDENING IT IS FOUR THINGS, NOT ONE: one entry here, one configuration renderer, the object set
  // that router needs, AND the wiring that threads this value to a dispatch point. The schema
  // reservation covers the first of those and nothing else, which is why a second router is a piece
  // of work rather than a constant.
  //
  // +required
  // +k8s:validation:enum=["llm-d"]
  optional string name = 2;

  // Replicas is how many router Pods to run. Managed only.
  //
  // IT IS A POINTER AND CARRIES NO SCHEMA DEFAULT, and that is forced rather than chosen.
  // Structural-schema defaulting runs before any webhook, so a plain int32 defaulted to one would
  // reach admission as one whether or not the user typed it, and the rule refusing a managed-only
  // field under External would then refuse a field nobody set. The renderer defaults it to one
  // instead. Image and ExtraArgs need no such treatment: an explicitly empty value means there
  // exactly what an absent one means, so only a non-empty one is refused.
  //
  // MORE THAN ONE REPLICA TRADES CACHE CONSISTENCY FOR AVAILABILITY. A router that scores on a
  // prefix cache holds that state per replica: upstream reports radix trees that do not synchronize
  // across replicas and a hit rate falling by ten to twenty percent as a result, and reports that
  // where replicas do exchange events the exchange improves load estimation without making two
  // replicas route alike. More than one is permitted; the cost is stated here rather than left to be
  // found on a dashboard.
  //
  // +optional
  // +k8s:validation:minimum=1
  optional int32 replicas = 3;

  // Image overrides the router's container image. Managed only. Empty means the operator assembles
  // one from Name, the same way a role's image is assembled when its template names none.
  //
  // +optional
  // +k8s:validation:maxLength=512
  optional string image = 4;

  // ExtraArgs are additional flags for the router process. Managed only.
  //
  // A flag the operator derives itself is REFUSED rather than merged, so that one setting has one
  // source. The catalog deciding which those are is keyed by ROUTER, not by engine: the engine-keyed
  // catalog guarding a role's extraArgs answers a different question and shares only its shape. Like
  // that one, it keys on a flag's name while what it protects is a setting, so a second spelling of
  // one setting is not caught.
  //
  // +optional
  // +listType=atomic
  repeated string extraArgs = 5;
}

// ModelDeploymentRouterKVEvents is one role's cache-event stream, as something a consumer can reach.
//
// A BIND ADDRESS IS NOT A DIALABLE ADDRESS. The engine is configured with what its publisher binds,
// which names no host; these are the addresses a consumer connects to. Publishing the bind string
// here would be publishing a value that works nowhere but inside the publishing Pod.
message ModelDeploymentRouterKVEvents {
  // Endpoint is the stream a consumer subscribes to.
  //
  // +k8s:validation:maxLength=512
  optional string endpoint = 1;

  // ReplayEndpoint is where a consumer that joined late asks for the events it missed. A consumer
  // without it starts with an empty view of a cache that is not empty.
  //
  // +k8s:validation:maxLength=512
  optional string replayEndpoint = 2;

  // Topic is the topic the publisher was configured with. A consumer subscribing to a different one
  // receives nothing and reports no error.
  optional string topic = 3;
}

// ModelDeploymentRouterMetrics are the serving metrics a router scores on.
//
// THE NAMES ARE PUBLISHED RATHER THAN ASSUMED because they are the engine's, and this operator knows
// which engine it configured. A router holding a name that engine does not expose scores every
// replica identically and reports nothing wrong.
//
// Their presence here says the operator configured an engine that exposes them. It does NOT say they
// are reachable from where a router runs, and it cannot: a role may name any image.
message ModelDeploymentRouterMetrics {
  // Port is the port the metrics are served on.
  optional int32 port = 1;

  // QueuedRequests names the metric holding requests waiting to be admitted by the engine.
  optional string queuedRequests = 2;

  // RunningRequests names the metric holding requests the engine is currently serving.
  optional string runningRequests = 3;

  // KVCacheUtilization names the metric holding how full the engine's KV cache is.
  optional string kvCacheUtilization = 4;
}

// ModelDeploymentRouterRoleStatus is one role as a router sees it.
message ModelDeploymentRouterRoleStatus {
  // Name is the role's name, matching spec.roles[].name.
  optional string name = 1;

  // Kind is the role's effective kind, which is what tells a prefiller from a decoder. It is the
  // resolved value rather than the field, because a role naming no kind is a server and a consumer
  // matching on the empty string would find nothing.
  optional string kind = 2;

  // Selector is the label selector matching exactly this role's replicas, published VERBATIM so
  // that a router is configured from observed strings rather than from a documented convention.
  //
  // A router given a selector survives scaling; a router given a list of addresses does not, and
  // would have to be reconfigured and restarted every time a role grew or shrank.
  map<string, string> selector = 3;

  // Endpoint is this role's own address, which stays reachable whether or not a router fronts the
  // deployment, so that one half of a pair can be addressed directly while debugging.
  //
  // +k8s:validation:maxLength=512
  optional string endpoint = 4;

  // KVEvents is where this role publishes its cache events, absent on a role configured not to
  // publish.
  optional ModelDeploymentRouterKVEvents kvEvents = 5;
}

// ModelDeploymentRouterStatus is the contract a router is configured from.
//
// EVERY STRING HERE IS ONE THE OPERATOR ACTUALLY RENDERED, never a default written down in
// documentation. A router configured from this object and a router the operator configures itself
// therefore cannot disagree, which is the only reason the external mode can claim parity with the
// managed one.
message ModelDeploymentRouterStatus {
  // Mode and Name echo the spec, so that a reader holding only this object knows which contract
  // they are looking at and which implementation it was shaped for.
  optional string mode = 1;

  optional string name = 2;

  // Endpoint is the router's own address. It is present under the managed mode once the router's
  // Service has one, and ABSENT under the external mode, where this operator deploys nothing and has
  // no address to report.
  //
  // +k8s:validation:maxLength=512
  optional string endpoint = 3;

  // PoolEndpoint is the address of the KV cache pool this deployment attached to, in the form its
  // client takes. A router that consults the pool needs it, and resolving it from the Binding is
  // work this operator has already done.
  //
  // +k8s:validation:maxLength=512
  optional string poolEndpoint = 4;

  // Roles is one entry per declared role, and its key set EQUALS the role set. A router discovers
  // live replicas for itself; what it cannot discover is which selector names which half of a pair.
  //
  // +listType=map
  // +listMapKey=name
  repeated ModelDeploymentRouterRoleStatus roles = 5;

  // Metrics are the serving metrics the roles expose and the port they are served on. They are
  // deployment-wide because they are a property of the engine, which is a deployment-wide field.
  optional ModelDeploymentRouterMetrics metrics = 6;
}

// ModelDeploymentSpec defines the desired state of ModelDeployment.
message ModelDeploymentSpec {
  // Model names what the engine serves.
  //
  // +required
  optional ModelDeploymentModel model = 1;

  // Engine selects the inference engine, which decides which argument keys the operator owns and
  // which carrier the transfer configuration arrives on. Ownership is per (engine, key): a key one
  // engine owns is an ordinary user argument on another.
  //
  // It does NOT decide the connector, which follows the role's hardware instead: the connector is a
  // property of the accelerator backend, so an Ascend pool and an NVIDIA pool running this engine
  // get different ones.
  //
  // +required
  // +k8s:validation:enum=["vllm","sglang"]
  optional string engine = 2;

  // EngineVersion is the engine's own version, e.g. "0.25.1" for vllm or "0.5.18" for sglang.
  //
  //   - It is free-form and UNVALIDATED, by decision: the user guarantees that the version and the
  //     driver each role's hardware installed are aligned. A gate would need the runner's release
  //     matrix compiled into the operator, and the failure it would prevent is already legible as
  //     an ImagePullBackOff on a tag that does not exist.
  //   - It is per deployment rather than per role, which is what lets one version assemble a
  //     DIFFERENT image for each role: the backend half of the tag comes from the role's own
  //     InstanceType, so a prefill role on NVIDIA and a decode role on Ascend need no extra field.
  //     Published version sets do NOT overlap across every backend, so one version has to name a
  //     tag that exists for each backend the roles land on.
  //   - The lower bound is not decoration: `required` makes the key present, not the value
  //     non-empty, and an empty version assembles a malformed tag naming something never typed.
  //
  // +required
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=64
  optional string engineVersion = 5;

  // KVCache attaches the deployment to a KV cache pool.
  //
  // +required
  optional ModelDeploymentKVCache kvCache = 3;

  // Roles are the engine roles this deployment runs. A single-role deployment names one; a
  // prefill/decode deployment names several, which is why this is a LIST FROM THE FIRST VERSION.
  //
  // The UPPER bound lives in the validating webhook and not in this schema: it tracks Kueue's cap
  // on Workload.spec.podSets, so the refusal can name whose limit it is, and following that number
  // is a webhook edit rather than a schema change every stored object must survive. The figure is
  // not restated here, because the one that binds is in the Kueue the cluster runs.
  //
  // +required
  // +k8s:validation:minItems=1
  // +listType=map
  // +listMapKey=name
  repeated ModelDeploymentRole roles = 4;

  // Router optionally puts a request router in front of the roles.
  //
  // IT IS EAST-WEST TRAFFIC MANAGEMENT, NOT A PREFILL/DECODE PAIRER, and the distinction decides
  // which shapes are legal behind it. Several plain servers is one of them: a router that scores on
  // a cache view picks between equals in a way a Service cannot, so "there is no pair here" is not a
  // reason to refuse one. Several prefillers with several decoders is another. A rule admitting only
  // one prefiller and one decoder would describe a pairer rather than this field.
  //
  // Absent means no router, and that stays a supported shape rather than a broken one: the roles are
  // individually addressable through their own Services either way, so a deployment written before
  // this field existed serves exactly as it did.
  //
  // +optional
  optional ModelDeploymentRouter router = 6;
}

// ModelDeploymentStatus defines the observed state of ModelDeployment.
//
// It is REBUILT FROM OBSERVED STATE ON EVERY RECONCILE, so a stale field cannot survive a
// disagreement with the Pods.
message ModelDeploymentStatus {
  // Phase summarizes the conditions: Starting, Ready, Degraded, Deleting. Ready means every role's
  // ready count equals its desired count; Degraded means at least one replica is ready and at
  // least one is not.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis: DomainRegistered, QuotaReserved,
  // CacheAttached, ReplicasUpToDate, RoleKindsReady. They are independent — "quota reserved but
  // cache not attached" is a real and actionable state — which is what a single phase string
  // cannot carry.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // Endpoint is the one address every replica serves behind, in the form
  // <scheme>://<name>.<namespace>.svc:<port>. It is absent until the Service has an address.
  //
  // The scheme is https where the first role's own arguments put its listener on TLS, and http
  // otherwise. A client reads it from here rather than assuming either one.
  //
  // +k8s:validation:maxLength=512
  optional string endpoint = 4;

  // Roles is one entry per declared role.
  //
  // +listType=map
  // +listMapKey=name
  repeated ModelDeploymentRoleStatus roles = 5;

  // KVCache is the reuse domain this deployment actually attached to, read from the Binding, so
  // that telling a cache-sharing misconfiguration from a cache that is merely cold takes one object
  // rather than two.
  //
  // It is ABSENT while the Binding cannot be resolved, rather than present and empty: an empty
  // object here would be indistinguishable from a domain whose every field happens to be empty.
  optional ModelDeploymentKVCacheStatus kvCache = 6;

  // Router is everything a router needs in order to front this deployment, published under BOTH
  // modes. Under the external mode it is the entire output of this feature.
  //
  // It is ABSENT when spec.router is, rather than present and empty, for the same reason KVCache is:
  // an empty object here cannot be told apart from a contract whose every string happens to be
  // empty.
  optional ModelDeploymentRouterStatus router = 7;
}

// ModelDeploymentTemplate overlays the container the operator renders for one replica.
//
// IT EXISTS BECAUSE InstanceTemplate'S Image IS REQUIRED AND THIS ONE'S CANNOT BE: a role that names
// no image has one synthesized from the accelerator backend its InstanceType observed, so requiring
// the field would force every user of the overlay to give up synthesis.
//
// The fields are InstanceTemplate's, minus VolumeMount, which nothing here reads: an unused field in
// a schema is a promise, and strict decoding turns leaving it out into a clear refusal rather than a
// value silently ignored.
message ModelDeploymentTemplate {
  // Image is the container image to run. Leaving it empty is the ordinary case: the operator then
  // synthesizes one from the pool's accelerator backend, the observed runtime version and the
  // requested engine.
  //
  // +optional
  // +k8s:validation:maxLength=512
  optional string image = 1;

  // ImagePullPolicy is the pull policy for Image.
  //
  // +optional
  optional string imagePullPolicy = 2;

  // Command replaces the whole argv, which is the TAKE-OVER tier described on the role's Template
  // field. The operator contributes no engine argument and no client environment.
  //
  // +optional
  repeated string command = 3;

  // Privileged runs the container privileged.
  //
  // +optional
  optional bool privileged = 4;

  // Ports are the container ports to expose in addition to the engine's own. They do not
  // reserve or select the transfer engine's runtime port window.
  //
  // +optional
  // +patchMergeKey=port
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=port
  // +listMapKey=protocol
  repeated InstancePort ports = 5;

  // Env are environment entries merged on top of the role's own. A name the operator owns is
  // refused here just as it is in the role's Env: the renderer drops owned names from both tiers,
  // so admission has to refuse both, or one path becomes a silent drop.
  //
  // +optional
  // +patchMergeKey=name
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=name
  repeated InstanceEnvVar env = 6;

  // Resources is present ONLY so that supplying it can be refused with a message that says where
  // the request belongs. Dropping the field would let strict decoding refuse it earlier and more
  // cheaply, but an unknown-field error says "not here" while the webhook's says "it goes in the
  // role's own Resources" — and mistaking the template for the place resources live is the whole
  // reason anyone writes this field.
  //
  // +optional
  optional InstanceResources resources = 7;

  // ImagePullSecret is the secret used to pull Image.
  //
  // +optional
  optional .k8s.io.api.core.v1.LocalObjectReference imagePullSecret = 8;

  // AdditionalVolumes are volumes mounted into the container alongside the operator's own.
  //
  // +optional
  // +listType=atomic
  repeated InstanceAdditionalVolume additionalVolumes = 9;
}

