  optional .k8s.io.apimachinery.pkg.api.resource.Quantity onceMaxRequest = 1;

  // Remaining is the remaining requestable value of the resource.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity remaining = 2;

  // Capacity is the total value of the resource.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity capacity = 3;
}

