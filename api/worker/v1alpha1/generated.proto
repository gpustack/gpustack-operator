  // Connection describes how this backend is reached: managed by this operator, or external.
  // Exactly one is set, enforced by the webhook.
  //
  // +required
  optional KVCacheBackendConnection connection = 3;

  // Transport describes the data plane the members use.
  //
  // The empty object is the default, and it has to be: structural-schema defaulting does not
  // descend into an ABSENT object, so a spec that never mentions a transport would store no
  // protocol at all and protocol's own default would silently not apply.
  //
  // +k8s:validation:default={}
  optional KVCacheBackendTransport transport = 4;
}

// KVCacheBackendStatus defines the observed state of KVCacheBackend.
message KVCacheBackendStatus {
  // Phase summarizes the conditions: Provisioning, Ready, Degraded, Error, Deleting. It is
  // derived from the leader's own health document rather than from its Pod phase — a Running
  // Pod whose leader reports its service not ready is Provisioning, not Ready.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis: LeaderAvailable, MembersMounted,
  // CapacityObserved, PoolWrites, Deletable, RolloutComplete, and — each only where it has
  // something to be a verdict about — SnapshotStorageShared, ElectionObserved and TierWasEmpty,
  // the last only where a member group carries a local disk tier. Every one is derived from an
  // observed document.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // Endpoints are this backend's addresses, one entry per named role — the same shape the
  // external branch takes as input. A managed backend fills both from its own Service; an
  // external one echoes what was declared.
  //
  // +listType=map
  // +listMapKey=name
  repeated KVCacheBackendEndpoint endpoints = 4;

  // Capacity is what the leader reports it has and has allocated. It is ABSENT until a scrape
  // succeeds, and absent again is not the same as reporting zero: an empty object here would be
  // indistinguishable from a scrape that returned nothing.
  optional KVCacheBackendCapacity capacity = 5;

  // Members is one entry per observed store member. It is empty on a leader whose master version
  // serves no segment listing, where MembersMounted is Unknown.
  //
  // +listType=map
  // +listMapKey=segmentID
  repeated KVCacheBackendMemberStatus members = 6;

  // UsedBy names the objects that consume this backend. A non-empty UsedBy is what the
  // finalizer refuses deletion on, so the field is the enforcement input and not a display.
  //
  // It is written by the CONSUMERS, not by this backend's own reconciler, which only reads it and
  // holds its teardown on it. Today exactly one consumer writes here: a KVCachePool claims the
  // backend it draws from, under kind KVCachePool, and drops the claim only after removing what it
  // registered on that backend's master. Entries leave Namespace empty, a backend being
  // cluster-scoped and so is everything that claims one. KVCacheObjectReference's own doc says why
  // the shape is neither of the two core reference types.
  //
  // +listType=map
  // +listMapKey=kind
  // +listMapKey=namespace
  // +listMapKey=name
  repeated KVCacheObjectReference usedBy = 7;
}

// KVCacheBackendTransport is the data plane the members use.
message KVCacheBackendTransport {
  // Protocol is the transport the members are ASKED to use. Auto resolves to TCP.
  //
  // THESE VALUES ARE NOT THE STORE'S OWN SPELLINGS. What is written here is translated before it
  // reaches a member, and two of the eight change word entirely: CANN renders as ascend and ROCM
  // as hip. So a member's environment, its logs, and status.members[].protocol below all report
  // the store's lowercase spelling rather than the one written here, and comparing the two as
  // strings finds a difference that is not one.
  //
  //   - TCP is the universal fallback. RDMA, EFA, CANN, ROCM, MUSA and MACA are peers of one
  //     another, each a fabric- or vendor-specific fast path rather than a spelling of TCP: EFA in
  //     particular is reached through libfabric's SRD provider and has no RC queue pairs, so the
  //     RDMA transport cannot drive it. MUSA and MACA are intra-node IPC transports, not host
  //     fabrics: they take no hostNetwork, no capabilities and no device resource.
  //   - Whether a member came up on what it asked for is NOT visible through this API.
  //     status.members[].protocol echoes this request back rather than reporting a result, so a
  //     member that fell back to the store's tcp still reads as the fabric there, while serving.
  //     Only the member's own log says which transport the data plane installed.
  //   - Auto is deliberately NOT a per-node probe that promotes itself to a faster fabric: a member
  //     group renders one DaemonSet, whose single Pod template cannot carry a different transport
  //     per node, and promoting to RDMA grants hostNetwork and two capabilities — a privilege is
  //     requested, never inferred on an operator's behalf.
  //   - Membership in this enum means MEASURED AS COMPILED into an artifact a member can run, which
  //     is what excludes the other eight strings that artifact's config parser accepts. It does not
  //     mean measured to move bytes: only TCP has been exercised end to end. It also does not mean
  //     this project publishes an image carrying it — MUSA and MACA are deliberately in the enum
  //     with no variant in pack/mirrored-mooncake, so a group on either names its own image. A
  //     value here with neither a project variant nor a working self-built image is what the rule
  //     excludes; an absent variant on its own is not.
  //   - A host fabric needs two things this API cannot check: the member image must carry the
  //     runtime its transport links — the CANN toolkit for CANN, libfabric for EFA — and the NODE must run a
  //     device plugin, since a hostPath alone leaves the device cgroup refusing to open the device.
  //     The effective protocol selects the fabric resource family; a member group's interface count
  //     selects its quantity and, for RDMA, whether it uses shared or exclusive resources.
  //   - RESPELLING THIS ENUM CARRIES A RESIDUAL RISK, knowingly accepted, on the same terms as
  //     Medium's. The values were once Auto, TCP, RDMA, EFA, HIP and Ascend; HIP and Ascend are
  //     gone, replaced by the toolchain names ROCM and CANN, and the rest changed case. An object
  //     storing one of the old values becomes undeletable, because schema validation runs on the
  //     write path only: it reads back fine while every update is refused, the controller's
  //     finalizer removal included. NO RELEASE IS EXPOSED — this type is absent from every tag
  //     through v0.8.6, checked per tag — but a cluster tracking the default branch is, since that
  //     branch carried the old spellings. Clearing it is the first shipping release's job: confirm
  //     no leftover object exists, or write a recovery procedure. A conversion webhook is NOT the
  //     answer here for the reason an alias map is not: the schema enum is the gate a stored object
  //     meets first, so widening what admission accepts reaches nothing that the API server has
  //     already refused.
  //   - ON RDMA AND EFA THE PROTOCOL ALSO NAMES A DEVICE RESOURCE, which the member requests one
  //     of so the device cgroup lets it open the fabric. Each fabric has exactly one name that is
  //     right on every cluster running this operator — EFA's plugin is AWS's own, and the RDMA
  //     one is published by this operator's Device Manager — so the name is derived from this
  //     value and never declared. A node advertising none leaves the member Pending, which is the
  //     intended refusal: a cluster that cannot serve the fabric is one whose backend should say
  //     TCP, and saying so here beats discovering it later in a store log that reports no error
  //     while installing TCP under an object that reads RDMA.
  //
  // +k8s:validation:default="Auto"
  // +k8s:validation:enum=["Auto","TCP","RDMA","EFA","CANN","ROCM","MUSA","MACA"]
  optional string protocol = 1;
}

// KVCacheObjectReference names an object that consumes another one in this group. It is the ONE
// shape every usedBy in this family carries, so a reader learns it once.
//
// It names NO API GROUP, and that is a constraint rather than an omission: a usedBy entry may only
// name a kind in this API group, within which kind and name identify an object. The constraint is
// what lets the list be keyed at all — core.TypedLocalObjectReference carries an optional,
// defaultless apiGroup, which a structural schema refuses as a list map key, so keying on kind and
// name alone would silently merge two objects that differ only by group.
//
// All three fields are REQUIRED, and all three are list map keys: a structural schema accepts a key
// only where it is required or defaulted, and two consumers collapsing into one entry would let a
// finalizer release while a consumer still holds. Namespace carries the EMPTY STRING when the
// referent is in the holder's own scope, so empty is a value here, not an absence.
message KVCacheObjectReference {
  // +required
  optional string kind = 1;

  // +required
  optional string namespace = 2;

  // +required
  optional string name = 3;
}

// KVCachePool is the schema for worker.gpustack.ai.
//
// A KVCacheBackend declares the physical cache; this declares which namespaces are granted a quota on
// it, how much of it, and under which reuse identity. It is Kueue's ClusterQueue to
// KVCachePoolBinding's LocalQueue: the quota domain over exactly one backend, and the registry of the
// reuse domains its Bindings have claimed.
//
// It GRANTS AND ACCOUNTS; IT DOES NOT ADMIT — nothing here keeps a pod that knows a reuse domain's
// name from reaching that domain on the store, and KVCachePoolBinding says what the grant is not. It
// is cluster-scoped for the reason its backend is: only an admin declares a privileged physical
// resource, pools must be shareable across namespaces, and a cross-namespace reference FROM a
// namespaced object is an anti-pattern. Data-plane isolation is a different axis, solved by the
// storage layer's tenant rather than by this object's scope.
//
// +genclient
// +genclient:nonNamespaced
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Cluster",categories=["gpustack"],shortName=["kvcp"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Quota",type="string",jsonPath=".spec.quota.total"
// +k8s:crd-gen:printcolumn:name="Usage",type="string",jsonPath=".status.usage.total"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Endpoint",type="string",jsonPath=".status.clientEndpoint"
// +k8s:crd-gen:printcolumn:name="Age",type="date",jsonPath=".metadata.creationTimestamp"
message KVCachePool {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional KVCachePoolSpec spec = 2;

  optional KVCachePoolStatus status = 3;
}

// KVCachePoolBinding is the schema for worker.gpustack.ai.
//
// It is the PROVISIONING POINT: creating one in a namespace is what gives that namespace a quota on
// a pool and registers the ONE reuse domain it will write under, so both are objects an admin can
// RBAC and audit rather than strings a tenant types into a workload.
//
// The storage layer's tenant IS the domain, so registering one creates a quota ledger, which is what
// makes naming a domain a privileged act rather than something a workload could mint at will.
// Workloads pointing at the SAME Binding share KV; a namespace needing two reuse boundaries creates
// two Bindings, exactly as one with two scheduling boundaries has two Kueue LocalQueues.
//
// It is NOT an enforcement boundary, and must not be described as one. The store accepts whatever
// tenant id a caller sends, over a Service any pod in the cluster can dial, and nothing derives a
// credential from this object — so a workload that knows another namespace's domain name can read
// and write that domain's cache today. What a Binding governs is who is GRANTED capacity and under
// which name. Enforcement needs an authenticated proxy or network isolation, and neither exists yet.
//
// +genclient
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Namespaced",categories=["gpustack"],shortName=["kvcpb"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Pool",type="string",jsonPath=".spec.poolRef.name"
// +k8s:crd-gen:printcolumn:name="Domain",type="string",jsonPath=".spec.domain.name"
// +k8s:crd-gen:printcolumn:name="BlockSize",type="integer",jsonPath=".spec.domain.blockSize"
// +k8s:crd-gen:printcolumn:name="Dtype",type="string",jsonPath=".spec.domain.dtype"
// +k8s:crd-gen:printcolumn:name="Effective",type="string",jsonPath=".status.effectiveQuota"
// +k8s:crd-gen:printcolumn:name="Usage",type="string",jsonPath=".status.usage"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Age",type="date",jsonPath=".metadata.creationTimestamp"
message KVCachePoolBinding {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional KVCachePoolBindingSpec spec = 2;

  optional KVCachePoolBindingStatus status = 3;
}

// KVCachePoolBindingDomain is the reuse identity: what the cache isolates on, and what its blocks
// are shaped like.
message KVCachePoolBindingDomain {
  // Name is the domain, and it becomes the storage layer's tenant_id verbatim.
  //
  //   - It must be claimed by NO OTHER BINDING on a master that serves this Binding's pool, which
  //     the webhook enforces: two Bindings on one domain over one master would share cache —
  //     possibly intended — but collide on one quota ledger, which never is. Uniqueness is per
  //     master rather than per pool because one master can serve several pools and the tenant space
  //     is master-global; it is not cluster-wide because two masters hold two ledgers.
  //   - The accepted shape is a DNS-1123 label, checked by the webhook. That is strictly inside
  //     what the master accepts as a tenant_id and is what a Kubernetes object name already looks
  //     like, so nobody learns a second naming rule. This is the ONLY place the shape is judged;
  //     every consumer downstream copies the name rather than re-judging it.
  //
  // +required
  // +k8s:validation:maxLength=63
  optional string name = 1;

  // BlockSize is the number of tokens one cache block holds.
  //
  // +required
  optional int32 blockSize = 2;

  // Dtype is the element type the cached tensors carry, in the engine's own lowercase spelling.
  //
  // The exhaustive set belongs to whatever spec owns workloads, so this API does not enumerate it —
  // that would make a new engine dtype an API change — and the webhook judges the syntactic form
  // only. It is spelled to match its JSON name exactly; DType would not, and the openapi generator
  // records every such mismatch as a checked-in API rule violation.
  //
  // +required
  // +k8s:validation:maxLength=32
  optional string dtype = 3;
}

// KVCachePoolBindingList holds the list of KVCachePoolBinding.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message KVCachePoolBindingList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated KVCachePoolBinding items = 2;
}

// KVCachePoolBindingPoolReference names the cluster-scoped pool this Binding grants.
//
// It carries no namespace, and that is the point: a pool is cluster-scoped, so there is none to
// name, and no namespaced object here ever reads across a namespace boundary.
message KVCachePoolBindingPoolReference {
  // +required
  optional string name = 1;
}

// KVCachePoolBindingQuota is the quota this namespace asks of its pool.
message KVCachePoolBindingQuota {
  // Ceiling is what this namespace may consume in its reuse domain, written verbatim into that
  // one tenant's requested quota rather than kept as a total this operator maintains.
  //
  //   - IT IS A REQUEST, NOT A GRANT. The pool reduces every tenant's effective quota in proportion
  //     when the sum of requests exceeds allocatable capacity, and Status.EffectiveQuota is what
  //     was actually granted.
  //   - EXCEEDING IT EVICTS RATHER THAN REFUSES, which is the opposite of what the word suggests.
  //     A write past the ceiling is not rejected: the store frees room by dropping this namespace's
  //     own older objects and retries. A ceiling set too low therefore costs cache inside this
  //     namespace rather than failed writes, and costs it without any counter moving. Writes are
  //     refused only when eviction cannot free enough, which needs those older objects held by
  //     unexpired read leases.
  //   - It is REQUIRED, because the state it would otherwise allow does not work: the storage layer
  //     has no default policy and refuses a tenant it holds no policy for, so a Binding without
  //     this field would pass admission, report Ready and refuse every byte its workloads wrote.
  //   - A value that is not positive is refused at admission.
  //
  // +required
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity ceiling = 1;
}

// KVCachePoolBindingReference names one KVCachePoolBinding.
//
// It carries no kind, unlike KVCacheObjectReference, because it is not a usedBy: it is the back
// pointer from a registered domain to the one object that could have declared it, and only a
// KVCachePoolBinding ever can. Both fields are required, a Binding being namespaced.
message KVCachePoolBindingReference {
  // +required
  optional string namespace = 1;

  // +required
  optional string name = 2;
}

// KVCachePoolBindingSpec defines the desired spec of KVCachePoolBinding.
message KVCachePoolBindingSpec {
  // PoolRef names the pool this namespace is being granted. It is IMMUTABLE, webhook-enforced:
  // re-pointing a Binding would move a namespace's grant silently and leave its bytes on
  // the old master.
  //
  // +required
  optional KVCachePoolBindingPoolReference poolRef = 1;

  // Domain is the reuse identity this Binding registers, and it is REQUIRED. It maps to the
  // storage layer's tenant_id (isolation) and cache_salt (prefix identity), so registering a
  // domain creates a tenant with a quota ledger of its own.
  //
  // EXACTLY ONE DOMAIN AND NOT A LIST, deliberately, so the cardinality is enforced by the schema
  // and not by a webhook rule: one Binding is one tenant, every figure in Status is a single series
  // rather than a sum, and no rule for dividing one ceiling among several domains has to be
  // invented.
  //
  // EVERY FIELD IS IMMUTABLE, webhook-enforced. Name re-points this namespace at a different
  // ledger and strands the old one. BlockSize or Dtype changed under a warm cache is silent
  // corruption: the writes succeed, the reads succeed, and the tensors are wrong.
  //
  // +required
  optional KVCachePoolBindingDomain domain = 2;

  // Quota is what this namespace asks of its pool, shaped like the pool's own declared ceiling so
  // one concept is spelled one way on both sides of the grant.
  //
  // +required
  optional KVCachePoolBindingQuota quota = 3;
}

// KVCachePoolBindingStatus is the namespace's own view of the pool: what it asked for, what the pool
// actually granted, what it is using, and whether it is over.
//
// Every figure below is read from ONE tenant's series, because a Binding registers exactly one reuse
// domain and the storage layer's tenant IS that domain: nothing here is summed, and no figure can
// hide a second domain behind it.
//
// Every observed figure below is ABSENT rather than zero when it was not observed, and the two say
// different things: a figure reading zero was measured as zero, and a missing figure was not
// measured at all. Reading an absent one as zero is the mistake this distinction exists to prevent.
message KVCachePoolBindingStatus {
  // Phase summarizes the conditions: Provisioning, Ready, Error, Deleting.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // RequestedQuota is what the operator asked the pool for on this namespace's behalf: the
  // requested quota it wrote for this Binding's one tenant. It is absent, with a Condition saying
  // why, whenever the operator refused to write — a master that answered that multi-tenancy is
  // off, or a policy source it cannot rewrite.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity requestedQuota = 4;

  // EffectiveQuota is what the pool actually granted. It is LOWER than RequestedQuota whenever the
  // sum of every tenant's request exceeds the pool's allocatable capacity: the pool then recomputes
  // each tenant's effective quota in proportion to what that tenant requested. A pool with no
  // mounted members grants ZERO to everyone, and that case carries its own Condition rather than
  // appearing as an ordinary shortfall. A granted zero is reported as zero; a quota nobody could
  // read is absent instead, because the two are different answers.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity effectiveQuota = 5;

  // Usage is what the master reports this namespace's reuse domain as holding, and WHICH figure
  // that is depends on the master's version rather than on this API.
  //
  // A master exposing used bytes apart from reservations is read as committed bytes, in-flight
  // writes deliberately left out — a burst of concurrent writes would otherwise read as consumption
  // that never happened. A master exposing one charged figure instead, the shape 0.3.13 introduced,
  // charges it when a write STARTS, so in-flight reservations are inside this number and cannot be
  // subtracted. The Binding's own QuotaObserved message says which of the two answered.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity usage = 6;

  // OverQuota is true when Usage exceeds EffectiveQuota, and it does NOT mean the domain tried to
  // write more than it was granted. The store never charges a domain past its grant, so writing past
  // it leaves Usage AT the grant and this false; what happens on that path instead is that the store
  // evicts the domain's OWN objects to make room and admits the write, and a write fails only while
  // every object holding the grant is pinned and nothing can be evicted.
  //
  // So this reports ONE situation: the grant was RECUT below what the domain already holds, which is
  // what a proportional cut does when the pool's members shrink or another Binding joins. Waiting on
  // it as the signal that writes are being refused is waiting for something that never arrives.
  //
  // An observed false — the ordinary, healthy case — is reported AS false. This field is absent only
  // when the tenant could not be scraped at all. Those two readings are the easiest pair here to
  // confuse and they mean opposite things.
  optional bool overQuota = 7;

  // Blocks and HitRate are OBSERVED from the master and the engine, never declared. They are absent
  // when the scrape does not carry this tenant, because a fabricated zero hit rate on a warm cache
  // is worse than no number at all. Zero blocks and "not in the scrape" are different facts here as
  // well: zero is a measurement, absence is the lack of one.
  //
  // This operator writes neither today, so both are always absent: the current store generation
  // exports no per-tenant object count, and its hit rate is per master rather than per tenant.
  optional int64 blocks = 8;

  // HitRate is a ratio held as a STRING with a pattern, never a float. See the pool's own HitRate
  // for why a pattern is safe on a computed ratio and what it obliges of whoever writes it.
  //
  // +k8s:validation:pattern="^(0(\\.[0-9]{1,4})?|1(\\.0{1,4})?)$"
  optional string hitRate = 9;

  // UsedBy names the workloads in THIS namespace that hold the pool through this Binding — always a
  // single-scope query, and a non-empty UsedBy is what the finalizer refuses deletion on.
  //
  // IT IS WRITTEN BY THE CONSUMER, NOT BY THIS API'S OWN RECONCILER, which only reads it and
  // enforces on it. The kind that writes it is ModelDeployment, whose spec.kvCache.poolRef names a
  // Binding in its own namespace, so an empty list is not evidence that nobody holds the pool.
  // Entries leave Namespace empty, everything that can appear being in this Binding's own namespace.
  //
  // +listType=map
  // +listMapKey=kind
  // +listMapKey=namespace
  // +listMapKey=name
  repeated KVCacheObjectReference usedBy = 10;
}

// KVCachePoolDomain is one reuse identity registered against this pool: what it is, who declared it,
// and what the master reports about it.
message KVCachePoolDomain {
  // Name is the reuse identity, and it is the storage layer's tenant_id.
  //
  // +required
  // +k8s:validation:maxLength=63
  optional string name = 1;

  // Binding is the object that declared this domain. It is the only place a domain can be
  // declared, which is what keeps naming one a privileged act.
  //
  // +required
  optional KVCachePoolBindingReference binding = 2;

  // BlockSize and Dtype are echoed from the Binding that registered the domain, so a reader of
  // the registry does not have to fetch every Binding to learn what a domain's blocks are.
  //
  // Both are REQUIRED, unlike the observed figures below, because they are copied from a Binding
  // that already requires them: an entry missing one could only be a writer bug, and leaving them
  // optional would let the registry answer "this domain's blocks are of unknown shape", which is
  // not a state that exists.
  //
  // Dtype is spelled to match its JSON name exactly. DType would not, and the openapi generator
  // records every such mismatch as a checked-in API rule violation.
  //
  // +required
  optional int32 blockSize = 3;

  // +required
  optional string dtype = 4;

  // Blocks and HitRate are OBSERVED, never declared, and they are ABSENT when the scrape does not
  // carry this domain. A fabricated zero hit rate on a warm cache is worse than no number, and
  // zero blocks is a different fact from "not in the scrape".
  //
  // This operator writes neither today, so both are always absent: the current store generation
  // exports no per-domain object count, and its hit rate is per master rather than per domain.
  optional int64 blocks = 5;

  // HitRate is a ratio held as a STRING with a pattern, never a float, matching the shape the
  // measured surface itself uses. The pattern is safe here in a way an enum on an echoed vendor
  // value would not be, because this ratio is COMPUTED by this operator. It does oblige whoever
  // writes it to format to this shape: a value that fails the pattern fails the WHOLE status write,
  // freezing every other field at its last value, not just this one.
  //
  // +k8s:validation:pattern="^(0(\\.[0-9]{1,4})?|1(\\.0{1,4})?)$"
  optional string hitRate = 6;
}

// KVCachePoolList holds the list of KVCachePool.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message KVCachePoolList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated KVCachePool items = 2;
}

// KVCachePoolQuota is the pool's declared ceiling.
//
// It is OUR number, not the master's. The master reports its own allocatable capacity and the two
// can disagree; the case where the disagreement is total — a ceiling declared over a backend that
// has mounted nothing — is a Condition rather than a silence.
message KVCachePoolQuota {
  // Total is required: a pool with no declared ceiling has nothing to write into any ledger.
  //
  // +required
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity total = 1;
}

// KVCachePoolSpec defines the desired spec of KVCachePool.
message KVCachePoolSpec {
  // Backends names the KVCacheBackend this pool draws from. Each entry is the backend's NAME, not
  // an object reference: there is no kind or namespace to write alongside it.
  //
  //   - Exactly one entry is admitted, and the rule is the webhook's rather than the schema's so the
  //     refusal can carry its reason: quota lands on a single master's per-tenant ledger, and one
  //     master cannot account for bytes held in another backend.
  //   - It is IMMUTABLE, webhook-enforced. Moving a pool to another backend would strand every
  //     tenant quota on the old master's ledger with nothing left to delete them with.
  //   - The reverse is NOT exclusive: one backend may be referenced by several pools, which is why
  //     the ledger and the rendered policy converge per MASTER rather than per pool.
  //
  // +required
  // +listType=atomic
  repeated string backends = 1;

  // Quota is the ceiling this pool declares over its backend.
  //
  // +required
  optional KVCachePoolQuota quota = 2;
}

// KVCachePoolStatus defines the observed state of KVCachePool.
message KVCachePoolStatus {
  // Phase summarizes the conditions: Provisioning, Ready, Error, Deleting.
  optional string phase = 1;

  // PhaseMessage carries the reason for the phase.
  optional string phaseMessage = 2;

  // Conditions is the finer view, one condition per axis.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;

  // ClientEndpoint is the address an inference engine connects to, echoed from the backend's
  // Client endpoint.
  //
  // It is absent, with a Condition saying why, whenever the backend has published no endpoints yet,
  // and is never filled from a Service name derived from the backend's own — a guessed address that
  // happens to resolve is how a pool would silently drive the wrong master.
  //
  // The backend's ADMIN address is deliberately republished NOWHERE. That one port serves the
  // Prometheus exposition and the HTTP admin API both, so it is the write face of the quota ledger,
  // while this object is cluster-scoped and readable by anyone holding a pool RBAC rule.
  //
  // +k8s:validation:maxLength=259
  optional string clientEndpoint = 4;

  // Usage is what this pool's own tenants are holding. It is ABSENT until a scrape succeeds, and
  // absent is not the same as reporting zero.
  optional KVCachePoolUsage usage = 5;

  // Domains is the registry of reuse identities claimed against this pool, one entry per Binding.
  //
  // It is AUTHORITATIVE rather than advisory: an entry exists because a Binding declares it, not
  // because a workload announced itself, so assembling it is one pass over the Binding index and
  // needs no watch on any workload kind.
  //
  // +listType=map
  // +listMapKey=name
  repeated KVCachePoolDomain domains = 6;

  // UsedBy names the Bindings that hold this pool. A non-empty UsedBy is what the finalizer
  // refuses deletion on, so the field is the enforcement input and not a display.
  //
  // Unlike the Binding's own list, THIS one is written by this API's reconciler, which already
  // lists the Bindings of a pool through its index. The two levels of usedBy therefore have
  // different writers, and only this one is self-contained.
  //
  // +listType=map
  // +listMapKey=kind
  // +listMapKey=namespace
  // +listMapKey=name
  repeated KVCacheObjectReference usedBy = 7;
}

// KVCachePoolUsage is what the pool's tenants hold, as the master reports it.
message KVCachePoolUsage {
  // Total is the sum of the occupancy the master reports for the tenants THIS pool owns — never its
  // whole ledger, which a shared backend makes larger than this pool. An unobserved total is ABSENT
  // rather than zero, because a zero here would read as an empty cache.
  //
  // WHAT occupancy means is the master's choice, not this API's, and it changed: a master exposing
  // used bytes apart from reservations is summed as committed bytes, while one exposing a single
  // charged figure — the shape 0.3.13 introduced — charges at the start of a write, so in-flight
  // reservations are already inside this total. Do not read it as committed usage without knowing
  // which the backend runs.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity total = 1;
}

// ModelArtifact is the schema for worker.gpustack.ai.
//
// It is WHERE A MODEL'S WEIGHTS COME FROM AND WHICH CREDENTIAL READS THEM, and it is the only
// object that says so: a ModelDeployment or an Instance references it by name and carries no URI,
// revision or token of its own. Every consumer in the namespace shares one declaration.
//
// IT IS AN IDENTITY, SO ITS WHOLE SPEC IS IMMUTABLE AFTER CREATION, webhook-enforced. A different
// source or revision is a different artifact, created rather than edited. That is also what makes a
// frozen reference to it pin anything: a reference that cannot change to an object that can would
// pin nothing.
//
// A Hugging Face source is resolved ONCE: the branch or tag becomes a 40-character commit, the files
// at that commit become the canonical manifest, and the manifest's digest becomes the content
// address. Nothing follows the branch afterwards. Access is revalidated periodically; losing it stops
// new consumption and never touches running Pods.
//
// +genclient
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Namespaced",categories=["gpustack"],shortName=["mart"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Revision",type="string",jsonPath=".status.resolved.revision"
// +k8s:crd-gen:printcolumn:name="Size",type="integer",jsonPath=".status.resolved.sizeBytes"
// +k8s:crd-gen:printcolumn:name="Resolved",type="string",jsonPath=".status.conditions[?(@.type=='Resolved')].status"
// +k8s:crd-gen:printcolumn:name="Age",type="date",jsonPath=".metadata.creationTimestamp"
message ModelArtifact {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional ModelArtifactSpec spec = 2;

  optional ModelArtifactStatus status = 3;
}

// ModelArtifactHubSource is one repository on a model hub at one revision.
message ModelArtifactHubSource {
  // Repository is the repository id, "owner/name", or a bare canonical name.
  //
  // +required
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=256
  optional string repository = 1;

  // Revision is a branch, a tag or a commit. Admission defaults it to "main". It is resolved to a
  // full commit once, at creation, into status.resolved.revision.
  //
  // +optional
  // +k8s:validation:maxLength=255
  optional string revision = 2;

  // SecretRef names a Secret in this namespace whose "token" key is the hub token. It is read by
  // the controller for resolution and revalidation, and handed to an engine that downloads the
  // weights itself through an environment variable referencing the Secret, so the value never
  // enters a Pod spec, a status or an event.
  //
  // The Secret need not exist at admission; a missing one is reported in status.
  //
  // +optional
  optional .k8s.io.api.core.v1.LocalObjectReference secretRef = 3;
}

// ModelArtifactList holds the list of ModelArtifact.
//
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
message ModelArtifactList {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated ModelArtifact items = 2;
}

// ModelArtifactPersistentVolumeClaimSource is a directory inside a claim.
message ModelArtifactPersistentVolumeClaimSource {
  // ClaimName names a PersistentVolumeClaim in this namespace. It need not exist at admission; a
  // missing one is reported in status.
  //
  // +required
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=253
  optional string claimName = 1;

  // Path is the directory inside the volume, relative to its root. Empty is the root. It must not
  // be absolute and must not contain a ".." element; the second half is admission's, because this
  // schema's patterns cannot express it.
  //
  // +optional
  // +k8s:validation:pattern="^[^/].*$"
  // +k8s:validation:maxLength=1024
  optional string path = 2;
}

// ModelArtifactResolved is the identity a source resolved to.
message ModelArtifactResolved {
  // Revision is the full 40-character commit a hub source resolved to. Absent for a claim.
  //
  // +optional
  optional string revision = 1;

  // ManifestDigest is the content address of a hub source: "sha256:" and the SHA-256 of the
  // canonical manifest of every file at Revision, in the format pkg/modelartifact defines.
  //
  // IT IS NEVER EVIDENCE OF AUTHORIZATION. It is a pure content address: a public and a private
  // repository holding the same files have the same digest, so knowing it proves nothing about
  // access. Absent for a claim.
  //
  // +optional
  optional string manifestDigest = 2;

  // FileCount and SizeBytes are the manifest's file count and total size. Absent for a claim.
  //
  // +optional
  optional int64 fileCount = 3;

  // +optional
  optional int64 sizeBytes = 4;

  // ResolvedTime is when the resolution succeeded.
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.Time resolvedTime = 5;

  // LastValidatedTime is when access was last confirmed. Absent for a claim, which has no access
  // check of its own.
  //
  // +optional
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.Time lastValidatedTime = 6;
}

// ModelArtifactSource is a tagged union: exactly one member is set, webhook-enforced.
message ModelArtifactSource {
  // HuggingFace is a Hugging Face model repository at one revision.
  //
  // +optional
  optional ModelArtifactHubSource huggingFace = 1;

  // ModelScope is RESERVED AND REFUSED by admission in this version. Its shape is fixed so that
  // opening it is a webhook change rather than a schema change, and the refusal names what opening
  // it needs: branch resolution cross-checked against git, a listing that re-lists per directory at
  // the API's silent truncation point, errors classified by the envelope code, and an engine runner
  // whose ModelScope SDK accepts a commit as the revision.
  //
  // +optional
  optional ModelArtifactHubSource modelScope = 2;

  // PersistentVolumeClaim is a directory inside a claim in this namespace. The operator never
  // reads the claim's content, so the artifact has no revision and no digest, and what the
  // directory holds, and any change to it, is the user's.
  //
  // +optional
  optional ModelArtifactPersistentVolumeClaimSource persistentVolumeClaim = 3;
}

// ModelArtifactSpec defines the desired state of ModelArtifact.
message ModelArtifactSpec {
  // Source is where the weights come from.
  //
  // +required
  optional ModelArtifactSource source = 1;

  // AllowPatterns and IgnorePatterns select the files of a hub source that make up the artifact,
  // with the semantics of huggingface_hub's allow_patterns and ignore_patterns: Python's
  // fnmatch.fnmatchcase, where "*" and "?" cross "/"; a pattern ending in "/" is the directory's
  // contents; no allow pattern keeps every file; an ignore pattern wins over an allow pattern.
  //
  // The selection happens before the manifest is built, so the digest, file count and size
  // describe the selected files, while the patterns themselves never enter the digest: two
  // artifacts selecting the same files share one digest, and an artifact with no pattern has the
  // digest of the whole commit. Only node delivery can honor a selection; an engine that downloads
  // the weights itself chooses its own files. A claim source takes none, webhook-enforced, and
  // each pattern is 1 to 256 characters without a control character.
  //
  // +optional
  // +listType=atomic
  // +k8s:validation:maxItems=32
  repeated string allowPatterns = 2;

  // +optional
  // +listType=atomic
  // +k8s:validation:maxItems=32
  repeated string ignorePatterns = 3;
}

// ModelArtifactStatus defines the observed state of ModelArtifact.
message ModelArtifactStatus {
  // ObservedGeneration is the generation the status was written for.
  optional int64 observedGeneration = 1;

  // Resolved is what the source was resolved to. It is written once and never changes afterwards:
  // a later revalidation moves only LastValidatedTime and the conditions. It is absent until the
  // first resolution succeeds.
  //
  // +optional
  optional ModelArtifactResolved resolved = 2;

  // Conditions: Resolved says whether the source is bound to its immutable identity and the most
  // recent access check passed; Degraded says a resolution or revalidation is failing, including
  // one that has not yet revoked access.
  //
  // +patchMergeKey=type
  // +patchStrategy=merge
  // +listType=map
  // +listMapKey=type
  repeated .gpustack.ai.gpustack.api.v1.Condition conditions = 3;
}

// ModelDeployment is the schema for worker.gpustack.ai.
//
// It is N replicas of one inference-engine role attached to a KV cache pool, so that the replicas
// hit each other's cached prefixes instead of each re-computing the same prefill.
//
// It RENDERS PODS DIRECTLY. The admission chain keys on Pods, so rendering Pods reuses every
// existing gate with no new integration point.
//
// +genclient
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object
// +k8s:crd-gen:resource:scope="Namespaced",categories=["gpustack"],shortName=["md"],subResources=["status"]
// +k8s:crd-gen:printcolumn:name="Engine",type="string",jsonPath=".spec.engine.name"
// +k8s:crd-gen:printcolumn:name="Roles",type="string",jsonPath=".status.roleSummary"
// +k8s:crd-gen:printcolumn:name="Phase",type="string",jsonPath=".status.phase"
// +k8s:crd-gen:printcolumn:name="Endpoint",type="string",jsonPath=".status.endpoint"
message ModelDeployment {
  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ObjectMeta metadata = 1;

  optional ModelDeploymentSpec spec = 2;

  optional ModelDeploymentStatus status = 3;
}

// ModelDeploymentAdditionalVolume defines one volume to mount in a role's replica besides the
// operator's own. One of the sources below must be set; an entry naming none is skipped by the
// render rather than refused.
message ModelDeploymentAdditionalVolume {
  // MountPath is the absolute in-container path to mount the volume at. It must not duplicate
  // another entry's path, nor a path the operator's own volumes already mount.
  //
  // +required
  // +k8s:validation:pattern="^(/[^/]+)+$"
  // +k8s:validation:maxLength=1024
  optional string mountPath = 1;

  // ReadOnly mounts the volume read-only.
  optional bool readOnly = 2;

  // SubPath mounts a relative path inside the volume rather than its root.
  // It must not be absolute nor contain a ".." element.
  //
  // The pattern below enforces only the first half. A ".." element cannot be excluded by this
  // engine's regular expressions, which have no negative lookahead, so admission carries that
  // half — see the webhook. Both halves are refused there rather than left to the API server's
  // rejection of the rendered Pod, which arrives as a per-pass create failure naming a
  // volumeMount instead of an admission error naming this field.
  //
  // +k8s:validation:pattern="^[^/].*$"
  // +k8s:validation:maxLength=1024
  optional string subPath = 3;

  // ConfigMap is the reference to the ConfigMap to mount, in the same namespace.
  optional .k8s.io.api.core.v1.LocalObjectReference configMap = 4;

  // Secret is the reference to the Secret to mount, in the same namespace.
  optional .k8s.io.api.core.v1.LocalObjectReference secret = 5;

  // HostPath is the path on the Kubernetes Node to mount. It crosses the node boundary: the
  // mount reaches the node's own filesystem rather than a namespaced object, so what it exposes
  // is decided by what the node carries rather than by anything this API can see.
  optional .k8s.io.api.core.v1.HostPathVolumeSource hostPath = 6;
}

// ModelDeploymentEngine is the engine a deployment runs and the version of it.
//
// The two are one object because they were never meaningful apart: a role that names no image of
// its own has one assembled from the engine and the version together with the role's own
// InstanceType. The version carries no obligation of its own — it is owed exactly when some role
// needs that assembly, which admission rather than the schema decides, because which roles need it
// is a fact about the roles and not about this field.
message ModelDeploymentEngine {
  // Name selects the engine.
  //
  // It is the half of this object that is the deployment's identity and is frozen after creation,
  // while Version answers which build runs and stays editable — stated here because one object
  // reading otherwise would freeze the pair together.
  //
  // +required
  // +k8s:validation:enum=["vllm","sglang"]
  optional string name = 1;

  // Version is the engine's own version, e.g. "0.29.0" for vllm or "0.5.18" for sglang.
  //
  //   - It is OPTIONAL, and the obligation sits with the roles instead: a role that names no image
  //     of its own has one synthesized from this version, so admission refuses an empty version
  //     beside such a role rather than letting the render assemble a malformed tag naming
  //     something never typed. A role that names an image never reads this field.
  //   - It is free-form and UNVALIDATED, by decision: the user guarantees that the version and the
  //     driver each role's hardware installed are aligned. A gate would need the runner's release
  //     matrix compiled into the operator, and the failure it would prevent is already legible as
  //     an ImagePullBackOff on a tag that does not exist.
  //   - It is per deployment rather than per role, which is what lets one version assemble a
  //     DIFFERENT image for each role: the backend half of the tag comes from the role's own
  //     InstanceType, so a prefill role on NVIDIA and a decode role on Ascend need no extra field.
  //     Published version sets do NOT overlap across every backend, so one version has to name a
  //     tag that exists for each backend the roles land on.
  //
  // +optional
  // +k8s:validation:minLength=1
  // +k8s:validation:maxLength=64
  optional string version = 2;
}

// ModelDeploymentEnvVar defines one environment variable appended to a role's replica.
message ModelDeploymentEnvVar {
  // Name is the name of the environment variable; each name in one role must be unique.
  optional string name = 1;

  // Value is the value of the environment variable.
  optional string value = 2;
}

// ModelDeploymentKVCache attaches the deployment to a KV cache pool.
//
// THE REUSE DOMAIN IS NOT DECLARED HERE, AND THAT IS A SECURITY PROPERTY. The storage layer's tenant
// IS the reuse domain, so every distinct domain is a tenant with its own quota ledger: a workload
// free to name arbitrary domains could mint unlimited tenants in its namespace and escape the
// namespace quota ceiling entirely. Domain naming therefore lives on the KVCachePoolBinding, which
// an admin owns.
message ModelDeploymentKVCache {
  // PoolRef names a KVCachePoolBinding IN THIS NAMESPACE. The Binding is the authorization point:
  // an admin creating one in a namespace is what grants that namespace access to the pool. The
  // type is a LocalObjectReference rather than a namespaced one so that reaching another
  // namespace — or naming the cluster-scoped pool, or a bare endpoint URL — is unrepresentable
  // rather than merely rejected.
  //
  // +required
  optional .k8s.io.api.core.v1.LocalObjectReference poolRef = 1;

  // Connector names the connector implementation this deployment is configured for. The value is
  // an identity the deployment carries, not a setting the operator derives: "mooncake" says which
  // connector this is, and nothing reads the field to produce the configuration. There is no
  // "none" — synthesizing nothing is reachable through a full command replacement, which also
  // marks the role unmanaged and moves CacheAttached to Unknown.
  //
