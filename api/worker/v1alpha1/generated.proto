  optional .k8s.io.apimachinery.pkg.apis.meta.v1.ListMeta metadata = 1;

  repeated InstanceType items = 2;
}

// InstanceTypePartitionedResource describes the hardware-partitionable resource of the
// InstanceType: the scalar view every resource shares, plus the pool's per-profile ledger.
//
// The per-profile lists are what answers "which partition profiles can I still get". Neither of
// the alternatives does: the scalar Remaining is the best case over an accelerator's profiles
// rather than a total (the profiles on one accelerator compete for the same physical slices, so
// summing them would multiply-count the same hardware), and Detail.SlicedDetail is the static
// capability catalog, which by design does not move as instances are carved and released.
message InstanceTypePartitionedResource {
  optional InstanceTypeResource resource = 1;

  // AllocatedProfiles lists, by profile name, how many instances of each profile the pool's
  // partitioned accelerators currently hold, summed over those accelerators. A profile holding
  // nothing is absent rather than listed at zero — unlike RemainingProfiles, where zero carries
  // meaning.
  //
  // The worker gateway ingests it per candidate and sums it by profile name into the fleet-wide
  // aggregate it serves, so changing its zero-handling or its presence changes that aggregate too.
  // Its readers are the consumers of this status — the UI and the GPUStack app — which show what a
  // pool is running beside what it can still take, and which cannot derive it: RemainingProfiles
  // alone cannot say whether a zero is "occupied" or merely "squeezed out by a sibling profile".
  //
  // +listType=map
  // +listMapKey=name
  repeated AcceleratorProfileCount allocatedProfiles = 2;

  // RemainingProfiles lists, by profile name, how many more instances of each profile the pool
  // can still host, summed over its partitioned accelerators.
  //
  // Every profile the pool offers gets an entry, even at zero, so a profile whose room a
  // sibling's instance consumed reads 0 instead of vanishing — a reader can tell "offered but
  // currently full" from "not offered at all", and the wholesale status write does not churn the
  // key set on every carve and release.
  //
  // +listType=map
  // +listMapKey=name
  repeated AcceleratorProfileCount remainingProfiles = 3;
}

// InstanceTypeResource describes the resource of the InstanceType.
message InstanceTypeResource {
  // OnceMaxRequest is the maximum value of the resource that can be requested once.
  //
  // This is a soft limitation. Requesting this value may result in scheduling failure.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity onceMaxRequest = 1;

  // Remaining is the remaining requestable value of the resource.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity remaining = 2;

  // Capacity is the total value of the resource.
  optional .k8s.io.apimachinery.pkg.api.resource.Quantity capacity = 3;
}

// InstanceTypeSpec defines the desired spec of InstanceType. Its field order and protobuf
// numbering group the admin-editable fields (DisplayName, Description, Inactive) first, followed
// by the immutable identity and hardware inputs.
message InstanceTypeSpec {
  // DisplayName is a human-friendly label for the InstanceType. It is admin-editable and, for a
  // derived InstanceType, stamped at derivation time.
  //
  // +k8s:validation:maxLength=64
  optional string displayName = 1;

  // Description is a free-form admin annotation for the InstanceType.
  //
  // +k8s:validation:maxLength=1024
  optional string description = 2;

  // Inactive takes the InstanceType out of service. When true, the InstanceTypeReconciler
  // holds the backing ClusterQueue (blocks new admission without evicting running
  // workloads); clearing it reactivates the queue. A queue stopped by any means is
  // reflected back into Inactive=true.
  optional bool inactive = 3;

  // AcceleratorGroup is the accelerator group (the acceleratable node key) of the
  // InstanceType, e.g. "nvidia-a10g". It selects the accelerator pool the type schedules
  // onto and is required by the validating webhook when Acceleratable is true.
  optional string acceleratorGroup = 4;

  // GeneralGroup is the general(CPU) group (the general node key) of the InstanceType, e.g.
  // "amd-epyc-7763", or the literal "generic" for a CPU-manufacturer-agnostic pool. The
  // mutating webhook defaults an empty value to "generic"; it participates as a scheduling
  // discriminator only when instance-type-aware-cpu-manufacturer is enabled.
  optional string generalGroup = 5;

