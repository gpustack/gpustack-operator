<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 938" role="img" aria-labelledby="title desc">
<title id="title">Elastic EP over TCP vs InfiniBand RDMA, width 2 and width 4</title>
<desc id="desc">Four-panel line chart comparing Elastic EP width 2 (4 GPUs) and width 4 (8 GPUs) over TCP and InfiniBand RDMA across concurrency 1 to 64 for TTFT p50 (ms, log scale), output throughput (tok/s), ITL p50 (ms) and ITL p99 (ms). Over InfiniBand RDMA at concurrency 64, width 4 cuts TTFT p50 to 373.486 ms (8.23x below RDMA width 2 and 6.96x below TCP width 4) and raises output throughput to 3,755.290 tok/s (1.64x over RDMA width 2), while width 2 still leads output at concurrencies 1 through 32 and RDMA width 2 concurrency 4 shows an ITL p99 regression (68.396 vs 12.290 ms TCP).</desc>
<style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--grid:#e4edf5;--axis:#8aa0b6;--c1:#2563eb;--c2:#c2410c;--c3:#0f766e;--c4:#7c3aed}
