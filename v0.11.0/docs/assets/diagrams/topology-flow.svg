<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Hierarchical Cluster Topology</title><desc id="desc">Place multi-Pod workloads near the hardware and fabric they use Illustrative configuration; optional capabilities depend on setup.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)} .title{font-size:29px;font-weight:750;letter-spacing:-.4px}.sub{font-size:14px;fill:var(--muted)}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}.ct{font-size:15px;font-weight:700}.detail{font-size:12px;fill:var(--muted)}.small{font-size:11px;fill:var(--muted)}.mono{font:12px ui-monospace,SFMono-Regular,monospace;fill:var(--ink)}.badge{font-size:10px;font-weight:700;fill:var(--emerald);letter-spacing:.5px}.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}.tint{fill:var(--soft);stroke:var(--line);stroke-width:1.1}.wire{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:5 5;opacity:.85}.dot{fill:var(--teal)}.headline{font-size:16px;font-weight:750;letter-spacing:.35px}.pill{font-size:12px;font-weight:650}.track{fill:var(--grid)}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1200" height="940" fill="var(--bg)"/><rect width="1200" height="940" fill="url(#grid)" opacity=".65"/><text class="label" x="32" y="32" >GPUSTACK OPERATOR  /  CAPABILITY OVERVIEW</text><text class="title" x="32" y="70" >Hierarchical Cluster Topology</text><text class="sub" x="32" y="94" >Place multi-Pod workloads near the hardware and fabric they use</text><rect x="1092" y="32" width="38" height="38" rx="9" fill="var(--blue)"/><text class="headline" x="1111" y="59" text-anchor="middle" fill="white" style="fill:white">G</text><rect x="28" y="112" width="462.20000000000005" height="20" rx="3" fill="var(--bg)"/><text class="label" x="34" y="126" >HIERARCHICAL TOPOLOGY DOMAINS  ·  REGION → ZONE → TRAY</text><rect class="box" x="32" y="142" width="1136" height="203" rx="15" style="stroke:var(--purple)"/><text class="ct" x="50" y="167" >REGION  ·  us-west-1</text><rect class="tint" x="50" y="181" width="534" height="145" rx="10" /><text class="ct" x="65" y="205" >ZONE A  ·  us-west-1a</text><rect class="box" x="64" y="218" width="240" height="88" rx="8" /><text class="detail" x="76" y="240" >TRAY 01  ·  rack / NVL72</text><text class="mono" x="76" y="262" >node-01  +  node-02</text><text class="small" x="76" y="288" >replica locality</text><rect class="box" x="317" y="218" width="240" height="88" rx="8" /><text class="detail" x="329" y="240" >TRAY 02  ·  rack / NVL72</text><text class="mono" x="329" y="262" >node-03  +  node-04</text><text class="small" x="329" y="288" >scheduling domain</text><rect class="tint" x="602" y="181" width="534" height="145" rx="10" /><text class="ct" x="617" y="205" >ZONE B  ·  us-west-1b</text><rect class="box" x="616" y="218" width="240" height="88" rx="8" /><text class="detail" x="628" y="240" >TRAY 03  ·  rack / NVL72</text><text class="mono" x="628" y="262" >node-05  +  node-06</text><text class="small" x="628" y="288" >scheduling domain</text><rect class="box" x="869" y="218" width="240" height="88" rx="8" /><text class="detail" x="881" y="240" >TRAY 04  ·  rack / NVL72</text><text class="mono" x="881" y="262" >additional hosts</text><text class="small" x="881" y="288" >scheduling domain</text><path class="wire" d="M 230 429 L 230 320"/><circle class="dot" r="3.5"><animateMotion path="M 230 429 L 230 320" dur="2.6s" begin="-0.0s" repeatCount="indefinite"/></circle><path class="wire" d="M 230 668 L 230 553"/><circle class="dot" r="3.5"><animateMotion path="M 230 668 L 230 553" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><path class="wire" d="M 480 429 L 480 320"/><circle class="dot" r="3.5"><animateMotion path="M 480 429 L 480 320" dur="2.6s" begin="-0.37s" repeatCount="indefinite"/></circle><path class="wire" d="M 480 668 L 480 553"/><circle class="dot" r="3.5"><animateMotion path="M 480 668 L 480 553" dur="2.6s" begin="-1.1099999999999999s" repeatCount="indefinite"/></circle><path class="wire" d="M 730 429 L 730 320"/><circle class="dot" r="3.5"><animateMotion path="M 730 429 L 730 320" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><path class="wire" d="M 730 668 L 730 553"/><circle class="dot" r="3.5"><animateMotion path="M 730 668 L 730 553" dur="2.6s" begin="-1.48s" repeatCount="indefinite"/></circle><path class="wire" d="M 980 429 L 980 320"/><circle class="dot" r="3.5"><animateMotion path="M 980 429 L 980 320" dur="2.6s" begin="-1.1099999999999999s" repeatCount="indefinite"/></circle><path class="wire" d="M 980 668 L 980 553"/><circle class="dot" r="3.5"><animateMotion path="M 980 668 L 980 553" dur="2.6s" begin="-1.85s" repeatCount="indefinite"/></circle><rect class="box" x="32" y="429" width="1136" height="124" rx="16" style="stroke:var(--blue);stroke-width:1.8"/><rect x="52" y="451" width="46" height="46" rx="10" fill="var(--blue)"/><text class="headline" x="75" y="482" tex