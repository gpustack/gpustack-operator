2" y="726" >GPU compute host</text><text class="detail" x="432" y="745" >fabric connected</text><rect class="box" x="608" y="668" width="176" height="145" rx="12" /><rect x="608" y="680" width="4" height="121" rx="2" fill="var(--blue)"/><g fill="none" stroke="var(--blue)" stroke-width="1.6"><rect x="623" y="685" width="24" height="20" rx="4"/><rect x="629" y="690" width="12" height="10" rx="2"/><path d="M620 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="658" y="699" >node-04</text><text class="detail" x="624" y="726" >GPU compute host</text><text class="detail" x="624" y="745" >fabric connected</text><rect class="box" x="800" y="668" width="176" height="145" rx="12" /><rect x="800" y="680" width="4" height="121" rx="2" fill="var(--purple)"/><g fill="none" stroke="var(--purple)" stroke-width="1.6"><rect x="815" y="685" width="24" height="20" rx="4"/><rect x="821" y="690" width="12" height="10" rx="2"/><path d="M812 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="850" y="699" >node-05</text><text class="detail" x="816" y="726" >GPU compute host</text><text class="detail" x="816" y="745" >fabric connected</text><rect class="box" x="992" y="668" width="176" height="145" rx="12" /><rect x="992" y="680" width="4" height="121" rx="2" fill="var(--teal)"/><g fill="none" stroke="var(--teal)" stroke-width="1.6"><rect x="1007" y="685" width="24" height="20" rx="4"/><rect x="1013" y="690" width="12" height="10" rx="2"/><path d="M1004 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="1042" y="699" >node-06</text><text class="detail" x="1008" y="726" >GPU compute host</text><text class="detail" x="1008" y="745" >fabric connected</text><text class="small" x="33" y="847" >Example: GB300 NVL72 may contain up to 18 trays; actual hierarchy depends on inventory.</text><rect class="box" x="32" y="874" width="368" height="42" rx="10" /><circle cx="52.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="52.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="67" y="900" >Region → zone → tray hierarchy</text><rect class="box" x="416" y="874" width="368" height="42" rx="10" /><circle cx="436.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="436.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="451" y="900" >Co-located multi-Pod replicas</text><rect class="box" x="800" y="874" width="368" height="42" rx="10" /><circle cx="820.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="820.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="835" y="900" >Hardware-locality scheduling</text></svg>
