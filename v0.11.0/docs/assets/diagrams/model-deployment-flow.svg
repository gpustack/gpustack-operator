<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Disaggregated &amp; Elastic LLM Serving</title><desc id="desc">Bring model weights, accelerator pools and routing together Illustrative configuration; optional capabilities depend on setup.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)} .title{font-size:29px;font-weight:750;letter-spacing:-.4px}.sub{font-size:14px;fill:var(--muted)}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}.ct{font-size:15px;font-weight:700}.detail{font-size:12px;fill:var(--muted)}.small{font-size:11px;fill:var(--muted)}.mono{font:12px ui-monospace,SFMono-Regular,monospace;fill:var(--ink)}.badge{font-size:10px;font-weight:700;fill:var(--emerald);letter-spacing:.5px}.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}.tint{fill:var(--soft);stroke:var(--line);stroke-width:1.1}.wire{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:5 5;opacity:.85}.dot{fill:var(--teal)}.headline{font-size:16px;font-weight:750;letter-spacing:.35px}.pill{font-size:12px;font-weight:650}.track{fill:var(--grid)}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
