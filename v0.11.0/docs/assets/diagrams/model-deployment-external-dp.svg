<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">External DP: Every Rank Serves HTTP</title><desc id="desc">Fixed size: 4 example · TP = 2 GPUs per vLLM rank · router required.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
