<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Interactive GPU workspaces</title><desc id="desc">Provision accelerator-backed developer Pods with optional SSH Illustrative configuration; optional capabilities depend on setup.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)} .title{font-size:29px;font-weight:750;letter-spacing:-.4px}.sub{font-size:14px;fill:var(--muted)}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}.ct{font-size:15px;font-weight:700}.detail{font-size:12px;fill:var(--muted)}.small{font-size:11px;fill:var(--muted)}.mono{font:12px ui-monospace,SFMono-Regular,monospace;fill:var(--ink)}.badge{font-size:10px;font-weight:700;fill:var(--emerald);letter-spacing:.5px}.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}.tint{fill:var(--soft);stroke:var(--line);stroke-width:1.1}.wire{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:5 5;opacity:.85}.dot{fill:var(--teal)}.headline{font-size:16px;font-weight:750;letter-spacing:.35px}.pill{font-size:12px;font-weight:650}.track{fill:var(--grid)}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1200" height="940" fill="var(--bg)"/><rect width="1200" height="940" fill="url(#grid)" opacity=".65"/><text class="label" x="32" y="32" >GPUSTACK OPERATOR  /  CAPABILITY OVERVIEW</text><text class="title" x="32" y="70" >Interactive GPU workspaces</text><text class="sub" x="32" y="94" >Provision accelerator-backed developer Pods with optional SSH</text><rect x="1092" y="32" width="38" height="38" rx="9" fill="var(--blue)"/><text class="headline" x="1111" y="59" text-anchor="middle" fill="white" style="fill:white">G</text><rect x="28" y="112" width="354.3" height="20" rx="3" fill="var(--bg)"/><text class="label" x="34" y="126" >DEVELOPER WORKSPACES  ·  SSH &amp; IDE ACCESS</text><rect class="box" x="32" y="151" width="368" height="172" rx="12" /><rect x="32" y="163" width="4" height="148" rx="2" fill="var(--blue)"/><g fill="none" stroke="var(--blue)" stroke-width="1.7"><path d="M47 172h9l3 3h12v13H47z"/><path d="M51 181h13"/></g><text class="ct" x="82" y="182" >workspace-01</text><text class="detail" x="48" y="209" >20% GPU memory slice</text><text class="detail" x="48" y="228" >SSH port 2222</text><text class="badge" x="386" y="182" text-anchor="end">READY</text><rect class="tint" x="48" y="270" width="336" height="31" rx="6" /><text class="mono" x="58" y="290" >$ ssh -p 2222 user@host</text><rect class="box" x="416" y="151" width="368" height="172" rx="12" /><rect x="416" y="163" width="4" height="148" rx="2" fill="var(--purple)"/><g fill="none" stroke="var(--purple)" stroke-width="1.7"><path d="M431 172h9l3 3h12v13H431z"/><path d="M435 181h13"/></g><text class="ct" x="466" y="182" >workspace-02</text><text class="detail" x="432" y="209" >1× H100 whole GPU</text><text class="detail" x="432" y="228" >PyTorch + CUDA image</text><text class="badge" x="770" y="182" text-anchor="end">READY</text><rect class="tint" x="432" y="270" width="336" height="31" rx="6" /><text class="mono" x="442" y="290" >$ python  ·  CUDA ready</text><rect class="box" x="800" y="151" width="368" height="172" rx="12" /><rect x="800" y="163" width="4" height="148" rx="2" fill="var(--teal)"/><g fill="none" stroke="var(--teal)" stroke-width="1.7"><path d="M815 172h9l3 3h12v13H815z"/><path d="M819 181h13"/></g><text class="ct" x="850" y="182" >workspace-03</text><text class="detail" x="816" y="209" >4× GPU development Pod</text><text class="detail" x="816" y="228" >Persistent volume mounted</text><text class="badge" x="1154" y="182" text-anchor="end">READY</text><rect class="tint" x="816" y="270" width="336" height="31" rx="6" /><text class="mono" x="826" y="290" >/workspace  ·  persistent</text><path class="wire" d="M 216 429 L 216 320"/><circle class="dot" r="3.5"><animateMotion path="M 216 429 L 216 320" dur="2.6s" begin="-0.0s" repeatCount="indefinite"/></circle><path class="wire" d="M 216 668 L 216 553"/><circle class="dot" r="3.5"><animateMotion path="M 216 668 L 216 553" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><path class="wire" d="M 600 429 L 600 320"/><circle class="dot" r="3.5"><animateMotion path="M 600 429 L 600 320" dur="2.6s" begin="-0.37s" repeatCount="indefinite"/></circle><path class="wire" d="M 600 668 L 600 553"/><circle class="dot" r="3.5"><animateMotion path="M 600 668 L 600 553" dur="2.6s" begin="-1.1099999999999999s" repeatCount="indefinite"/></circle><path class="wire" d="M 984 429 L 984 320"/><circle class="dot" r="3.5"><animateMotion path="M 984 429 L 984 320" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><path class="wire" d="M 984 668 L 984 553"/><circle class="dot" r="3.5"><animateMotion path="M 984 668 L 984 553" dur="2.6s" begin="-1.48s" repeatCount="indefinite"/></circle><rect class="box" x="32" y="429" width="1136" height="124" rx="16" style="stroke:var(--blue);stroke-width:1.8"/><rect x="52" y="451" width="46" height="46" rx="10" fill="var(--blue)"/><text class="headline" x="75" y="482" text-anchor="middle" style="fill:white;font-size:23px">G</text><text class="headline" x="116" y="463" >GPU WORKSPACE PROVISIONER</text><text class="sub" x="116" y="489" >Whole or sliced GPUs  ·  SSH public keys</text><text class="detail" x="116" y="516" >Persistent volumes and SSH / web ports when configured</text><rect x="28" y="630" width="478.80000000000007" height="20" rx="3" fill="var(--bg)"/><text class="label" x="34" y="644" >CLUSTER GPU CAPACITY  ·  WHOLE CARDS &amp; FRACTIONAL SLICES</text><rect class="box" x="32" y="668" width="272" height="155" rx="12" /><rect x="32" y="680" width="4" height="131" rx="2" fill="var(--blue)"/><g fill="none" stroke="var(--blue)" stroke-width="1.6"><rect x="47" y="685" width="24" height="20" rx="4"/><rect x="53" y="690" width="12" height="10" rx="2"/><path d="M44 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="82" y="699" >Whole H100</text><text class="detail" x="48" y="726" >80 GB accelerator</text><text class="detail" x="48" y="745" >Available by configuration</text><rect class="box" x="320" y="668" width="272" height="155" rx="12" /><rect x="320" y="680" width="4" height="131" rx="2" fill="var(--purple)"/><g fill="none" stroke="var(--purple)" stroke-width="1.6"><rect x="335" y="685" width="24" height="20" rx="4"/><rect x="341" y="690" width="12" height="10" rx="2"/><path d="M332 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="370" y="699" >Logical slice</text><text class="detail" x="336" y="726" >20% VRAM example</text><text class="detail" x="336" y="745" >Available by configuration</text><rect class="box" x="608" y="668" width="272" height="155" rx="12" /><rect x="608" y="680" width="4" height="131" rx="2" fill="var(--teal)"/><g fill="none" stroke="var(--teal)" stroke-width="1.6"><rect x="623" y="685" width="24" height="20" rx="4"/><rect x="629" y="690" width="12" height="10" rx="2"/><path d="M620 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="658" y="699" >MIG partition</text><text class="detail" x="624" y="726" >1g.10gb example</text><text class="detail" x="624" y="745" >Available by configuration</text><rect class="box" x="896" y="668" width="272" height="155" rx="12" /><rect x="896" y="680" width="4" height="131" rx="2" fill="var(--amber)"/><g fill="none" stroke="var(--amber)" stroke-width="1.6"><rect x="911" y="685" width="24" height="20" rx="4"/><rect x="917" y="690" width="12" height="10" rx="2"/><path d="M908 691h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="946" y="699" >Shared GPU</text><text class="detail" x="912" y="726" >Shared allocation</text><text class="detail" x="912" y="745" >Available by configuration</text><rect class="box" x="32" y="874" width="368" height="42" rx="10" /><circle cx="52.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="52.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="67" y="900" >Whole GPU or fractional slice</text><rect class="box" x="416" y="874" width="368" height="42" rx="10" /><circle cx="436.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="436.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="451" y="900" >SSH keys &amp; port access</text><rect class="box" x="800" y="874" width="368" height="42" rx="10" /><circle cx="820.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="820.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="835" y="900" >Persistent development Pods</text></svg>
