idth="368" height="42" rx="10" /><circle cx="52.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="52.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="67" y="900" >RoCE / InfiniBand / EFA</text><rect class="box" x="416" y="874" width="368" height="42" rx="10" /><circle cx="436.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="436.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="451" y="900" >Same-NUMA GPU + NIC alignment</text><rect class="box" x="800" y="874" width="368" height="42" rx="10" /><circle cx="820.0" cy="895.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="820.0" cy="895.5" r="2.5" fill="var(--emerald)"/><text class="pill" x="835" y="900" >Shared &amp; exclusive RDMA grants</text></svg>
