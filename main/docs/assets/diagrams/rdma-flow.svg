<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">High-speed RDMA fabric</title><desc id="desc">Choose fabric interfaces and align them with accelerator locality Illustrative configuration; optional capabilities depend on setup.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)} .title{font-size:29px;font-weight:750;letter-spacing:-.4px}.sub{font-size:14px;fill:var(--muted)}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}.ct{font-size:15px;font-weight:700}.detail{font-size:12px;fill:var(--muted)}.small{font-size:11px;fill:var(--muted)}.mono{font:12px ui-monospace,SFMono-Regular,monospace;fill:var(--ink)}.badge{font-size:10px;font-weight:700;fill:var(--emerald);letter-spacing:.5px}.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}.tint{fill:var(--soft);stroke:var(--line);stroke-width:1.1}.wire{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:5 5;opacity:.85}.dot{fill:var(--teal)}.headline{font-size:16px;font-weight:750;letter-spacing:.35px}.pill{font-size:12px;font-weight:650}.track{fill:var(--grid)}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1200" height="940" fill="var(--bg)"/><rect width="1200" height="940" fill="url(#grid)" opacity=".65"/><text class="label" x="32" y="32" >GPUSTACK OPERATOR  /  CAPABILITY OVERVIEW</text><text class="title" x="32" y="70" >High-speed RDMA fabric</text><text class="sub" x="32" y="94" >Choose fabric interfaces and align them with accelerator locality</text><rect x="1092" y="32" width="38" height="38" rx="9" fill="var(--blue)"/><text class="headline" x="1111" y="59" text-anchor="middle" fill="white" style="fill:white">G</text><rect x="28" y="112" width="379.20000000000005" height="20" rx="3" fill="var(--bg)"/><text class="label" x="34" y="126" >ADMITTED WORKLOAD PODS  ·  GPU + RDMA FABRIC</text><rect class="box" x="32" y="160" width="400" height="160" rx="12" /><rect x="32" y="172" width="4" height="136" rx="2" fill="var(--blue)"/><g fill="none" stroke="var(--blue)" stroke-width="1.6"><rect x="47" y="177" width="24" height="20" rx="4"/><rect x="53" y="182" width="12" height="10" rx="2"/><path d="M44 183h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="82" y="191" >Pod A  ·  node-01</text><text class="detail" x="48" y="218" >GPU + mlx5_0</text><text class="detail" x="48" y="237" >Shared or exclusive RDMA grant</text><text class="badge" x="418" y="191" text-anchor="end">ALIGNED</text><rect class="box" x="768" y="160" width="400" height="160" rx="12" /><rect x="768" y="172" width="4" height="136" rx="2" fill="var(--purple)"/><g fill="none" stroke="var(--purple)" stroke-width="1.6"><rect x="783" y="177" width="24" height="20" rx="4"/><rect x="789" y="182" width="12" height="10" rx="2"/><path d="M780 183h3 m-3 8h3 m24-8h3 m-3 8h3"/></g><text class="ct" x="818" y="191" >Pod B  ·  node-02</text><text class="detail" x="784" y="218" >GPU + mlx5_0</text><text class="detail" x="784" y="237" >Shared or exclusive RDMA grant</text><text class="badge" x="1154" y="191" text-anchor="end">ALIGNED</text><path class="wire" d="M 435 231 L 765 231"/><circle class="dot" r="3.5"><animateMotion path="M 435 231 L 765 231" dur="2.6s" begin="-0.37s" repeatCount="indefinite"/></circle><path class="wire" d="M 765 250 L 435 250"/><circle class="dot" r="3.5"><animateMotion path="M 765 250 L 435 250" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><text class="label" x="600" y="205" text-anchor="middle">HIGH-SPEED FABRIC</text><text class="detail" x="600" y="280" text-anchor="middle">RoCE / InfiniBand / EFA</text><text class="small" x="600" y="299" text-anchor="middle">GPU or host transfers, when supported</text><path class="wire" d="M 232 320 L 232 429"/><circle class="dot" r="3.5"><animateMotion path="M 232 320 L 232 429" dur="2.6s" begin="-0.0s" repeatCount="indefinite"/></circle><path class="wire" d="M 968 320 L 968 429"/><circle class="dot" r="3.5"><animateMotion path="M 968 320 L 968 429" dur="2.6s" begin="-0.37s" repeatCount="indefinite"/></circle><path class="wire" d="M 232 553 L 232 666"/><circle class="dot" r="3.5"><animateMotion path="M 232 553 L 232 666" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><path class="wire" d="M 675 553 L 675 666"/><circle class="dot" r="3.5"><animateMotion path="M 675 553 L 675 666" dur="2.6s" begin="-1.1099999999999999s" repeatCount="indefinite"/></circle><rect class="box" x="32" y="429" width="1136" height="124" rx="16" style="stroke:var(--blue);stroke-width:1.8"/><rect x="52" y="451" width="46" height="46" rx="10" fill="var(--blue)"/><text class="headline" x="75" y="482" text-anchor="middle" style="fill:white;font-size:23px">G</text><text class="headline" x="116" y="463" >RDMA SELECTION &amp; NUMA ALIGNMENT</text><text class="sub" x="116" y="489" >Filters fabric HCAs by subnet and port</text><text class="detail" x="116" y="516" >Aligns GPU and RDMA NIC on a NUMA / PCIe domain when configured</text><rect x="