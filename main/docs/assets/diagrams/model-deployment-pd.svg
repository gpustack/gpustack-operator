<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Prefill and Decode</title><desc id="desc">A managed llm-d-router pairs compute and generation roles; the shared pool is optional.</desc><style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--blue:#2563eb;--purple:#7c3aed;--teal:#0d9488;--amber:#d97706;--emerald:#059669;--soft:#edf5fc;--grid:#dfeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--blue:#80adff;--purple:#c4a4ff;--teal:#58d6c8;--amber:#ffc273;--emerald:#5ce2af;--soft:#213b55;--grid:#29425b}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:var(--ink)}
.title{font-size:29px;font-weight:750;letter-spacing:-.4px}
.sub{font-size:14px;fill:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}
.head{font-size:16px;font-weight:700;fill:var(--ink)}
.body{font-size:13px;font-weight:600;fill:var(--ink)}
.tiny{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
.panel{fill:var(--soft);stroke:var(--line);stroke-width:1.3}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.3}
.pill{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.badge{display:none}
.line{fill:none;stroke:var(--teal);stroke-width:2;marker-end:url(#arrow)}
.dash{stroke-dasharray:5 5}
.dot{fill:var(--teal)}
.headline{font-size:16px;font-weight:750;letter-spacing:.35px}
@media(prefers-reduced-motion:reduce){.dot{display:none}}
</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="var(--teal)"/></marker></defs><rect width="1200" height="700" fill="var(--bg)"/><rect width="1200" height="700" fill="url(#grid)" opacity=".65"/><rect x="1122" y="34" width="38" height="38" rx="9" fill="var(--blue)"/><text class="headline" x="1141" y="61" text-anchor="middle" fill="white" style="fill:white">G</text><text x="40" y="48" class="label">MODEL DEPLOYMENT · CAPABILITY</text><text x="40" y="90" class="title">Prefill and Decode</text><text x="40" y="118" class="sub">A managed llm-d-router pairs compute and generation roles; the shared pool is optional.</text><rect x="40" y="185" width="185" height="95" rx="13" class="card"/><rect x="40" y="195" width="4" height="75" rx="2" fill="var(--blue)"/><text x="56" y="213" class="head">Client request</text><text x="56" y="237" class="tiny">Prompt + response</text><rect x="153" y="248" width="58" height="22" rx="11" class="badge"/><text x="162" y="263" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">LIVE</text><rect x="300" y="185" width="240" height="95" rx="13" class="card"/><rect x="300" y="195" width="4" height="75" rx="2" fill="var(--purple)"/><text x="316" y="213" class="head">llm-d-router</text><text x="316" y="237" class="tiny">Selects paired endpoints</text><rect x="468" y="248" width="58" height="22" rx="11" class="badge"/><text x="477" y="263" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">ACTIVE</text><rect x="800" y="185" width="355" height="110" rx="13" class="card"/><rect x="800" y="195" width="4" height="90" rx="2" fill="var(--teal)"/><text x="816" y="213" class="head">Decode Pod · routing sidecar</text><text x="816" y="237" class="tiny">HTTP proxy · nixlv2 on Ascend</text><text x="816" y="256" class="tiny">Executes prefill, forwards to decoder</text><rect x="1083" y="263" width="58" height="22" rx="11" class="badge"/><text x="1092" y="278" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">ACTIVE</text><path d="M225 232 H300" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M225 232 H300"/></circle><path d="M540 232 H800" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M540 232 H800"/></circle><text x="635" y="221" class="tiny">request</text><rect x="60" y="380" width="360" height="135" rx="13" class="card"/><rect x="60" y="390" width="4" height="115" rx="2" fill="var(--amber)"/><text x="76" y="408" class="head">Prefill Role Pods</text><text x="76" y="432" class="tiny">Compute-bound prompt processing · TP / PP</text><text x="76" y="451" class="tiny">Compute prompt KV blocks</text><rect x="348" y="483" width="58" height="22" rx="11" class="badge"/><text x="357" y="498" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">READY</text><rect x="780" y="380" width="375" height="135" rx="13" class="card"/><rect x="780" y="390" width="4" height="115" rx="2" fill="var(--blue)"/><text x="796" y="408" class="head">Decode Role Pods</text><text x="796" y="432" class="tiny">Bandwidth-bound token generation</text><text x="796" y="451" class="tiny">Receives KV blocks · streams tokens</text><rect x="1083" y="483" width="58" height="22" rx="11" class="badge"/><text x="1092" y="498" style="font-size:10.5px;font-weight:700;fill:var(--emerald);letter-spacing:.6px">READY</text><path d="M865 295 C865 330 330 300 290 380" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M865 295 C865 330 330 300 290 380"/></circle><text x="540" y="308" class="tiny">prefill request</text><path d="M420 445 H780" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M420 445 H780"/></circle><text x="474" y="425" class="tiny">DIRECT KV BLOCK TRANSFER</text><text x="470" y="472" class="tiny">MooncakeConnector / V1 · RDMA / RoCE / TCP</text><rect x="470" y="535" width="290" height="70" rx="13" class="card"/><rect x="470" y="545" width="4" height="50" rx="2" fill="var(--purple)"/><text x="486" y="563" class="head">Optional Shared KV Pool</text><text x="486" y="587" class="tiny">MultiConnector + StoreConnector</text><path d="M380 515 C380 570 420 570 470 570" class="line dash"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M380 515 C380 570 420 570 470 570"/></circle><path d="M780 515 C780 570 770 570 760 570" class="line dash"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M780 515 C780 570 770 570 760 570"/></circle><text x="470" y="620" class="tiny">MooncakeStoreConnector / AscendStoreConnector</text><path d="M1155 430 H1180 V145 H145 V185" class="line"/><circle r="4" class="dot"><animateMotion dur="2.8s" repeatCount="indefinite" path="M1155 430 H1180 V145 H145 V185"/></circle><text x="590" y="135" class="tiny">stream tokens to client</text><rect x="40" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="62.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="62.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="77" y="662" class="body">Separate Prefill &amp; Decode Pools</text><rect x="420" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="442.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="442.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="457" y="662" class="body">Direct RDMA/TCP KV Block Transfer</text><rect x="800" y="634" width="360" height="44" rx="10" class="pill"/><circle cx="822.0" cy="657.5" r="5.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><circle cx="822.0" cy="657.5" r="2.5" fill="var(--emerald)"/><text x="837" y="662" class="body">Optional Shared KV Pool Reuse</text><text x="40" y="692" class="tiny">GPUStack Operator  ·  Conceptual flow</text></svg>