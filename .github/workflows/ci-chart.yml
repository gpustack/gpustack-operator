# This workflow lints and tests the Helm chart on pull requests that touch
# chart-related files, and publishes it to the gh-pages Helm repository on
# version tags.

name: ci-chart

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_dispatch: { }
  push:
    branches:
      - "main"
      - "v*-dev"
    tags:
      - "v*"
    paths:
      - "deploy/gpustack-operator/chart/**"
      - ".github/workflows/ci-chart.yml"
      - ".github/configs/kind-config.yaml"
  pull_request:
    branches:
      - "main"
      - "v*-dev"
    paths:
      - "deploy/gpustack-operator/chart/**"
      - ".github/workflows/ci-chart.yml"
      - ".github/configs/kind-config.yaml"

jobs:
  lint-test:
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: Setup Toolbox Cache
        uses: actions/cache@v4
        with:
          # Cache the go-installed helm-docs/helm-schema binaries.
          key: chart-toolbox-${{ runner.os }}
          path: |-
            ${{ github.workspace }}/.sbin
#      - name: Setup Kind
#        uses: helm/kind-action@v1
#        with:
#          config: .github/configs/kind-config.yaml
#          version: v0.32.0
      - name: Generate
        run: make generate chart
      - name: Verify Generated
        run: |
          changed="$(git status --porcelain -- \
            deploy/gpustack-operator/chart/README.md \
            deploy/gpustack-operator/chart/values.schema.json \
            deploy/gpustack-operator/chart/values.yaml)"
          if [[ -n "${changed}" ]]; then
            echo "::error::chart docs/schema are out of date; run 'make generate chart' and commit the result"
            git --no-pager diff -- \
              deploy/gpustack-operator/chart/README.md \
              deploy/gpustack-operator/chart/values.schema.json \
              deploy/gpustack-operator/chart/values.yaml
            exit 1
          fi
      - name: Lint
        run: make lint chart
#      # NB(thxCode): the worker installs Node Feature Discovery, Kueue and the CSI
#      # drivers at runtime in this phase, so the test needs network egress and the
#      # released operator image; the device-manager DaemonSets stay at 0 desired
#      # on the GPU-less kind nodes.
#      - name: Test
#        run: make test chart

  pack:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: Set Chart Version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Keep version == appVersion so the operator image tag defaults to "v<appVersion>".
          sed -i -E "s/^version: .*/version: ${version}/" deploy/gpustack-operator/chart/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${version}\"/" deploy/gpustack-operator/chart/Chart.yaml
          echo "DEBUG: published chart version=${version}"
      - name: Publish
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: deploy/gpustack-operator
          target_dir: charts
          branch: github-pages
          linting: off

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - pack
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: github-pages
          lfs: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build
        uses: actions/jekyll-build-pages@v1
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
