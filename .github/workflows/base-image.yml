# This workflow packs for dependent container images of the project.

name: Base Image

permissions:
  actions: read
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository of packed image.'
        required: true
        type: choice
        options:
          - mirrored-mooncake
          - ssh-server
          - thead-ppu-devel
      tag:
        description: 'Tag of packed image.'
        required: true
        type: string
      # Empty means build to the Dockerfile's final stage, which is today's default image. A
      # non-empty value names an earlier stage of the Dockerfile, e.g. one of mirrored-mooncake's
      # vendor variants.
      target:
        description: 'Docker build target within the image Dockerfile. Empty builds to the final stage (the default image).'
        required: false
        type: string
        default: ""
      # Allow passing build arguments at pack time, for an image input that must not be
      # committed. Required by thead-ppu-devel: "PPU_SDK_URL=<presigned url>".
      args:
        description: 'Build arguments (space-separated KEY=VALUE), e.g. PPU_SDK_URL=<presigned url>.'
        required: false
        type: string
        default: ""
      heavy:
        description: 'Build on the larger "-8x" runners: "auto" decides from the changed files, "true" forces them, "false" keeps the standard runners.'
        required: false
        type: choice
        options:
          - "auto"
          - "true"
          - "false"
        default: "auto"

env:
  INPUT_REPOSITORY: ${{ inputs.repository }}
  INPUT_TARGET: ${{ inputs.target }}

jobs:
  expand-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.expand-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two commits: the tip and its parent, which is all "auto" needs to see what the
          # tip changed.
          fetch-depth: 2
          persist-credentials: false
      - name: Validate Inputs
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          #
          # The manifest job publishes by tag: "docker manifest create --amend" plus a push
          # assembles the tag from whatever platforms this dispatch built. A variant
          # dispatched under the default image's tag would therefore rewrite that tag's
          # multi-arch manifest with the variant's platforms alone. Require a non-empty
          # target's slug in the tag: "0.3.13.post1-cuda13.0" passes for the generic cuda
          # target, the bare default tag fails, and a versioned target wants its slugged
          # form ("0.3.13.post1-cuda13.0" for target cuda13.0). The slug pipeline is
          # duplicated from the cache-ref step in _image.yml, fallback included; keep
          # the two in sync.
          #
          if [[ -n "${INPUT_TARGET}" ]]; then
            TARGET_SLUG="$(tr '[:upper:]' '[:lower:]' <<<"${INPUT_TARGET}" | tr -c 'a-z0-9.-' '-' | tr -s '-' | sed 's/^[.-]*//; s/[.-]*$//')"
            [[ -n "${TARGET_SLUG}" ]] || TARGET_SLUG="variant"
            if [[ "${INPUT_TAG}" != *"${TARGET_SLUG}"* ]]; then
              echo "[ERROR] target '${INPUT_TARGET}' requires the tag to contain '${TARGET_SLUG}' (got '${INPUT_TAG}')." >&2
              echo "        A variant pushed under the default image's tag would overwrite that tag's multi-arch manifest." >&2
              exit 1
            fi
          fi
      - name: Detect Heavy Changes
        id: detect-heavy
        env:
          HEAVY_INPUT: ${{ github.event.inputs.heavy || 'auto' }}
        run: |
          #
          # A change to the image's own Dockerfile rebuilds it from its base, which needs a
          # bigger runner. This workflow is only ever dispatched, so there is no event base
          # to diff against: read the tip commit alone, which is the commit whose Dockerfile
          # change is normally the reason for dispatching in the first place.
          #
          # An explicit input overrides that, because the detection can only see this
          # repository: a vendor base image moving under a mutable tag, or a build argument
          # naming a new upstream artifact, makes the build a full one without changing any
          # file here.
          #
          if [[ "${HEAVY_INPUT}" != "auto" ]]; then
            echo "heavy=${HEAVY_INPUT}" >>"$GITHUB_OUTPUT"
            echo "DEBUG: heavy=${HEAVY_INPUT} (forced by input)"
            exit 0
          fi
          HEAVY="false"
          #
          # Some images are heavy whatever changed, and for them the detection below cannot be the
          # answer: it reads the TIP COMMIT ONLY, so an image whose Dockerfile landed a few commits
          # earlier is dispatched onto standard runners for a build that never fits.
          #
          #   - mirrored-mooncake: compiles the store from source for two architectures, and the
          #     parallelism is bounded by memory rather than by cores.
          #
          case "${INPUT_REPOSITORY}" in
            mirrored-mooncake) HEAVY="true" ;;
          esac
          CHANGED="$(git show --name-only --format='' HEAD)"
          if grep -qxF "pack/${INPUT_REPOSITORY}/Dockerfile" <<<"${CHANGED}"; then
            HEAVY="true"
          fi
          echo "heavy=${HEAVY}" >>"$GITHUB_OUTPUT"
          echo "DEBUG: CHANGED=${CHANGED}"
          echo "DEBUG: heavy=${HEAVY}"
      - name: Set Matrix
        id: expand-matrix
        env:
          HEAVY: ${{ steps.detect-heavy.outputs.heavy }}
        run: |
          #
          # Platform coverage is per image, and also per build target: an image whose
          # upstream ships only one architecture must not be built for the others,
          # otherwise that leg fails and the manifest job cannot assemble a complete
          # list.
          #
          #   - thead-ppu-devel: the T-Head PPU SDK ships targets/x86_64-linux only.
          #   - mirrored-mooncake target rocm: the rocm/dev base images publish
          #     linux/amd64 only (there is no arm64 ROCm build; upstream Mooncake's own
          #     ROCm release job builds amd64-only too, and gpustack/runner's ROCm
          #     Dockerfile builds with --platform=linux/amd64).
          #
          # The manifest job derives its platform list from this output, so it follows
          # automatically.
          #
          # A heavy build targets the "-8x" runner variant (4x resources), matching ci.yml.
          #
          SUFFIX=""
          if [[ "${HEAVY}" == "true" ]]; then
            SUFFIX="-8x"
          fi
          AMD64='{"runner":"ubuntu-24.04'"${SUFFIX}"'","platform":"linux/amd64"}'
          ARM64='{"runner":"ubuntu-24.04-arm'"${SUFFIX}"'","platform":"linux/arm64"}'
          case "${INPUT_REPOSITORY}:${INPUT_TARGET}" in
            thead-ppu-devel:*) ENTRIES="${AMD64}" ;;
            mirrored-mooncake:rocm*) ENTRIES="${AMD64}" ;;
            *) ENTRIES="${AMD64},${ARM64}" ;;
          esac
          MATRIX="$(jq -cr . <<<"[${ENTRIES}]")"
          echo "matrix=${MATRIX}" >>"$GITHUB_OUTPUT"
          echo "DEBUG: MATRIX=${MATRIX}"

  image:
    needs:
      - expand-matrix
    uses: ./.github/workflows/_image.yml
    with:
      repository: ${{ inputs.repository }}
      target: ${{ inputs.target }}
      matrix: ${{ needs.expand-matrix.outputs.matrix }}
      # A dispatch exists in order to publish the image, so it always pushes.
      push: true
      tags: |
        type=raw,value=${{ inputs.tag }}
      flavor: |
        latest=false
      suffix-on-latest: true
      build-args-secret: ${{ inputs.args }}
    secrets:
      dockerhub-password: ${{ secrets.CI_DOCKERHUB_PASSWORD }}
