# This workflow enforces the shell contract of the agent tree on pull requests and pushes that
# touch shell under .agents/. OpenCodeReview selects nothing there, and `make lint` reads those
# files for decorative symbols only, so before this gate a change that broke a case file could
# reach main with nothing red. The check runs bash -n and shellcheck over the CHANGED files only
# and reports findings new relative to the merge-base, so the backlog the corpus already carries
# does not block every future edit; a survey counted roughly four hundred existing findings.

name: Agents Shell

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_dispatch: { }
  push:
    branches:
      - "main"
      - "v*-dev"
    paths:
      - ".agents/**/*.sh"
      - "hack/check-agents-shell.sh"
      - "hack/check-agents-shell-selftest.sh"
      - ".github/workflows/agents-shell.yml"
  pull_request:
    branches:
      - "main"
      - "v*-dev"
    paths:
      - ".agents/**/*.sh"
      - "hack/check-agents-shell.sh"
      - "hack/check-agents-shell-selftest.sh"
      - ".github/workflows/agents-shell.yml"

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup shellcheck
        run: |
          # Pinned to a release rather than taken from apt, so the findings set is the same one a
          # contributor reproduces locally; the checker's comparison between base and worktree is
          # only fair when both sides come from the same analyzer.
          ver=v0.10.0
          curl --retry 3 --retry-all-errors --retry-delay 3 -sSfL \
            "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.gz" \
            | tar -xz
          sudo install -m 0755 "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | sed -n '2p'
      - name: Self-test
        run: bash hack/check-agents-shell-selftest.sh
      - name: Check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # The base is where "new relative to" starts: the PR's base commit, or the commit before
          # the push. A branch's first push carries an all-zero before-sha and workflow_dispatch
          # carries none; without a base there is no comparison to make, and the self-test above
          # is what ran. Shallow history that lost the base is the same case, reported the same
          # way rather than silently checking nothing.
          BASE=""
          case "${EVENT_NAME}" in
            pull_request) BASE="${PR_BASE_SHA}" ;;
            push)         BASE="${PUSH_BEFORE_SHA}" ;;
          esac
          NULL_SHA="0000000000000000000000000000000000000000"
          if [[ -z "${BASE}" || "${BASE}" == "${NULL_SHA}" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base to diff against; the self-test above is the whole run."
            exit 0
          fi
          bash hack/check-agents-shell.sh --base "${BASE}"
