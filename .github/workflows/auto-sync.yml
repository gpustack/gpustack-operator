# Unified Loopwright Taskpack 2.0 auto-sync workflow for all six external dependency domains.

name: Auto Sync

permissions:
  contents: read
  pull-requests: read
  issues: read

defaults:
  run:
    shell: bash

concurrency:
  group: auto-sync-run-${{ github.event_name }}-${{ github.event_name == 'schedule' && github.event.schedule || (github.event_name == 'issue_comment' && format('pr-{0}', github.event.issue.number) || format('dispatch-{0}', inputs.domain || 'all')) }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 1 1 */2 *'
    - cron: '0 2 * * 1'
    - cron: '0 2 * * 2'
    - cron: '0 3 * * 2'
    - cron: '0 2 * * 3'
    - cron: '0 2 * * 4'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Auto-sync domain to execute, or all domains.'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'slicing'
          - 'kv-transfer'
          - 'router'
          - 'priors'
          - 'charts'
          - 'k8s-deps'
      runner_profile:
        description: 'Runner size profile (normal -> vars.AUTOSYNC_RUNNER or ubuntu-24.04, 4x -> ubuntu-24.04-4x, 8x -> ubuntu-24.04-8x).'
        required: false
        type: choice
        default: 'normal'
        options:
          - 'normal'
          - '4x'
          - '8x'
      dry-run:
        description: 'Compile and validate without publishing pull requests or memory updates.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force candidate execution even when upstream state appears unchanged.'
        required: false
        type: boolean
        default: false
      target_tag:
        description: 'Optional target image tag override for Stage B promotion.'
        required: false
        type: string
        default: ''
  issue_comment:
    types: [created]

jobs:
  resolve-domains:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      (github.event_name == 'schedule' && github.repository == 'gpustack/gpustack-operator') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        github.event.comment.user.type != 'Bot' &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '/loopwright') || contains(github.event.comment.body, '/auto-sync'))
      )
    outputs:
      domains: ${{ steps.resolve.outputs.domains }}
      runner: ${{ steps.resolve.outputs.runner }}
      has_domains: ${{ steps.resolve.outputs.has_domains }}
      comment_command: ${{ steps.resolve.outputs.comment_command }}
      pr_head_sha: ${{ steps.resolve.outputs.pr_head_sha }}
    steps:
      - name: Resolve target domains
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_REF: ${{ github.ref }}
          INPUT_DOMAIN: ${{ inputs.domain || 'all' }}
          INPUT_DRY_RUN: ${{ (inputs.dry-run == true || inputs.dry-run == 'true') && 'true' || 'false' }}
          INPUT_RUNNER_PROFILE: ${{ inputs.runner_profile || 'normal' }}
          AUTOSYNC_RUNNER: ${{ vars.AUTOSYNC_RUNNER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          ALL_DOMAINS = [
              "slicing",
              "kv-transfer",
              "router",
              "priors",
              "charts",
              "k8s-deps",
          ]
          SCHEDULE_MAP = {
              "0 1 1 */2 *": ["priors"],
              "0 2 * * 1": ["slicing"],
              "0 2 * * 2": ["kv-transfer"],
              "0 3 * * 2": ["router"],
              "0 2 * * 3": ["charts"],
              "0 2 * * 4": ["k8s-deps"],
          }
          normal_runner = os.environ.get("AUTOSYNC_RUNNER", "").strip() or "ubuntu-24.04"
          RUNNER_MAP = {
              "normal": normal_runner,
              "4x": "ubuntu-24.04-4x",
              "8x": "ubuntu-24.04-8x",
          }

          event_name = os.environ.get("EVENT_NAME", "").strip()
          profile = os.environ.get("INPUT_RUNNER_PROFILE", "normal").strip() or "normal"
          if profile not in RUNNER_MAP:
              print(f"ERROR: unsupported runner_profile: {profile!r}", file=sys.stderr)
              sys.exit(1)
          runner = RUNNER_MAP[profile]

          domains = []
          comment_command = ""
          pr_head_sha = ""

          if event_name == "schedule":
              cron = os.environ.get("SCHEDULE_CRON", "").strip()
              if cron not in SCHEDULE_MAP:
                  print(f"ERROR: unexpected schedule cron expression: {cron!r}", file=sys.stderr)
                  sys.exit(1)
              domains = SCHEDULE_MAP[cron]
          elif event_name == "workflow_dispatch":
              dispatch_ref = os.environ.get("DISPATCH_REF", "").strip()
              dry_run = os.environ.get("INPUT_DRY_RUN", "false").strip().lower() == "true"
              if dispatch_ref != "refs/heads/main" and not dry_run:
                  print(
                      f"ERROR: workflow_dispatch requires refs/heads/main unless dry-run is true (got {dispatch_ref!r})",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              selected = os.environ.get("INPUT_DOMAIN", "all").strip() or "all"
              if selected == "all":
                  domains = list(ALL_DOMAINS)
              elif selected in ALL_DOMAINS:
                  domains = [selected]
              else:
                  print(f"ERROR: unsupported dispatch domain: {selected!r}", file=sys.stderr)
                  sys.exit(1)
          elif event_name == "issue_comment":
              lines = os.environ.get("COMMENT_BODY", "").lstrip().splitlines()
              first = lines[0].strip() if lines else ""
              rest = "\n".join(lines[1:]).strip()
              cmd_match = re.match(r"^/(?:loopwright|auto-sync)(?:[ \t]+(retry|revise|status))?(?=$|\s)", first)
              valid_cmd = cmd_match is not None and (
                  cmd_match.group(1) is not None or (first in ("/loopwright", "/auto-sync") and bool(rest))
              )
              if valid_cmd:
                  pr_number = os.environ.get("PR_NUMBER", "").strip()
                  repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
                  if not pr_number.isdigit() or not repo:
                      print("ERROR: missing PR_NUMBER or GITHUB_REPOSITORY for issue_comment", file=sys.stderr)
                      sys.exit(1)
                  out = subprocess.check_output(
                      [
                          "gh",
                          "pr",
                          "view",
                          pr_number,
                          "--repo",
                          repo,
                          "--json",
                          "headRefName,baseRefName,headRefOid",
                      ],
                      text=True,
                  )
                  pr_info = json.loads(out)
                  base_ref = str(pr_info.get("baseRefName") or "")
                  head_ref = str(pr_info.get("headRefName") or "")
                  branch_match = re.fullmatch(
                      r"auto-sync-(slicing|kv-transfer|router|priors|charts|k8s-deps)/main",
                      head_ref,
                  )
                  if base_ref == "main" and branch_match:
                      domains = [branch_match.group(1)]
                      comment_command = cmd_match.group(1) or "revise"
                      pr_head_sha = str(pr_info.get("headRefOid") or "")
          else:
              print(f"ERROR: unsupported event_name: {event_name!r}", file=sys.stderr)
              sys.exit(1)

          has_domains = "true" if domains else "false"
          domains_json = json.dumps(domains, separators=(",", ":"))

          gh_out = os.environ["GITHUB_OUTPUT"]
          with open(gh_out, "a", encoding="utf-8") as f:
              f.write(f"domains={domains_json}\n")
              f.write(f"runner={runner}\n")
              f.write(f"has_domains={has_domains}\n")
              f.write(f"comment_command={comment_command}\n")
              f.write(f"pr_head_sha={pr_head_sha}\n")
          PY

  auto-sync:
    needs:
      - resolve-domains
    if: needs.resolve-domains.outputs.has_domains == 'true'
    runs-on: ${{ needs.resolve-domains.outputs.runner }}
    timeout-minutes: 75
    concurrency:
      group: auto-sync-domain-${{ matrix.domain }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.resolve-domains.outputs.domains) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Record main SHA
        id: record-main
        run: |
          MAIN_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$(git rev-parse --verify 'refs/heads/main^{commit}' 2>/dev/null || true)" != "${MAIN_SHA}" ]]; then
            git branch -f main "${MAIN_SHA}"
          fi
          echo "main_sha=${MAIN_SHA}" >> "${GITHUB_OUTPUT}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain >&2
            exit 1
          fi

      - name: Fetch PR head
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_PR_HEAD_SHA: ${{ needs.resolve-domains.outputs.pr_head_sha }}
          MAIN_SHA: ${{ steps.record-main.outputs.main_sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: invalid PR_NUMBER '${PR_NUMBER}'" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: missing or invalid expected PR head SHA '${EXPECTED_PR_HEAD_SHA}'" >&2
            exit 1
          fi
          if [[ -n "${GH_TOKEN}" ]]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}" \
            git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          else
            git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          fi
          FETCHED_PR_HEAD_SHA="$(git rev-parse --verify "refs/remotes/origin/pr/${PR_NUMBER}^{commit}")"
          if [[ "${FETCHED_PR_HEAD_SHA}" != "${EXPECTED_PR_HEAD_SHA}" ]]; then
            echo "ERROR: PR #${PR_NUMBER} head moved from ${EXPECTED_PR_HEAD_SHA} to ${FETCHED_PR_HEAD_SHA} after comment event" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify 'HEAD^{commit}')" != "${MAIN_SHA}" ]]; then
            echo "ERROR: HEAD moved unexpectedly from ${MAIN_SHA}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain >&2
            exit 1
          fi

      - name: Fetch LFS objects
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git lfs version >/dev/null 2>&1; then
            lfs_refs=(HEAD)
            if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" && -n "${PR_NUMBER}" ]] && \
               pr_head_sha="$(git rev-parse --verify -q "refs/remotes/origin/pr/${PR_NUMBER}^{commit}" 2>/dev/null)"; then
              lfs_refs+=("${pr_head_sha}")
            fi
            git lfs fetch origin "${lfs_refs[@]}"
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        if: matrix.domain == 'k8s-deps'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Setup awk
        if: matrix.domain == 'priors' || matrix.domain == 'kv-transfer' || matrix.domain == 'router'
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=15 install -y --no-install-recommends original-awk
          sudo update-alternatives --set awk /usr/bin/original-awk
          awk --version 2>&1 | head -1

      - name: Setup crane
        if: matrix.domain == 'kv-transfer' || matrix.domain == 'router' || matrix.domain == 'charts'
        run: |
          if command -v crane >/dev/null 2>&1; then
            crane version
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/crane" version

      - name: Setup Buildx
        if: matrix.domain == 'slicing' || matrix.domain == 'kv-transfer' || matrix.domain == 'router'
        uses: docker/setup-buildx-action@v3

      - name: Setup bubblewrap
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=15 update
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=15 install -y --no-install-recommends bubblewrap
          fi
          bwrap --version
          if ! bwrap --unshare-all --ro-bind / / "$(command -v true)" >/dev/null 2>&1; then
            if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" || "${ALLOW_USERNS_SYSCTL:-false}" == "true" ]]; then
              if ! sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
                echo "WARN: failed to disable kernel.apparmor_restrict_unprivileged_userns" >&2
              fi
            else
              echo "ERROR: bubblewrap unprivileged user namespaces are restricted on this runner (RUNNER_ENVIRONMENT='${RUNNER_ENVIRONMENT:-}'); configure an AppArmor profile for /usr/bin/bwrap on the host or set repository variable AUTOSYNC_ALLOW_USERNS_SYSCTL=true for ephemeral runners" >&2
              exit 1
            fi
            bwrap --unshare-all --ro-bind / / "$(command -v true)"
          fi
        env:
          ALLOW_USERNS_SYSCTL: ${{ vars.AUTOSYNC_ALLOW_USERNS_SYSCTL }}

      - name: Cache preflight tools
        uses: actions/cache@v4
        with:
          path: /tmp/gpustack-autosync-stage/.sbin
          key: autosync-sbin-${{ runner.os }}-${{ runner.arch }}-${{ matrix.domain }}-${{ hashFiles('hack/lib/*.sh') }}

      - name: Cache uv runtime
        if: matrix.domain == 'k8s-deps'
        uses: actions/cache@v4
        with:
          path: |
            /tmp/gpustack-autosync-stage/uv-cache
            /tmp/gpustack-autosync-stage/uv-python
          key: autosync-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('model-transfer/python/uv.lock', 'model-transfer/python/.python-version') }}

      - name: Run Loopwright
        id: loopwright
        # Env-visibility contract (verified at pinned SHA in packages/github-app/src/{preflight,action,turnkey}.ts):
        # - spec.preflight and command.v1 gates construct scrubbed child environments forwarding ONLY
        #   non-secret names listed in spec.preflight.env / command.v1 parameters.env (enforced in-repo
        #   by hack/check/autosync-selftest.sh) and unconditionally strip INPUT_*, GITHUB_TOKEN,
        #   GitHub App credentials, Loopwright signing keys, and LOOPWRIGHT_PROVIDER_TOKEN.
        # - Candidate model turns and command.v1 checks run inside bubblewrap under spec.execution.mode: strict.
        uses: gpustack/loopwright@6d281028848473fc52b96a5a3b1cea49fc1a731f # main
        env:
          LOOPWRIGHT_PROVIDER_TOKEN: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_LLM_AUTH_TOKEN || secrets.CI_GPUSTACK_CODEREVIEW_LLM_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ steps.record-main.outputs.main_sha }}
          GITHUB_REF: refs/heads/main
          AUTOSYNC_STAGE_DIR: /tmp/gpustack-autosync-stage/${{ matrix.domain }}
          AUTOSYNC_FORCE: ${{ (inputs.force == true || inputs.force == 'true') && 'true' || 'false' }}
          AUTOSYNC_TARGET_TAG: ${{ inputs.target_tag || '' }}
          COMMENT_COMMAND: ${{ needs.resolve-domains.outputs.comment_command }}
        with:
          taskpack-path: .auto-sync/${{ matrix.domain }}-taskpack.yaml
          mode: auto
          # Dual-key operator unlock required for strict-mode taskpacks declaring spec.preflight,
          # read-only command.v1 toolchainPaths (allowHostPath), or check-only allowCheckNetwork.
          # Candidate model turns and command.v1 checks still run inside bubblewrap without tokens.
          allow-privileged-execution: 'true'
          event-name: ${{ github.event_name }}
          event-path: ${{ github.event_path }}
          run-root: ${{ runner.temp }}/loopwright-${{ matrix.domain }}
          run-id: auto-sync-${{ matrix.domain }}-${{ github.run_id }}-${{ github.run_attempt }}
          storage-profile: actions-basic
          allow-custom-base-url: 'true'
          provider-token-env: LOOPWRIGHT_PROVIDER_TOKEN
          github-app-id: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_APP_ID || vars.CI_GPUSTACK_LOOPWRIGHT_APP_ID || secrets.LOOPWRIGHT_APP_ID }}
          github-app-private-key: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_APP_PRIVATE_KEY || secrets.LOOPWRIGHT_APP_PRIVATE_KEY }}
          dry-run: ${{ (inputs.dry-run == true || inputs.dry-run == 'true') && 'true' || 'false' }}
          force: ${{ (inputs.force == true || inputs.force == 'true') && 'true' || 'false' }}
          output: json,github-step-summary

      - name: Sanitize diagnostics
        if: always()
        env:
          DIAG_ROOT: ${{ runner.temp }}/loopwright-${{ matrix.domain }}
          CHECK_PROVIDER_TOKEN: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_LLM_AUTH_TOKEN || secrets.CI_GPUSTACK_CODEREVIEW_LLM_AUTH_TOKEN }}
          CHECK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -d "${DIAG_ROOT}" ]]; then
            find "${DIAG_ROOT}" \( -name 'secrets.json' -o -name '*.sqlite*' \) -type f -delete
            python3 - "${DIAG_ROOT}" <<'PY'
          import glob
          import os
          import re
          import sys

          diag_root = sys.argv[1]
          patterns = [
              os.path.join(diag_root, "*", "run.json"),
              os.path.join(diag_root, "*", "memory-publication.json"),
              os.path.join(diag_root, "*", "artifacts", "**", "*.json"),
              os.path.join(diag_root, "lw-action-*", "config", "config.yaml"),
              os.path.join(diag_root, "lw-action-*", "registry", "registry.yaml"),
          ]
          secrets_to_block = [
              val for key in ("CHECK_PROVIDER_TOKEN", "CHECK_GH_TOKEN")
              if len(val := os.environ.get(key, "").strip()) >= 8
          ]
          pem_re = re.compile(r"BEGIN [A-Z0-9 ]*PRIVATE KEY")
          leaked = []
          for pat in patterns:
              for path in glob.glob(pat, recursive=True):
                  if not os.path.isfile(path):
                      continue
                  txt = open(path, "r", encoding="utf-8", errors="replace").read()
                  if pem_re.search(txt) or any(tok in txt for tok in secrets_to_block):
                      os.unlink(path)
                      leaked.append(os.path.relpath(path, diag_root))
          if leaked:
              print(f"ERROR: removed diagnostic file(s) containing credential material: {', '.join(leaked)}", file=sys.stderr)
              sys.exit(1)
          PY
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-sync-diagnostics-${{ matrix.domain }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Loopwright runs assertCleanArtifact(scrubber) before writing config.yaml and registry.yaml
          # (which store credential env-var names, never secret values); Sanitize diagnostics also
          # deletes secrets.json and *.sqlite* before upload.
          path: |
            ${{ runner.temp }}/loopwright-${{ matrix.domain }}/*/run.json
            ${{ runner.temp }}/loopwright-${{ matrix.domain }}/*/memory-publication.json
            ${{ runner.temp }}/loopwright-${{ matrix.domain }}/*/artifacts/**/*.json
            ${{ runner.temp }}/loopwright-${{ matrix.domain }}/lw-action-*/config/config.yaml
            ${{ runner.temp }}/loopwright-${{ matrix.domain }}/lw-action-*/registry/registry.yaml
            !${{ runner.temp }}/loopwright-${{ matrix.domain }}/**/secrets.json
            !${{ runner.temp }}/loopwright-${{ matrix.domain }}/**/*.sqlite*
          retention-days: 30
          if-no-files-found: ignore
