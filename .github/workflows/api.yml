# Regenerates the API artifacts and fails when the committed tree does not match, the way
# chart.yml already does for the Helm chart. Nothing watched the API side before.

name: API

permissions:
  contents: read

defaults:
  run:
    shell: bash
    # See the Checkout step for why the working directory is nested.
    working-directory: gpustack.ai/gpustack

# Pure verification, so a superseded run is cancelled rather than left to finish.
#
# Two properties of the key:
#   - keyed by pull request number, not branch name: two pull requests from forks whose
#     branch is called `main` would otherwise share a group and cancel each other;
#   - event name is part of the group deliberately. An internal pull request fires both
#     events and the runs are not redundant -- push verifies the branch tip, pull_request
#     verifies the merge result -- so folding them would drop a verdict.
concurrency:
  group: api-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: { }
  push:
    branches:
      - "main"
      - "v*-dev"
    # NB(thxCode): these are the generator's inputs, a wider set than the API types:
    #   - gen/api reads the webhook markers under pkg/*/webhooks;
    #   - gen/api/builder compiles in pkg/utils/{osx,stringx};
    #   - the external types it emits clients for come from go.mod/go.sum;
    #   - the code-generator itself is vendored under staging/;
    #   - `make generate` is dispatched through the Makefile's dynamic target rule.
    # pkg/kubeclients is an output, listed so hand-editing one is caught too.
    paths:
      - "api/**"
      - "gen/**"
      - "pkg/*/webhooks/**"
      - "pkg/utils/osx/**"
      - "pkg/utils/stringx/**"
      - "pkg/kubeclients/**"
      - "staging/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "hack/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches:
      - "main"
      - "v*-dev"
    paths:
      - "api/**"
      - "gen/**"
      - "pkg/*/webhooks/**"
      - "pkg/utils/osx/**"
      - "pkg/utils/stringx/**"
      - "pkg/kubeclients/**"
      - "staging/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "hack/**"
      - ".github/workflows/api.yml"

jobs:
  verify-generated:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # REQUIRED: the checkout is nested so the working directory ends in the module
          # import path. gen/api derives its output base by trimming that path off the
          # cwd, and on a default checkout path the trim is a no-op -- the generators
          # then write one module path too shallow, after already rewriting files.
          path: gpustack.ai/gpustack
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gpustack.ai/gpustack/go.mod
      - name: Setup Toolbox Cache
        uses: actions/cache@v4
        with:
          # Caches the go-installed generator binaries.
          #
          # LIMITED: no restore-keys fallback, on purpose. hack/lib/*.sh accepts a cached
          # tool by whether the executable exists, never by its version, so a prefix
          # fallback would restore the binary a pin bump just replaced and this job would
          # verify drift with the old generator.
          key: api-toolbox-${{ runner.os }}-${{ hashFiles('gpustack.ai/gpustack/hack/lib/**', 'gpustack.ai/gpustack/go.mod') }}
          path: |-
            ${{ github.workspace }}/gpustack.ai/gpustack/.sbin
      - name: Generate
        run: make generate
      - name: Verify Generated
        run: |
          changed="$(git status --porcelain)"
          if [[ -n "${changed}" ]]; then
            echo "::error::generated artifacts are out of date; run 'make generate' and commit the result"
            echo "${changed}"
            git --no-pager diff
            exit 1
          fi
