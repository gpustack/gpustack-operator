# This workflow regenerates the API artifacts and fails when the committed tree does
# not match what the generators produce, mirroring what chart.yml already does for the
# Helm chart. That asymmetry is why the chart has never drifted and the API had nothing
# watching it.

name: API

permissions:
  contents: read

defaults:
  run:
    shell: bash
    # Every run step works inside the nested checkout; see the Checkout step for why it
    # is nested.
    working-directory: gpustack.ai/gpustack

# Pure verification with no side effects, so a superseded run is cancelled rather than
# left to finish. The key is the pull request number and not its branch name, because two
# pull requests opened from forks whose branch is called `main` would otherwise share a
# group and cancel each other.
#
# Event name is part of the group on purpose: an internal pull request fires both events,
# and the two runs are NOT redundant -- the push run verifies the branch tip while the
# pull_request run verifies the merge result. Folding them together would drop one of
# those verdicts rather than deduplicate a repeat.
concurrency:
  group: api-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: { }
  push:
    branches:
      - "main"
      - "v*-dev"
    # NB(thxCode): these are the generator's INPUTS, which is a wider set than the API
    # types alone: gen/api reads the webhook markers under pkg/*/webhooks, the external
    # types it emits clients for come from the module graph (go.mod/go.sum), and the
    # code-generator itself is vendored under staging/. pkg/kubeclients is an output
    # rather than an input, and is listed so that hand-editing one is caught too.
    paths:
      - "api/**"
      - "gen/**"
      - "pkg/*/webhooks/**"
      - "pkg/utils/osx/**"
      - "pkg/utils/stringx/**"
      - "pkg/kubeclients/**"
      - "staging/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "hack/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches:
      - "main"
      - "v*-dev"
    paths:
      - "api/**"
      - "gen/**"
      - "pkg/*/webhooks/**"
      - "pkg/utils/osx/**"
      - "pkg/utils/stringx/**"
      - "pkg/kubeclients/**"
      - "staging/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "hack/**"
      - ".github/workflows/api.yml"

jobs:
  verify-generated:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # NB(thxCode): the checkout is nested so that the working directory ends in the
          # module import path. gen/api/main.go sets ProjectDir to os.Getwd() and
          # gen/api/builder/generate.go derives the generator's output base as
          # strings.TrimSuffix(ProjectDir, "gpustack.ai/gpustack"). On a default checkout
          # path that suffix never matches, the trim is a no-op, and the generators write
          # against a base that is one module path too shallow. A run there does not fail
          # cleanly either -- go-to-protobuf rewrites the generated files before it dies on
          # the path arithmetic -- so the nesting is what makes this job possible at all.
          path: gpustack.ai/gpustack
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gpustack.ai/gpustack/go.mod
      - name: Setup Toolbox Cache
        uses: actions/cache@v4
        with:
          # Cache the go-installed generator binaries. The key carries a hash of the files
          # that pin them, because hack/lib/*.sh validates a cached tool by whether the
          # executable exists and never by its version: without the hash, bumping a pin
          # leaves the old binary in place and this job would verify drift using the
          # generator the pin just replaced.
          key: api-toolbox-${{ runner.os }}-${{ hashFiles('gpustack.ai/gpustack/hack/lib/**', 'gpustack.ai/gpustack/go.mod') }}
          path: |-
            ${{ github.workspace }}/gpustack.ai/gpustack/.sbin
      - name: Generate
        run: make generate
      - name: Verify Generated
        run: |
          changed="$(git status --porcelain)"
          if [[ -n "${changed}" ]]; then
            echo "::error::generated artifacts are out of date; run 'make generate' and commit the result"
            echo "${changed}"
            git --no-pager diff
            exit 1
          fi
