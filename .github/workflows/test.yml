# Runs the Go unit tests. Nothing ran them before: ci.yml builds the image, and api.yml and
# chart.yml verify generated artifacts and the chart install.

name: Test

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Pure verification, so a superseded run is cancelled rather than left to finish. The key
# follows api.yml's: pull request number rather than branch name, and the event name kept in,
# because push verifies the branch tip and pull_request verifies the merge result.
concurrency:
  group: test-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: { }
  push:
    branches:
      - "main"
      - "v*-dev"
    # NB: ci.yml's list without "deploy/**": pkg/worker/kuberess asserts the chart
    # under deploy/gpustack-operator/chart against the Go code, so a chart-only change has to
    # run it. Added to it are two trees no test reads: testing/, the Terraform and scripts for
    # test clusters, and csrc/, the C sources only the image build compiles.
    #
    # Skipped as well is .agents/, the agent skills and hooks, listed entry by entry to leave
    # out skills/gpustack-operator-xbuild-and-verify/: pkg/devicemanager/preflight reads its
    # verification cases, through the tracked .claude/skills symlink. paths-ignore has no
    # negation to carve one skill out of ".agents/**", so an entry added under .agents/ or
    # .agents/skills/ runs this workflow until it is listed here.
    #
    # It lists what to skip rather than what to run on purpose. The tests read more than Go
    # sources -- the chart, the operator Dockerfile, testdata, embedded files, cgo headers --
    # and a path an allow-list forgets skips the run without a trace on the pull request.
    #
    # LIMITED: a markdown-only change still skips this workflow, although two tests read
    # documentation (pkg/nodefeature and pkg/worker/controllers/worker, each against a page
    # under docs/reference/). Such a change is caught by the next run that does trigger.
    paths-ignore:
      - "docs/**"
      - "testing/**"
      - "csrc/**"
      - ".agents/hooks.json"
      - ".agents/hooks/**"
      - ".agents/skills/_e2e-lib/**"
      - ".agents/skills/gpustack-operator-chart-e2e/**"
      - ".agents/skills/gpustack-operator-chart-subcharts-manage/**"
      - ".agents/skills/gpustack-operator-code-review/**"
      - ".agents/skills/gpustack-operator-docs/**"
      - ".agents/skills/gpustack-operator-e2e/**"
      - ".agents/skills/gpustack-operator-generate/**"
      - ".agents/skills/gpustack-operator-issue-pr/**"
      - ".agents/skills/gpustack-operator-overview/**"
      - ".agents/skills/gpustack-operator-release/**"
      - "**.md"
      - "**.mdx"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.gif"
      - "**.webp"
  pull_request:
    branches:
      - "main"
      - "v*-dev"
    paths-ignore:
      - "docs/**"
      - "testing/**"
      - "csrc/**"
      - ".agents/hooks.json"
      - ".agents/hooks/**"
      - ".agents/skills/_e2e-lib/**"
      - ".agents/skills/gpustack-operator-chart-e2e/**"
      - ".agents/skills/gpustack-operator-chart-subcharts-manage/**"
      - ".agents/skills/gpustack-operator-code-review/**"
      - ".agents/skills/gpustack-operator-docs/**"
      - ".agents/skills/gpustack-operator-e2e/**"
      - ".agents/skills/gpustack-operator-generate/**"
      - ".agents/skills/gpustack-operator-issue-pr/**"
      - ".agents/skills/gpustack-operator-overview/**"
      - ".agents/skills/gpustack-operator-release/**"
      - "**.md"
      - "**.mdx"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.gif"
      - "**.webp"

jobs:
  unit:
    # Above "make test"'s own -timeout=30m, so a hung test fails with its goroutine dump
    # instead of a job cancellation that prints nothing.
    timeout-minutes: 45
    # The image ships for both architectures, so the tests run on both. fail-fast is off so a
    # failure on one does not cancel the other and hide whether it is architecture-specific.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          # The race detector is not on in CI yet.
          RACE: "false"
        run: make test
