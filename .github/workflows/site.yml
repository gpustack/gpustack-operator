name: Site

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "main or an existing version tag containing the site sources"
        default: main
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.repository == 'gpustack/gpustack-operator'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Hold the publication queue through chart publication, site composition and deployment.
    # A run uploads the complete branch and deploys it once.
    concurrency:
      group: github-pages
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_ROOT_URL: https://docs.gpustack.ai/gpustack-operator/
      REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - name: Validate documentation ref
        id: ref
        run: |
          kind=$(python3 -c 'import sys; sys.path.insert(0, "tools/hack/site"); from publish import version_kind; print(version_kind(sys.argv[1]))' "${REQUESTED_REF}")
          if [[ "${REQUESTED_REF}" == main ]]; then
            ref=refs/heads/main
          else
            ref="refs/tags/${REQUESTED_REF}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "kind=${kind}" >> "${GITHUB_OUTPUT}"
      - name: Checkout documentation sources
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: source
          lfs: true
          persist-credentials: false
      - name: Verify sources and record revision
        id: source
        working-directory: source
        run: |
          [[ -f site/hugo.toml && -f site/layouts/home.version.json ]] || {
            echo "::error::This revision predates the documentation site; publish from a tag containing the site sources."
            exit 1
          }
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Setup Go for Hugo
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
      - name: Build and check versioned documentation
        working-directory: source
        env:
          SITE_BASE_URL: ${{ env.SITE_ROOT_URL }}${{ env.REQUESTED_REF }}/
          HUGO_PARAMS_SITEROOT: ${{ env.SITE_ROOT_URL }}
          HUGO_PARAMS_VERSION: ${{ env.REQUESTED_REF }}
          HUGO_PARAMS_SOURCEREF: ${{ steps.source.outputs.commit }}
          HUGO_PARAMS_RELEASEKIND: ${{ steps.ref.outputs.kind }}
        run: make site
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: github-pages
          path: pages
      - name: Compose versioned documentation
        run: |
          python3 tools/hack/site/publish.py --build source/site/public --pages pages \
            --ref "${REQUESTED_REF}" --commit "${SOURCE_COMMIT}" --root-url "${SITE_ROOT_URL}"
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
      - name: Setup Helm for release charts
        if: steps.ref.outputs.kind != 'development'
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: Prepare release chart
        if: steps.ref.outputs.kind != 'development'
        run: |
          version="${REQUESTED_REF#v}"
          package="gpustack-operator-${version}.tgz"
          # Composition has already checked the published tag's source revision.
          # Keep the original package bytes when retrying a published version.
          if [[ ! -f "pages/charts/${package}" ]]; then
            package_dir=$(mktemp -d)
            trap 'rm -rf "${package_dir}"' EXIT
            helm package source/deploy/gpustack-operator/chart \
              --version "${version}" --app-version "${version}" --destination "${package_dir}"
            helm repo index "${package_dir}" --url "${SITE_ROOT_URL}charts" \
              --merge pages/charts/index.yaml
            cp "${package_dir}/${package}" pages/charts/
            cp "${package_dir}/index.yaml" pages/charts/index.yaml
          else
            index_dir=$(mktemp -d)
            trap 'rm -rf "${index_dir}"' EXIT
            helm repo index "${index_dir}" --merge pages/charts/index.yaml --json
            python3 - "${index_dir}/index.yaml" "${version}" "${package}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          index_path, version, package = sys.argv[1:]
          index = json.loads(Path(index_path).read_text())
          digest = hashlib.sha256(Path("pages/charts", package).read_bytes()).hexdigest()
          entries = index.get("entries", {}).get("gpustack-operator", [])
          if not any(
              entry.get("version") == version
              and entry.get("digest") == digest
              and any(Path(urlsplit(url).path).name == package for url in entry.get("urls", []))
              for entry in entries
          ):
              raise SystemExit(
                  "::error::Published chart is missing a matching index entry. "
                  "Restore its version, package URL and digest using the original package, then retry."
              )
          PY
          fi
      - name: Commit chart and documentation
        id: content
        working-directory: pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "build: publish ${REQUESTED_REF} chart and documentation"
            git push origin HEAD:github-pages
          fi
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload complete Pages tree
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_COMMIT: ${{ steps.content.outputs.commit }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            await require('./tools/hack/site/deploy.cjs')({github, context, core});
      - name: Verify public publication
        run: |
          python3 tools/hack/site/verify.py --pages pages --ref "${REQUESTED_REF}" --root-url "${SITE_ROOT_URL}"
