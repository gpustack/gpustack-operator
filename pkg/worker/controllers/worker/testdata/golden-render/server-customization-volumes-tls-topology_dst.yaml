apiVersion: v1
kind: Pod
metadata:
  annotations:
    kueue.x-k8s.io/pod-group-serving: "true"
    kueue.x-k8s.io/pod-group-total-count: "1"
    kueue.x-k8s.io/podset-required-topology: topology.kubernetes.io/zone
    kueue.x-k8s.io/role-hash: main
    modeldeployment.gpustack.ai/pod-spec-hash: a77970a81ba0b51c44271cd641b616b189dd67a145aeeee6a51bd160cf71bd5f
    modeldeployment.gpustack.ai/render-version: "4"
    note.gpustack.ai/role: main
    prometheus.io/path: /metrics
    prometheus.io/port: "9000"
    prometheus.io/scheme: https
    prometheus.io/scrape: "true"
  generateName: qwen-main-
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: qwen
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-782503a2fb4f6cc3
    kueue.x-k8s.io/queue-name: queue-for-h20-8x
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: server
    resource.gpustack.ai/type: modeldeployments
  name: qwen-main-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen
    uid: md-uid
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - vllm
    - serve
    - Qwen/Qwen2.5-72B-Instruct
    - --ssl-certfile
    - /etc/tls/tls.crt
    - --ssl-keyfile
    - /etc/tls/tls.key
    - --host
    - 0.0.0.0
    - --port
    - "9000"
    env:
    - name: VLLM_CACHE_ROOT
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    image: vllm/vllm-openai:v0.19.0
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -c
          - |
            import socket, ssl, sys, time, urllib.request
            start = time.monotonic()
            time.sleep(5)
            names = ["vllm:num_requests_running", "vllm:num_requests_waiting"]
            context = ssl.create_default_context()
            context.check_hostname = False
            context.verify_mode = ssl.CERT_NONE
            idle = 0
            while time.monotonic() - start < 55:
                try:
                    body = urllib.request.urlopen("https://127.0.0.1:9000/metrics", timeout=1, context=context).read().decode()
                except Exception as err:
                    if not isinstance(getattr(err, "reason", err), (TimeoutError, socket.timeout)):
                        sys.exit(0)
                    body = None
                busy = 1.0 if body is None else 0.0
                for line in (body or "").splitlines():
                    name = line.split("{", 1)[0].split(" ", 1)[0]
                    if name not in names:
                        continue
                    sample = line.rsplit("}", 1)[1] if "{" in line else line[len(name):]
                    try:
                        busy += float(sample.split()[0])
                    except (IndexError, ValueError):
                        busy += 1.0
                idle = idle + 1 if busy == 0 else 0
                if idle == 2:
                    sys.exit(0)
                time.sleep(1)
            sys.exit(0)
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 9000
        scheme: HTTPS
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 9000
      name: tcp-9000
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 9000
        scheme: HTTPS
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        cpu: "16"
        ephemeral-storage: 15Gi
        memory: 64Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: 1600m
        ephemeral-storage: 1920Mi
        memory: 8Gi
        nvidia.com/gpu: "1"
    securityContext:
      privileged: true
    startupProbe:
      failureThreshold: 360
      httpGet:
        path: /health
        port: 9000
        scheme: HTTPS
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /etc/config
      name: additional-0
      readOnly: true
    - mountPath: /etc/tls
      name: additional-1
      readOnly: true
    - mountPath: /mnt/cache
      name: additional-2
    - mountPath: /var/log/host
      name: additional-3
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 60
  volumes:
  - configMap:
      name: app-config
    name: additional-0
  - name: additional-1
    secret:
      secretName: tls-secret
  - name: additional-2
    persistentVolumeClaim:
      claimName: model-cache
  - hostPath:
      path: /var/log/gpustack
    name: additional-3
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-vllm/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-f7c2ae1c
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 32Gi
    name: model-shm
status: {}
---
