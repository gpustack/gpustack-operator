        path: /gpustack/v1/ready
        port: 9000
        scheme: HTTPS
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    securityContext:
      privileged: true
    startupProbe:
      failureThreshold: 360
      httpGet:
        path: /gpustack/v1/live
        port: 9000
        scheme: HTTPS
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /etc/config
      name: additional-0
      readOnly: true
    - mountPath: /etc/tls
      name: additional-1
      readOnly: true
    - mountPath: /mnt/cache
      name: additional-2
    - mountPath: /var/log/host
      name: additional-3
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
    - mountPath: /var/lib/gpustack/operator/lib/engine-sentinel
      name: gpustack-engine-sentinel
      readOnly: true
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 60
  volumes:
  - configMap:
      name: app-config
    name: additional-0
  - name: additional-1
    secret:
      secretName: tls-secret
  - name: additional-2
    persistentVolumeClaim:
      claimName: model-cache
  - hostPath:
