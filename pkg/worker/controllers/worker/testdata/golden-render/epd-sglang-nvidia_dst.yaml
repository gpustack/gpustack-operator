    modeldeployment.gpustack.ai/render-version: "5"
    note.gpustack.ai/role: decode
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  generateName: qwen-vl-decode-
  labels:
    app.kubernetes.io/component: decode
    app.kubernetes.io/instance: qwen-vl
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-0846752c61cf418b
    kueue.x-k8s.io/queue-name: queue-for-h20-8x
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: decode
    resource.gpustack.ai/type: modeldeployments
  name: qwen-vl-decode-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen-vl
    uid: md-uid
spec:
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: qwen-vl
              app.kubernetes.io/name: model-deployment
              modeldeployment.gpustack.ai/role-kind: prefill
          topologyKey: kubernetes.io/hostname
        weight: 100
  automountServiceAccountToken: false
  containers:
  - command:
    - python3
    - -m
    - sglang.launch_server
    - --model-path
    - Qwen/Qwen2.5-VL-7B-Instruct
    - --enable-metrics
    - --disaggregation-mode
    - decode
    - --disaggregation-transfer-backend
    - mooncake_tcp
    - --disaggregation-decode-retraction-backup
    - cpu_tensor
    - --page-size
    - "64"
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    env:
    - name: MC_TE_METRIC
      value: "1"
    - name: MC_TCP_MAX_QUEUED_TRANSFERS_PER_PEER
      value: "65535"
    - name: MC_TCP_MAX_PENDING_ADMISSIONS_PER_PEER
      value: "65535"
    - name: MC_TCP_LANES_PER_PEER
      value: "16"
    - name: MC_TCP_ADMISSION_TIMEOUT_MS
      value: "60000"
    - name: SGLANG_CACHE_DIR
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    image: lmsysorg/sglang:v0.5.18
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -c
          - |
            import socket, ssl, sys, time, urllib.request
            start = time.monotonic()
            time.sleep(5)
            names = ["sglang:num_running_reqs", "sglang:num_queue_reqs", "sglang:num_prefill_bootstrap_queue_reqs", "sglang:num_prefill_inflight_queue_reqs", "sglang:num_decode_prealloc_queue_reqs", "sglang:num_decode_transfer_queue_reqs"]
            context = ssl.create_default_context()
            context.check_hostname = False
            context.verify_mode = ssl.CERT_NONE
            idle = 0
            while time.monotonic() - start < 25:
                try:
                    body = urllib.request.urlopen("http://127.0.0.1:8000/metrics", timeout=1, context=context).read().decode()
                except Exception as err:
                    if not isinstance(getattr(err, "reason", err), (TimeoutError, socket.timeout)):
                        sys.exit(0)
                    body = None
                busy = 1.0 if body is None else 0.0
                for line in (body or "").splitlines():
                    name = line.split("{", 1)[0].split(" ", 1)[0]
                    if name not in names:
                        continue
                    sample = line.rsplit("}", 1)[1] if "{" in line else line[len(name):]
                    try:
                        busy += float(sample.split()[0])
                    except (IndexError, ValueError):
                        busy += 1.0
                idle = idle + 1 if busy == 0 else 0
                if idle == 2:
                    sys.exit(0)
                time.sleep(1)
            sys.exit(0)
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        cpu: "16"
        ephemeral-storage: 15Gi
        memory: 64Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: 1600m
        ephemeral-storage: 1920Mi
        memory: 8Gi
        nvidia.com/gpu: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 30
  volumes:
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-sglang/m-e71d72a4282a498ba3e22c62909d319f/tp1-pp1-dp1-ep1-cp1_1-4c8a056f
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
status: {}
