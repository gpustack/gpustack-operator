    prometheus.io/path: /metrics
    prometheus.io/port: "8200"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  generateName: qwen-vl-decode-
  labels:
    app.kubernetes.io/component: decode
    app.kubernetes.io/instance: qwen-vl
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-0846752c61cf418b
    kueue.x-k8s.io/queue-name: queue-for-atlas-910b
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: decode
    resource.gpustack.ai/type: modeldeployments
