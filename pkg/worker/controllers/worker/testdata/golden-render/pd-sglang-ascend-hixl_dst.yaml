apiVersion: v1
kind: Pod
metadata:
  annotations:
    kueue.x-k8s.io/pod-group-serving: "true"
    kueue.x-k8s.io/pod-group-total-count: "1"
    kueue.x-k8s.io/role-hash: decode
    modeldeployment.gpustack.ai/pod-spec-hash: 8508e94f7cf36f529a14ea5585b81b09adb0792f80e0b885492251cfa9e37ddf
    modeldeployment.gpustack.ai/render-version: "7"
    note.gpustack.ai/role: decode
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  generateName: qwen-decode-
  labels:
    app.kubernetes.io/component: decode
    app.kubernetes.io/instance: qwen
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-f58dda21fce38dfc
    kueue.x-k8s.io/queue-name: queue-for-atlas-910b
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: decode
    resource.gpustack.ai/type: modeldeployments
  name: qwen-decode-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen
    uid: md-uid
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - python3
    - -m
    - sglang.launch_server
    - --model-path
    - Qwen/Qwen2.5-72B-Instruct
    - --enable-metrics
    - --disaggregation-mode
    - decode
    - --disaggregation-transfer-backend
    - ascend
    - --disaggregation-decode-retraction-backup
    - cpu_tensor
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    env:
    - name: MC_TE_METRIC
      value: "1"
    - name: ASCEND_MF_TRANSFER_PROTOCOL
      value: sdma
    - name: SGLANG_CACHE_DIR
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    - name: PYTHONPATH
      value: /var/lib/gpustack/operator/lib/engine-sentinel
    image: lmsysorg/sglang:v0.5.18
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -m
          - gpustack_engine_sentinel.drain
          - --engine
          - SGLang
          - --port
          - "8000"
          - --scheme
          - http
          - --settle
          - "5"
          - --deadline
          - "25"
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        huawei.com/npu: "1"
      requests:
        huawei.com/npu: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /usr/local/Ascend/driver
      name: gpustack-ascend-driver
      readOnly: true
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
    - mountPath: /var/lib/gpustack/operator/lib/engine-sentinel
      name: gpustack-engine-sentinel
      readOnly: true
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: ascend
  terminationGracePeriodSeconds: 30
  volumes:
  - hostPath:
      path: /usr/local/Ascend/driver
      type: Directory
    name: gpustack-ascend-driver
  - hostPath:
      path: /var/lib/gpustack/cache/ascend-sglang/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-4c8a056f
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
  - hostPath:
      path: /var/lib/gpustack/operator/lib/engine-sentinel
      type: DirectoryOrCreate
    name: gpustack-engine-sentinel
status: {}
---
