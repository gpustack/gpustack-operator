apiVersion: v1
kind: Pod
metadata:
  annotations:
    kueue.x-k8s.io/pod-group-serving: "true"
    kueue.x-k8s.io/pod-group-total-count: "1"
    kueue.x-k8s.io/role-hash: mig
    modeldeployment.gpustack.ai/pod-spec-hash: 9d91f505cbffc87a86c43ab92feeabd8f16e4fdf0e992d55f3b4c75648a2a3db
    modeldeployment.gpustack.ai/render-version: "6"
    note.gpustack.ai/role: mig
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  generateName: qwen-mig-
  labels:
    app.kubernetes.io/component: mig
    app.kubernetes.io/instance: qwen
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-9b0808cb32aab457
    kueue.x-k8s.io/queue-name: queue-for-a100-mig
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: server
    resource.gpustack.ai/type: modeldeployments
  name: qwen-mig-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen
    uid: md-uid
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - vllm
    - serve
    - Qwen/Qwen2.5-72B-Instruct
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    env:
    - name: VLLM_CACHE_ROOT
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    - name: PYTHONPATH
      value: /var/lib/gpustack/operator/lib/engine-sentinel
    - name: GPUSTACK_ENGINE_SENTINEL_ENABLE
      value: "1"
    - name: GPUSTACK_ENGINE_SENTINEL_ENGINE
      value: vllm
    image: vllm/vllm-openai:v0.19.0
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -m
          - gpustack_engine_sentinel.drain
          - --engine
          - vLLM
          - --port
          - "8000"
          - --scheme
          - http
          - --settle
          - "5"
          - --deadline
          - "25"
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /gpustack/v1/live
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /gpustack/v1/ready
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        nvidia.com/gpu.partitioned: "1"
        nvidia.com/gpu.partitioned.mig-3g.40gb: "1"
      requests:
        nvidia.com/gpu.partitioned: "1"
        nvidia.com/gpu.partitioned.mig-3g.40gb: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /gpustack/v1/live
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
    - mountPath: /var/lib/gpustack/operator/lib/engine-sentinel
      name: gpustack-engine-sentinel
      readOnly: true
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 30
  volumes:
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-vllm/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-f7c2ae1c
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
  - hostPath:
      path: /var/lib/gpustack/operator/lib/engine-sentinel
      type: DirectoryOrCreate
    name: gpustack-engine-sentinel
status: {}
