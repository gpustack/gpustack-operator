apiVersion: v1
kind: Pod
metadata:
  annotations:
    kueue.x-k8s.io/pod-group-serving: "true"
    kueue.x-k8s.io/pod-group-total-count: "1"
    kueue.x-k8s.io/role-hash: main
    modeldeployment.gpustack.ai/pod-spec-hash: e3e80b0a4a8ecf27bda1ee3cb5e2dfd5772c8888fb43ce0fc4234d0a7db8a1e1
    modeldeployment.gpustack.ai/render-version: "4"
    note.gpustack.ai/role: main
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
    worker.gpustack.ai/elastic-boot-width: "2"
  generateName: qwen-main-
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: qwen
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-782503a2fb4f6cc3
    kueue.x-k8s.io/queue-name: queue-for-h20-8x
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: server
    resource.gpustack.ai/type: modeldeployments
  name: qwen-main-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen
    uid: md-uid
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - /bin/sh
    - -c
    - set -e; ray start --node-ip-address="$GPUSTACK_ELASTIC_POD_IP" --address=qwen-elastic-head.default.svc:6379
      --labels=gpustack-pod-uid="$GPUSTACK_ELASTIC_POD_UID"; exec "$@" --data-parallel-address
      "$GPUSTACK_ELASTIC_POD_IP"
    - elastic-serve
    - vllm
    - serve
    - Qwen/Qwen2.5-72B-Instruct
    - --tensor-parallel-size=1
    - --enable-expert-parallel
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --data-parallel-backend
    - ray
    - --data-parallel-size
    - "2"
    - --data-parallel-size-local
    - "1"
    - --enable-expert-parallel
    - --enable-eplb
    - --enable-elastic-ep
    env:
    - name: VLLM_CACHE_ROOT
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    - name: RAY_LOG_TO_STDERR
      value: "1"
    - name: RAY_LOGGER_LEVEL
      value: info
    - name: RAY_BACKEND_LOG_LEVEL
      value: info
    - name: GPUSTACK_ELASTIC_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: RAY_ADDRESS
      value: qwen-elastic-head.default.svc:6379
    - name: GPUSTACK_ELASTIC_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VLLM_RAY_DP_PACK_STRATEGY
      value: strict
    image: vllm/vllm-openai:v0.19.0
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -c
          - |
            import socket, ssl, sys, time, urllib.request
            start = time.monotonic()
            time.sleep(5)
            names = ["vllm:num_requests_running", "vllm:num_requests_waiting"]
            context = ssl.create_default_context()
            context.check_hostname = False
            context.verify_mode = ssl.CERT_NONE
            idle = 0
            while time.monotonic() - start < 25:
                try:
                    body = urllib.request.urlopen("http://127.0.0.1:8000/metrics", timeout=1, context=context).read().decode()
                except Exception as err:
                    if not isinstance(getattr(err, "reason", err), (TimeoutError, socket.timeout)):
                        sys.exit(0)
                    body = None
                busy = 1.0 if body is None else 0.0
                for line in (body or "").splitlines():
                    name = line.split("{", 1)[0].split(" ", 1)[0]
                    if name not in names:
                        continue
                    sample = line.rsplit("}", 1)[1] if "{" in line else line[len(name):]
                    try:
                        busy += float(sample.split()[0])
                    except (IndexError, ValueError):
                        busy += 1.0
                idle = idle + 1 if busy == 0 else 0
                if idle == 2:
                    sys.exit(0)
                time.sleep(1)
            sys.exit(0)
    livenessProbe:
      exec:
        command:
        - python3
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              response = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1)
              code = getattr(response, "status", None)
              if code is None:
                  code = response.getcode()
              response.close()
          except urllib.error.HTTPError as err:
              code = err.code
              err.close()
          except Exception:
              sys.exit(1)
          sys.exit(0 if code in (200, 503) else 1)
      failureThreshold: 6
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        cpu: "16"
        device.gpustack.ai/rdma.shared: "1"
        ephemeral-storage: 15Gi
        memory: 64Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: 1600m
        ephemeral-storage: 1920Mi
        memory: 8Gi
        nvidia.com/gpu: "1"
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
        - SYS_RESOURCE
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 30
  volumes:
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-vllm/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-46b70680
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
status: {}
---
