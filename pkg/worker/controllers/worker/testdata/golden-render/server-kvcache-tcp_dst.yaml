apiVersion: v1
kind: Pod
metadata:
  annotations:
    kueue.x-k8s.io/pod-group-serving: "true"
    kueue.x-k8s.io/pod-group-total-count: "1"
    kueue.x-k8s.io/role-hash: main
    kvcache.gpustack.ai/client-config: '{"metadata_server":"P2PHANDSHAKE","master_server_address":"shared-kv-master.gpustack-system.svc:50051","protocol":"tcp","device_name":"","mode":"standalone-store","global_segment_size":0,"local_buffer_size":134217728,"tenant_id":"chat"}'
    modeldeployment.gpustack.ai/pod-spec-hash: c0e840a561810a4d682f052afdb4a7033d1d71eee9b0afad8b2679327f51e31f
    modeldeployment.gpustack.ai/render-version: "5"
    note.gpustack.ai/role: main
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  generateName: qwen-main-
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: qwen
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-782503a2fb4f6cc3
    kueue.x-k8s.io/queue-name: queue-for-h20-8x
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: server
    resource.gpustack.ai/type: modeldeployments
  name: qwen-main-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen
    uid: md-uid
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - vllm
    - serve
    - Qwen/Qwen2.5-72B-Instruct
    - --kv-transfer-config
    - '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both"}'
    - --kv-cache-dtype
    - bfloat16
    - --block-size
    - "128"
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    env:
    - name: MOONCAKE_CONFIG_PATH
      value: /etc/gpustack/kvcache/mooncake.json
    - name: MC_TE_METRIC
      value: "1"
    - name: MC_TCP_MAX_QUEUED_TRANSFERS_PER_PEER
      value: "65535"
    - name: MC_TCP_MAX_PENDING_ADMISSIONS_PER_PEER
      value: "65535"
    - name: MC_TCP_LANES_PER_PEER
      value: "16"
    - name: MC_TCP_ADMISSION_TIMEOUT_MS
      value: "60000"
    - name: VLLM_CACHE_ROOT
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    image: vllm/vllm-openai:v0.19.0
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -c
          - |
            import socket, ssl, sys, time, urllib.request
            start = time.monotonic()
            time.sleep(5)
            names = ["vllm:num_requests_running", "vllm:num_requests_waiting"]
            context = ssl.create_default_context()
            context.check_hostname = False
            context.verify_mode = ssl.CERT_NONE
            idle = 0
            while time.monotonic() - start < 25:
                try:
                    body = urllib.request.urlopen("http://127.0.0.1:8000/metrics", timeout=1, context=context).read().decode()
                except Exception as err:
                    if not isinstance(getattr(err, "reason", err), (TimeoutError, socket.timeout)):
                        sys.exit(0)
                    body = None
                busy = 1.0 if body is None else 0.0
                for line in (body or "").splitlines():
                    name = line.split("{", 1)[0].split(" ", 1)[0]
                    if name not in names:
                        continue
                    sample = line.rsplit("}", 1)[1] if "{" in line else line[len(name):]
                    try:
                        busy += float(sample.split()[0])
                    except (IndexError, ValueError):
                        busy += 1.0
                idle = idle + 1 if busy == 0 else 0
                if idle == 2:
                    sys.exit(0)
                time.sleep(1)
            sys.exit(0)
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /etc/gpustack/kvcache
      name: gpustack-kvcache-config
      readOnly: true
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 30
  volumes:
  - downwardAPI:
      items:
      - fieldRef:
          fieldPath: metadata.annotations['kvcache.gpustack.ai/client-config']
        path: mooncake.json
    name: gpustack-kvcache-config
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-vllm/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-f7c2ae1c
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
status: {}
