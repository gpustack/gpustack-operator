                    route: {cluster: router_upstream, timeout: 86400s}
                  - match:
                      path: "/v1/videos"
                      headers:
                      - name: ":method"
                        string_match: {exact: "POST"}
                    route: {cluster: router_upstream, timeout: 86400s}
                  - match:
                      prefix: "/v1/videos/"
                      headers:
                      - name: ":method"
                        string_match: {exact: "GET"}
                    route: {cluster: router_upstream, timeout: 86400s}
                  - match: {prefix: "/"}
                    direct_response: {status: 403}
              # ONE ACCESS LOG, AND IT IS NOT A FIELD. The gap it fills is that nothing is logged at
              # all, so there is no value a user would choose; what a reader needs is the endpoint the
              # picker selected beside the outcome, which is the pair no other log on this Pod carries.
              # The upstream host is that endpoint, and the response flags and code details are what
              # separate "the model refused" from "the proxy never reached one".
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      start_time: "%START_TIME%"
                      method: "%REQ(:METHOD)%"
                      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                      protocol: "%PROTOCOL%"
                      response_code: "%RESPONSE_CODE%"
                      response_flags: "%RESPONSE_FLAGS%"
                      response_code_details: "%RESPONSE_CODE_DETAILS%"
                      duration: "%DURATION%"
                      upstream_host: "%UPSTREAM_HOST%"
                      request_id: "%REQ(X-REQUEST-ID)%"
                      bytes_received: "%BYTES_RECEIVED%"
                      bytes_sent: "%BYTES_SENT%"
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: observer
        address:
          socket_address: {address: 0.0.0.0, port_value: 9091}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: router_observer
              normalize_path: true
              merge_slashes: true
              path_with_escaped_slashes_action: REJECT_REQUEST
              route_config:
                name: router_observer
                virtual_hosts:
                - name: observer
                  domains: ["*"]
                  routes:
                  - match:
                      path: "/observer/endpoints"
                      headers:
                      - name: ":method"
                        string_match: {exact: "GET"}
                    route: {cluster: router_upstream, timeout: 5s}
                  - match: {prefix: "/"}
                    direct_response: {status: 403}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: router_upstream
        type: STATIC
        connect_timeout: 1s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: router_upstream
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: {address: 127.0.0.1, port_value: 8001}
