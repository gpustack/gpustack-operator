apiVersion: worker.gpustack.ai/v1
kind: ModelDeployment
metadata:
  name: qwen
  namespace: default
spec:
  engine:
    image: vllm/vllm-openai:v0.19.0
    name: vLLM
  kvTransfer:
    backend: Mooncake
  model:
    name: Qwen/Qwen2.5-72B-Instruct
  roles:
  - acceleratorType: h20-8x
    image: vllm/vllm-openai:v0.19.0
    kind: Prefill
    name: prefill
    replicas: 1
    resources:
      accelerator: "1"
      interface: "1"
    size: 1
  - acceleratorType: h20-8x
    image: vllm/vllm-openai:v0.19.0
    kind: Decode
    name: decode
    replicas: 1
    resources:
      accelerator: "1"
      interface: "1"
    size: 1
  router:
    name: llm-d-router
status: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: gpustack-settings
  namespace: gpustack-system
stringData:
  aws-efa-enabled: "true"
