apiVersion: worker.gpustack.ai/v1
kind: ModelDeployment
metadata:
  name: qwen
  namespace: default
spec:
  engine:
    image: vllm/vllm-openai:v0.19.0
    name: vLLM
  kvTransfer:
    backend: NIXL
  model:
    name: Qwen/Qwen2.5-72B-Instruct
  roles:
  - image: vllm/vllm-openai:v0.19.0
    instanceType: mi300x-8x
    kind: Prefill
    name: prefill
    replicas: 1
    resources:
      accelerator: "1"
    size: 1
  - image: vllm/vllm-openai:v0.19.0
    instanceType: mi300x-8x
    kind: Decode
    name: decode
    replicas: 1
    resources:
      accelerator: "1"
    size: 1
  router:
    name: llm-d-router
status: {}
