    - mountPath: /dev/shm
      name: model-shm
    - mountPath: /var/lib/gpustack/operator/lib/engine-sentinel
      name: gpustack-engine-sentinel
      readOnly: true
  enableServiceLinks: false
  initContainers:
  - args:
    - --port=8000
    - --model-server-port=8200
    - --kv-connector=nixlv2
    - --secure-proxy=false
    env:
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    image: gpustack.example/disagg-sidecar:v0.10.0-fixture
    imagePullPolicy: IfNotPresent
    name: routing-proxy
    ports:
    - containerPort: 8000
