      failureThreshold: 6
      httpGet:
        path: /v1/models
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8200
      name: model-server
      protocol: TCP
    - containerPort: 8998
      name: nixl-side
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /v1/models
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        amd.com/gpu: "1"
      requests:
        amd.com/gpu: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /v1/models
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /var/lib/gpustack/cache
