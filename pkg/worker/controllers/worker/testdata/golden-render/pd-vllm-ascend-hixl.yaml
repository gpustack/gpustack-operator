apiVersion: worker.gpustack.ai/v1
kind: ModelDeployment
metadata:
  name: qwen
  namespace: default
spec:
  engine:
    image: quay.io/ascend/vllm-ascend:v0.19.0
    name: vLLM
  kvTransfer:
    backend: HIXL
  model:
    name: Qwen/Qwen2.5-72B-Instruct
  roles:
  - acceleratorType: atlas-910b
    image: quay.io/ascend/vllm-ascend:v0.19.0
    kind: Prefill
    name: prefill
    replicas: 1
    resources:
      accelerator: "1"
    size: 1
  - acceleratorType: atlas-910b
    image: quay.io/ascend/vllm-ascend:v0.19.0
    kind: Decode
    name: decode
    replicas: 1
    resources:
      accelerator: "1"
    size: 1
  router:
    name: llm-d-router
status: {}
