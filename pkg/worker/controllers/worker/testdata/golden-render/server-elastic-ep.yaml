apiVersion: worker.gpustack.ai/v1
kind: ModelDeployment
metadata:
  name: qwen
  namespace: default
spec:
  engine:
    image: vllm/vllm-openai:v0.19.0
    name: vLLM
  model:
    name: Qwen/Qwen2.5-72B-Instruct
  roles:
  - acceleratorType: h20-8x
    elasticEp:
      width: 2
    extraArgs:
    - --tensor-parallel-size=1
    - --enable-expert-parallel
    image: vllm/vllm-openai:v0.19.0
    kind: Server
    name: main
    replicas: 2
    resources:
      accelerator: "1"
      interface: "1"
    size: 1
status: {}
