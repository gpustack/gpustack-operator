spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - vllm
    - serve
    - Qwen/Qwen2.5-72B-Instruct
    - --kv-transfer-config
    - '{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"mooncake_protocol":"tcp"}}'
    - --block-size
    - "128"
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    env:
    - name: MC_TE_METRIC
      value: "1"
    - name: MC_FORCE_TCP
      value: "1"
    - name: MC_TCP_MAX_QUEUED_TRANSFERS_PER_PEER
      value: "65535"
    - name: MC_TCP_MAX_PENDING_ADMISSIONS_PER_PEER
      value: "65535"
    - name: MC_TCP_LANES_PER_PEER
      value: "16"
    - name: MC_TCP_ADMISSION_TIMEOUT_MS
      value: "60000"
    - name: VLLM_CACHE_ROOT
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    - name: PYTHONPATH
      value: /var/lib/gpustack/operator/lib/engine-sentinel
    - name: GPUSTACK_KERNEL_ARTIFACT_DIR
      value: /var/lib/gpustack/kernels
    image: vllm/vllm-openai:v0.19.0
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -m
          - gpustack_engine_sentinel.drain
          - --engine
          - vLLM
          - --port
          - "8000"
          - --scheme
          - http
          - --settle
          - "5"
          - --deadline
          - "25"
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /health
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /var/lib/gpustack/kernels
      name: gpustack-kernels
      readOnly: true
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
    - mountPath: /var/lib/gpustack/operator/lib/engine-sentinel
      name: gpustack-engine-sentinel
      readOnly: true
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 30
  volumes:
  - image:
      pullPolicy: IfNotPresent
      reference: ghcr.io/gpustack/kernels/qwen-decode@sha256:3333333333333333333333333333333333333333333333333333333333333333
    name: gpustack-kernels
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-vllm/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-e5110b98
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
  - hostPath:
      path: /var/lib/gpustack/operator/lib/engine-sentinel
      type: DirectoryOrCreate
    name: gpustack-engine-sentinel
