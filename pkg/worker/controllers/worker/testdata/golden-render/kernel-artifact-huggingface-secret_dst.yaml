apiVersion: v1
kind: Pod
metadata:
  annotations:
    kueue.x-k8s.io/pod-group-serving: "true"
    kueue.x-k8s.io/pod-group-total-count: "1"
    kueue.x-k8s.io/role-hash: main
    modeldeployment.gpustack.ai/pod-spec-hash: fe6cf98e9a45a182ea224a257b367b9b1b0d356495b27385d7eb0c607858c2d3
    modeldeployment.gpustack.ai/render-version: "7"
    note.gpustack.ai/role: main
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  generateName: qwen-main-
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: qwen
    app.kubernetes.io/name: model-deployment
    app.kubernetes.io/part-of: gpustack-operator-worker
    kueue.x-k8s.io/pod-group-name: gpustack-fnv64-782503a2fb4f6cc3
    kueue.x-k8s.io/queue-name: queue-for-h20-8x
    modeldeployment.gpustack.ai/member-index: "0"
    modeldeployment.gpustack.ai/pod-ordinal: "0"
    modeldeployment.gpustack.ai/role-kind: server
    resource.gpustack.ai/type: modeldeployments
  name: qwen-main-0-0
  namespace: default
  ownerReferences:
  - apiVersion: worker.gpustack.ai/v1alpha1
    blockOwnerDeletion: false
    controller: true
    kind: ModelDeployment
    name: qwen
    uid: md-uid
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - python3
    - -m
    - sglang.launch_server
    - --model-path
    - Qwen/Qwen2.5-72B-Instruct
    - --enable-metrics
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    env:
    - name: SGLANG_CACHE_DIR
      value: /var/lib/gpustack/cache
    - name: HF_HUB_CACHE
      value: /var/lib/gpustack/cache/hf-hub
    - name: HF_XET_CACHE
      value: /var/lib/gpustack/cache/xet
    - name: PIP_CACHE_DIR
      value: /var/lib/gpustack/cache/pip
    - name: TORCH_HOME
      value: /var/lib/gpustack/cache/torch
    - name: FLASHINFER_WORKSPACE_BASE
      value: /var/lib/gpustack/cache/flashinfer
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /var/lib/gpustack/cache/inductor
    - name: TRITON_CACHE_DIR
      value: /var/lib/gpustack/cache/triton
    - name: PYTHONPATH
      value: /var/lib/gpustack/operator/lib/engine-sentinel
    - name: GPUSTACK_ENGINE_SENTINEL_ENABLE
      value: "1"
    - name: GPUSTACK_ENGINE_SENTINEL_ENGINE
      value: sglang
    - name: GPUSTACK_KERNEL_ARTIFACT_DIR
      value: /var/lib/gpustack/kernels
    image: lmsysorg/sglang:v0.5.18
    lifecycle:
      preStop:
        exec:
          command:
          - python3
          - -m
          - gpustack_engine_sentinel.drain
          - --engine
          - SGLang
          - --port
          - "8000"
          - --scheme
          - http
          - --settle
          - "5"
          - --deadline
          - "25"
    livenessProbe:
      failureThreshold: 6
      httpGet:
        path: /gpustack/v1/live
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    name: main
    ports:
    - containerPort: 8000
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /gpustack/v1/ready
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    startupProbe:
      failureThreshold: 180
      httpGet:
        path: /gpustack/v1/live
        port: 8000
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /var/lib/gpustack/kernels
      name: gpustack-kernels
      readOnly: true
    - mountPath: /var/lib/gpustack/cache
      name: gpustack-compile-cache
    - mountPath: /dev/shm
      name: model-shm
    - mountPath: /var/lib/gpustack/operator/lib/engine-sentinel
      name: gpustack-engine-sentinel
      readOnly: true
  enableServiceLinks: false
  restartPolicy: Always
  runtimeClassName: nvidia
  terminationGracePeriodSeconds: 30
  volumes:
  - csi:
      driver: model.csi.gpustack.ai
      nodePublishSecretRef:
        name: hf-kernel-token
      readOnly: true
      volumeAttributes:
        artifact: qwen-kernels-hub
        artifactKind: ModelKernelArtifact
        artifactUID: kernel-artifact-uid-hub
        manifestDigest: sha256:4444444444444444444444444444444444444444444444444444444444444444
    name: gpustack-kernels
  - hostPath:
      path: /var/lib/gpustack/cache/nvidia-sglang/m-1a67e1afa7075ef35646bfd3ee97d8de/tp1-pp1-dp1-ep1-cp1_1-fe05d7d3
      type: DirectoryOrCreate
    name: gpustack-compile-cache
  - emptyDir:
      medium: Memory
      sizeLimit: 16Gi
    name: model-shm
  - hostPath:
      path: /var/lib/gpustack/operator/lib/engine-sentinel
      type: DirectoryOrCreate
    name: gpustack-engine-sentinel
status: {}
