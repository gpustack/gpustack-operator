apiVersion: worker.gpustack.ai/v1
kind: ModelDeployment
metadata:
  name: qwen
  namespace: default
spec:
  engine:
    image: vllm/vllm-openai:v0.19.0
    name: vLLM
  model:
    name: Qwen/Qwen2.5-72B-Instruct
  roles:
  - additionalVolumes:
    - configMap:
        name: app-config
      mountPath: /etc/config
      readOnly: true
    - mountPath: /etc/tls
      readOnly: true
      secret:
        name: tls-secret
    - mountPath: /mnt/cache
      persistentVolumeClaim:
        claimName: model-cache
    - hostPath:
        path: /var/log/gpustack
      mountPath: /var/log/host
    extraArgs:
    - --ssl-certfile
    - /etc/tls/tls.crt
    - --ssl-keyfile
    - /etc/tls/tls.key
    image: vllm/vllm-openai:v0.19.0
    instanceType: h20-8x
    kind: Server
    name: main
    ports:
    - port: 9000
      protocol: TCP
    privileged: true
    replicas: 1
    resources:
      accelerator: "1"
    shmSize: 32Gi
    size: 1
    startupTimeoutSeconds: 3600
    terminationGracePeriodSeconds: 60
    topology:
      requiredLevel: topology.kubernetes.io/zone
status: {}
