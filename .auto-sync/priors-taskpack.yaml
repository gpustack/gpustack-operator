apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: priors-sync
spec:
  goal:
    candidate: >-
      Synchronize pkg/worker/scaling/priors/priors.yaml and pkg/worker/scaling/priors/records.md
      with the preflight-staged SemiAnalysisAI/InferenceX benchmark snapshots, update
      .auto-sync/proposals/priors.json, and pass all schema, unit test, and documentation lint gates.
    noChange: >-
      Confirm pkg/worker/scaling/priors/priors.yaml, pkg/worker/scaling/priors/records.md, and
      .auto-sync/proposals/priors.json already match the upstream SemiAnalysisAI/InferenceX snapshots
      with zero repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
    digests:
      pinDigests: true
      lockfile: .auto-sync/digests/priors.lock.json
  preflight:
    script: .auto-sync/scripts/preflight-priors.sh
    timeoutSeconds: 600
    env:
      - AUTOSYNC_STAGE_DIR
      - AUTOSYNC_FORCE
      - COMMENT_COMMAND
      - AUTOSYNC_WARM_TOOLS
      - AUTOSYNC_SKIP_GO_MOD_DOWNLOAD
      - AUTOSYNC_SKIP_LFS_FETCH
      - AUTOSYNC_PRIORS_FIXTURE_DIR
      - AUTOSYNC_PRIORS_FIXTURE_HEAD
      - GITHUB_EVENT_NAME
      - GITHUB_STEP_SUMMARY
  scope:
    writable:
      - pkg/worker/scaling/priors/priors.yaml
      - pkg/worker/scaling/priors/records.md
      - .auto-sync/proposals/priors.json
    protected:
      - pkg/worker/scaling/priors/catalog.go
      - pkg/worker/scaling/priors/catalog_yaml.go
      - pkg/worker/scaling/priors/resolve.go
      - pkg/worker/scaling/priors/validate.go
      - gen/priors/**
      - .claude/**
      - .codex/**
      - AGENTS.md
  instructions:
    - .auto-sync/instructions/priors.md
  upstreams:
    - id: inferencex-repo
      kind: git-commit
      source: SemiAnalysisAI/InferenceX
      watchedPaths: []
    - id: inferencex-availability
      kind: http-json
      source: https://inferencex.semianalysis.com/api/v1/availability
      watchedPaths: []
      monotonicSemver: false
  proposal:
    path: .auto-sync/proposals/priors.json
    requiredFields:
      - schema_version
      - summary
      - versions
      - subscriptions
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-schema
        implementation: json-artifact.v1
      - id: scope-guard
        implementation: scope.v1
      - id: validate-priors
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_priors.sh
          timeoutSeconds: 600
          allowReadOnlyGitHubToken: false
          env:
            - AUTOSYNC_STAGE_DIR
            - AUTOSYNC_FAST_SELFTEST
            - GITHUB_ACTIONS
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync-priors/
    titleTemplate: "chore(scaling): sync InferenceX capacity priors"
  memory:
    directory: .auto-sync/memory/priors-sync
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /loopwright
      - /auto-sync
  baselineAlignment:
    policy: extract-context
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  limits:
    wallTimeSeconds: 1800
    commandTimeoutSeconds: 600
    overlay:
      maxFiles: 256
      maxBytes: 16777216
  output:
    formats:
      - json
      - github-step-summary
