apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: k8s-deps-sync
spec:
  goal:
    candidate: >-
      Synchronize CLI tool pins in pack/gpustack-operator/Dockerfile (helm, skopeo, vals, kustomize,
      ytt, kubectl) and/or Kubernetes v0.36.x lockstep Go modules, controller-runtime, helm/v3, and
      kueue using preflight-staged resources, adapt staging patches and Go call sites within writable
      scope, update .auto-sync/proposals/k8s-deps.json, and pass upgrade-compat, toolpins-selftest,
      codegen, lint, and unit test gates.
    noChange: >-
      Confirm all CLI tool pins in pack/gpustack-operator/Dockerfile and Kubernetes lockstep Go
      dependencies are aligned with eligible upstream releases with zero repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
      allowCheckNetwork: true
    digests:
      pinDigests: true
      lockfile: .auto-sync/digests/k8s-deps.lock.json
  preflight:
    script: .auto-sync/scripts/preflight-k8s-deps.sh
    timeoutSeconds: 1800
    env:
      - AUTOSYNC_STAGE_DIR
      - AUTOSYNC_FORCE
      - COMMENT_COMMAND
      - AUTOSYNC_WARM_TOOLS
      - AUTOSYNC_WARM_UV
      - AUTOSYNC_WARM_GO_LIST_ALL
      - AUTOSYNC_SKIP_GO_MOD_DOWNLOAD
      - AUTOSYNC_SKIP_LFS_FETCH
      - AUTOSYNC_SKIP_GENERATE
      - AUTOSYNC_K8S_DEPS_FIXTURE_DIR
      - AUTOSYNC_HELM_GOMOD_BASE_URL
      - GITHUB_EVENT_NAME
      - GITHUB_STEP_SUMMARY
  scope:
    writable:
      - pack/gpustack-operator/Dockerfile
      - hack/deps.sh
      - hack/lib/helm.sh
      - hack/staging/**
      - staging/**
      - go.mod
      - go.sum
      - api/**
      - pkg/**
      - .auto-sync/proposals/k8s-deps.json
    protected:
      - pkg/devicemanager/allocator/**
      - pkg/worker/scaling/priors/priors.yaml
      - pkg/worker/scaling/priors/records.md
      - pkg/worker/settings/value.go
      - csrc/**
      - binding/**
      - gen/binding/**
      - .claude/**
      - .codex/**
      - AGENTS.md
  instructions:
    - .auto-sync/instructions/k8s-deps.md
  upstreams:
    - id: kubernetes
      kind: github-release
      source: kubernetes/kubernetes
      watchedPaths: []
      allowPrerelease: false
    - id: controller-runtime
      kind: github-release
      source: kubernetes-sigs/controller-runtime
      watchedPaths: []
      allowPrerelease: false
    - id: kueue-sdk
      kind: github-release
      source: kubernetes-sigs/kueue
      watchedPaths: []
      allowPrerelease: false
    - id: helm-cli
      kind: github-release
      source: helm/helm
      watchedPaths: []
      allowPrerelease: false
    - id: skopeo-cli
      kind: github-release
      source: podman-container-tools/skopeo
      watchedPaths: []
      allowPrerelease: false
    - id: vals-cli
      kind: github-release
      source: helmfile/vals
      watchedPaths: []
      allowPrerelease: false
    - id: kustomize-cli
      kind: git-tag
      source: kubernetes-sigs/kustomize
      watchedPaths:
        - kustomize
      allowPrerelease: false
    - id: ytt-cli
      kind: github-release
      source: carvel-dev/ytt
      watchedPaths: []
      allowPrerelease: false
  proposal:
    path: .auto-sync/proposals/k8s-deps.json
    requiredFields:
      - schema_version
      - summary
      - versions
      - subscriptions
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-schema
        implementation: json-artifact.v1
      - id: scope-guard
        implementation: scope.v1
      - id: validate-k8s-deps
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_k8s_deps.sh
          timeoutSeconds: 3600
          allowReadOnlyGitHubToken: false
          env:
            - AUTOSYNC_STAGE_DIR
            - AUTOSYNC_FAST_SELFTEST
            - GITHUB_ACTIONS
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync-k8s-deps/
    titleTemplate: "chore(deps): sync kubernetes modules and cli toolchains"
  memory:
    directory: .auto-sync/memory/k8s-deps-sync
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /loopwright
      - /auto-sync
  baselineAlignment:
    policy: extract-context
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  limits:
    wallTimeSeconds: 3600
    commandTimeoutSeconds: 3600
    overlay:
      maxFiles: 4096
      maxBytes: 67108864
  output:
    formats:
      - json
      - github-step-summary
