apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: charts-sync
spec:
  goal:
    candidate: >-
      Synchronize vendored Helm subcharts (kueue, node-feature-discovery, csi-driver-nfs,
      csi-driver-s3, topograph) and their gpustack/mirrored-* subchart image pins using
      preflight-staged resources, adapt local chart patches under hack/deploy/gpustack-operator/chart/charts/
      and Go embed sites under pkg/worker/kuberess/ only when required, regenerate chart schema and
      README, update .auto-sync/proposals/charts.json, and pass all verification gates.
    noChange: >-
      Confirm all five vendored Helm subcharts and subchart gpustack/mirrored-* image pins are aligned
      with eligible upstream releases (or held back awaiting mirrored multi-arch images) with zero
      repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
      allowCheckNetwork: true
    digests:
      pinDigests: true
      lockfile: .auto-sync/digests/charts.lock.json
  preflight:
    script: .auto-sync/scripts/preflight-charts.sh
    timeoutSeconds: 900
    env:
      - AUTOSYNC_STAGE_DIR
      - AUTOSYNC_FORCE
      - COMMENT_COMMAND
      - AUTOSYNC_WARM_TOOLS
      - AUTOSYNC_SKIP_GO_MOD_DOWNLOAD
      - AUTOSYNC_SKIP_LFS_FETCH
      - AUTOSYNC_CHARTS_FIXTURE_DIR
      - AUTOSYNC_MOCK_MANIFESTS_JSON
      - AUTOSYNC_CRANE_BIN
      - AUTOSYNC_SKIP_GENERATE_CHART
      - CHART_TESTING_VERSION
      - GITHUB_EVENT_NAME
      - GITHUB_STEP_SUMMARY
  scope:
    writable:
      - hack/deps.sh
      - hack/deploy/gpustack-operator/chart/charts/**
      - deploy/gpustack-operator/chart/**
      - pkg/worker/kuberess/**
      - .auto-sync/proposals/charts.json
    protected:
      - hack/staging/**
      - staging/**
      - .claude/**
      - .codex/**
      - AGENTS.md
  instructions:
    - .auto-sync/instructions/charts.md
  upstreams:
    - id: kueue-chart
      kind: github-release
      source: kubernetes-sigs/kueue
      watchedPaths: []
      allowPrerelease: false
    - id: nfd-chart
      kind: github-release
      source: kubernetes-sigs/node-feature-discovery
      watchedPaths: []
      allowPrerelease: false
    - id: csi-driver-nfs-chart
      kind: git-tag
      source: kubernetes-csi/csi-driver-nfs
      watchedPaths:
        - charts
      allowPrerelease: false
    - id: csi-driver-s3-chart
      kind: git-tag
      source: thxcode/k8s-csi-s3
      watchedPaths:
        - charts
      allowPrerelease: false
    - id: topograph-chart
      kind: git-tag
      source: NVIDIA/topograph
      watchedPaths:
        - charts
      allowPrerelease: false
  proposal:
    path: .auto-sync/proposals/charts.json
    requiredFields:
      - schema_version
      - summary
      - versions
      - subscriptions
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-schema
        implementation: json-artifact.v1
      - id: scope-guard
        implementation: scope.v1
      - id: validate-charts
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_charts.sh
          timeoutSeconds: 1800
          allowReadOnlyGitHubToken: false
          env:
            - AUTOSYNC_STAGE_DIR
            - AUTOSYNC_FAST_SELFTEST
            - AUTOSYNC_VERIFY_RESTAGE
            - AUTOSYNC_SKIP_RESTAGE_CHECK
            - AUTOSYNC_SKIP_IMAGE_CHECK
            - GITHUB_ACTIONS
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync-charts/
    titleTemplate: "chore(chart): sync vendored helm subcharts"
  memory:
    directory: .auto-sync/memory/charts-sync
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /loopwright
      - /auto-sync
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  limits:
    wallTimeSeconds: 3600
    commandTimeoutSeconds: 1800
    overlay:
      maxFiles: 1024
      maxBytes: 33554432
  output:
    formats:
      - json
      - github-step-summary
