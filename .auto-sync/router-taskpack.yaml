apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: router-sync
spec:
  goal:
    candidate: >-
      Synchronize disaggregated inference router recipes and patches (llm-d-router, vllm-router,
      sgl-router via paired *_VERSION and ancestry-gated optional *_COMMIT pins, with legacy
      sgl-model-gateway permanently frozen at gateway-v0.3.1) in pack/llm-router/ for Stage A,
      graduating commit-pinned routers only to stable release tags that contain their pinned
      commit, or promote published multi-arch gpustack/llm-router, mirrored-envoy, and
      mirrored-llm-d-router-disagg-sidecar image tags across settings, tests, and docs for
      Stage B using preflight-staged resources, update .auto-sync/proposals/router.json
      (including base_image_builds and sync_images recommendations), and pass all verification
      gates.
    noChange: >-
      Confirm llm-d-router, vllm-router, sgl-router (including any commit-pinned router held
      back awaiting a stable release tag containing its pinned commit), frozen sglang-gateway,
      and the default router, proxy, and sidecar image tags are already aligned with eligible
      upstream releases with zero repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
      allowCheckNetwork: true
    digests:
      pinDigests: true
      lockfile: .auto-sync/digests/router.lock.json
  preflight:
    script: .auto-sync/scripts/preflight-router.sh
    timeoutSeconds: 900
    env:
      - AUTOSYNC_STAGE_DIR
      - AUTOSYNC_FORCE
      - COMMENT_COMMAND
      - AUTOSYNC_WARM_TOOLS
      - AUTOSYNC_SKIP_GO_MOD_DOWNLOAD
      - AUTOSYNC_SKIP_LFS_FETCH
      - AUTOSYNC_SKIP_GO_TEST
      - AUTOSYNC_TARGET_TAG
      - AUTOSYNC_ROUTER_TARGET_TAG
      - AUTOSYNC_ROUTER_PROXY_TARGET_TAG
      - AUTOSYNC_ROUTER_SIDECAR_TARGET_TAG
      - AUTOSYNC_ROUTER_FIXTURE_DIR
      - AUTOSYNC_MOCK_MANIFESTS_JSON
      - AUTOSYNC_CRANE_BIN
      - AUTOSYNC_ROUTER_LLMD_REPO_URL
      - AUTOSYNC_ROUTER_VLLM_REPO_URL
      - AUTOSYNC_ROUTER_SGLANG_REPO_URL
      - AUTOSYNC_ROUTER_SGL_ROUTER_REPO_URL
      - AUTOSYNC_ROUTER_EPD_COMMIT
      - GITHUB_EVENT_NAME
      - GITHUB_STEP_SUMMARY
  scope:
    writable:
      - pack/llm-router/**
      - pkg/worker/settings/value.go
      - pkg/worker/settings/value_test.go
      - pkg/worker/controllers/worker/model_deployment_router_test.go
      - pkg/worker/controllers/worker/model_deployment_render_test.go
      - docs/reference/settings.md
      - docs/modules/model-deployment/routing.md
      - .auto-sync/proposals/router.json
    protected:
      - pack/llm-router/patches/sglang-gateway/**
      - pkg/worker/webhooks/**
      - .claude/**
      - .codex/**
      - AGENTS.md
  instructions:
    - .auto-sync/instructions/router.md
  upstreams:
    - id: llm-d-router
      kind: git-tag
      source: llm-d/llm-d-router
      watchedPaths: []
      allowPrerelease: false
    - id: vllm-router
      kind: git-tag
      source: vllm-project/router
      watchedPaths: []
      allowPrerelease: false
    # Frozen at gateway-v0.3.1 (upstream deleted sgl-model-gateway in sgl-project/sglang PR #50732).
    - id: sglang-gateway
      kind: git-tag
      source: sgl-project/sglang
      watchedPaths:
        - sgl-model-gateway
      allowPrerelease: false
    - id: sgl-router
      kind: git-tag
      source: sgl-project/sglang
      watchedPaths:
        - sgl-router
        - rust
      allowPrerelease: false
  proposal:
    path: .auto-sync/proposals/router.json
    requiredFields:
      - schema_version
      - stage
      - summary
      - versions
      - subscriptions
      - base_image_builds
      - sync_images
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-schema
        implementation: json-artifact.v1
      - id: scope-guard
        implementation: scope.v1
      - id: validate-router
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_router.sh
          timeoutSeconds: 2400
          allowReadOnlyGitHubToken: false
          env:
            - AUTOSYNC_STAGE_DIR
            - AUTOSYNC_FAST_SELFTEST
            - AUTOSYNC_ROUTER_BUILD_RUNNER
            - AUTOSYNC_ALLOW_MISSING_STAGED_REPO
            - GITHUB_ACTIONS
          mounts:
            - source: /var/run/docker.sock
              mode: rw
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync-router/
    titleTemplate: "chore(llm-router): sync disaggregated router versions and patches"
  memory:
    directory: .auto-sync/memory/router-sync
    apply: inline-with-candidate
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /loopwright
      - /auto-sync
  baselineAlignment:
    policy: extract-context
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  limits:
    wallTimeSeconds: 3600
    commandTimeoutSeconds: 2400
    overlay:
      maxFiles: 256
      maxBytes: 16777216
  output:
    formats:
      - json
      - github-step-summary
