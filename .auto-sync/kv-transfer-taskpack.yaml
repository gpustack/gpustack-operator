apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: kv-transfer-sync
spec:
  goal:
    candidate: >-
      Synchronize KV-cache and remote-weight transfer container recipes (Mooncake, NIXL, UCX, HIXL,
      ModelExpress) in Stage A and promote published multi-arch gpustack/* image tags in Stage B
      using preflight-staged resources, update .auto-sync/proposals/kv-transfer.json, and pass all
      verification gates.
    noChange: >-
      Confirm all KV-cache and model-transfer upstream recipes and published image tags are already
      aligned with eligible upstream releases with zero repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
      allowCheckNetwork: true
    digests:
      pinDigests: true
      lockfile: .auto-sync/digests/kv-transfer.lock.json
  preflight:
    script: .auto-sync/scripts/preflight-kv-transfer.sh
    timeoutSeconds: 900
    env:
      - AUTOSYNC_STAGE_DIR
      - AUTOSYNC_FORCE
      - COMMENT_COMMAND
      - AUTOSYNC_WARM_TOOLS
      - AUTOSYNC_SKIP_GO_MOD_DOWNLOAD
      - AUTOSYNC_SKIP_LFS_FETCH
      - AUTOSYNC_SKIP_GENERATE_CHART
      - AUTOSYNC_TARGET_TAG
      - AUTOSYNC_MODELEXPRESS_TARGET_TAG
      - AUTOSYNC_MODEL_TRANSFER_TARGET_TAG
      - AUTOSYNC_KV_FIXTURE_DIR
      - AUTOSYNC_MOCK_MANIFESTS_JSON
      - AUTOSYNC_CRANE_BIN
      - AUTOSYNC_KV_NIXL_REPO_URL
      - AUTOSYNC_KV_MODELEXPRESS_REPO_URL
      - AUTOSYNC_ALLOW_UNSHALLOW
      - GITHUB_EVENT_NAME
      - GITHUB_STEP_SUMMARY
  scope:
    writable:
      - pack/mirrored-mooncake/**
      - pack/model-transfer/**
      - pack/mirrored-modelexpress-server/**
      - pkg/worker/settings/value.go
      - pkg/worker/settings/value_test.go
      - pkg/worker/controllers/worker/model_deployment_transfer_test.go
      - docs/reference/settings.md
      - docs/modules/model-delivery/remote.md
      - deploy/gpustack-operator/chart/values.yaml
      - deploy/gpustack-operator/chart/values.schema.json
      - deploy/gpustack-operator/chart/README.md.gotmpl
      - deploy/gpustack-operator/chart/README.md
      - .auto-sync/proposals/kv-transfer.json
    protected:
      - model-transfer/python/**
      - pkg/modeltransfer/**
      - pkg/worker/kvcache/**
  instructions:
    - .auto-sync/instructions/kv-transfer.md
  upstreams:
    - id: mooncake
      kind: github-release
      source: kvcache-ai/Mooncake
      watchedPaths: []
      allowPrerelease: false
    - id: nixl-pypi
      kind: http-json
      source: https://pypi.org/pypi/nixl/json
      watchedPaths: []
      allowPrerelease: false
      versionPath: info.version
      monotonicSemver: true
    - id: nixl-rocm
      kind: github-release
      source: ai-dynamo/nixl
      watchedPaths: []
      allowPrerelease: false
    - id: ucx-rocm
      kind: github-release
      source: openucx/ucx
      watchedPaths: []
      allowPrerelease: false
    - id: hixl
      kind: git-commit
      source: hicann/hixl
      watchedPaths:
        - src
        - include
        - CMakeLists.txt
    - id: modelexpress
      kind: github-release
      source: ai-dynamo/modelexpress
      watchedPaths: []
      allowPrerelease: false
    - id: gpustack-runner
      kind: git-commit
      source: gpustack/runner
      watchedPaths:
        - pack/cuda/Dockerfile.vllm
        - pack/rocm/Dockerfile.vllm
        - pack/cann/Dockerfile.vllm
        - pack/cann/patches/hixl
  proposal:
    path: .auto-sync/proposals/kv-transfer.json
    requiredFields:
      - schema_version
      - stage
      - summary
      - versions
      - subscriptions
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-schema
        implementation: json-artifact.v1
      - id: scope-guard
        implementation: scope.v1
      - id: validate-kv-transfer
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_kv_transfer.sh
          timeoutSeconds: 1800
          allowReadOnlyGitHubToken: false
          toolchainPaths:
            - /usr/local/bin
            - /usr/bin
          env:
            - AUTOSYNC_STAGE_DIR
            - AUTOSYNC_FAST_SELFTEST
            - AUTOSYNC_DOCKER_BUILD_CMD
            - GITHUB_ACTIONS
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync-kv-transfer/
    titleTemplate: "chore(model-transfer): sync kv-cache and transfer runtime recipes"
  memory:
    directory: .auto-sync/memory/kv-transfer-sync
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /loopwright
      - /auto-sync
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  limits:
    wallTimeSeconds: 3600
    commandTimeoutSeconds: 1800
    overlay:
      maxFiles: 256
      maxBytes: 16777216
  output:
    formats:
      - json
      - github-step-summary
