apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: slicing-sync
spec:
  goal:
    candidate: >-
      Synchronize accelerator logical-slicing preload library commits in pack/gpustack-operator/Dockerfile
      (LIB_HAMI_CORE_COMMIT and LIB_UBS_VIRT_ENPU_COMMIT), rebase the byte-exact CRLF Ascend vcann-rt
      patch when ubs-virt changes using preflight-staged resources, update .auto-sync/proposals/slicing.json,
      and pass the isolated Docker builder stage verification gate.
    noChange: >-
      Confirm LIB_HAMI_CORE_COMMIT, LIB_UBS_VIRT_ENPU_COMMIT, and .auto-sync/proposals/slicing.json
      already match eligible upstream commits on watched paths with zero repository modifications.
  execution:
    mode: strict
    capabilities:
      allowHostPath: true
      allowCheckNetwork: true
    digests:
      pinDigests: true
      lockfile: .auto-sync/digests/slicing.lock.json
  preflight:
    script: .auto-sync/scripts/preflight-slicing.sh
    timeoutSeconds: 600
    env:
      - AUTOSYNC_STAGE_DIR
      - AUTOSYNC_FORCE
      - COMMENT_COMMAND
      - AUTOSYNC_WARM_TOOLS
      - AUTOSYNC_SKIP_GO_MOD_DOWNLOAD
      - AUTOSYNC_SKIP_LFS_FETCH
      - AUTOSYNC_SLICING_HAMI_REPO_URL
      - AUTOSYNC_SLICING_UBS_REPO_URL
      - GITHUB_EVENT_NAME
      - GITHUB_STEP_SUMMARY
  scope:
    writable:
      - pack/gpustack-operator/Dockerfile
      - pack/gpustack-operator/external/nvidia/**
      - pack/gpustack-operator/external/ascend/**
      - .auto-sync/proposals/slicing.json
    protected:
      - pack/gpustack-operator/external/amd/**
      - pack/gpustack-operator/external/thead/**
      - csrc/**
      - binding/**
      - gen/binding/**
      - pkg/devicemanager/allocator/**
      - .claude/**
      - .codex/**
      - AGENTS.md
  instructions:
    - .auto-sync/instructions/slicing.md
  upstreams:
    - id: hami-core
      kind: git-commit
      source: Project-HAMi/HAMi-core
      watchedPaths:
        - src
        - include
        - CMakeLists.txt
        - build.sh
    - id: ubs-virt
      kind: git-commit
      source: https://gitcode.com/openeuler/ubs-virt.git
      watchedPaths:
        - ubs-virt-enpu/vcann-rt
        - ubs-virt-enpu/common
  proposal:
    path: .auto-sync/proposals/slicing.json
    requiredFields:
      - schema_version
      - summary
      - versions
      - subscriptions
    schemaVersion: 1
  verification:
    localChecks:
      - id: proposal-schema
        implementation: json-artifact.v1
      - id: scope-guard
        implementation: scope.v1
      - id: validate-slicing
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_slicing.sh
          timeoutSeconds: 2400
          allowReadOnlyGitHubToken: false
          env:
            - AUTOSYNC_STAGE_DIR
            - AUTOSYNC_FAST_SELFTEST
            - AUTOSYNC_SLICING_FORCE_XBUILD
            - AUTOSYNC_XBUILD_RUNNER
            - AUTOSYNC_ALLOW_MISSING_STAGE_DIR
            - GITHUB_ACTIONS
    externalGates: []
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync-slicing/
    titleTemplate: "chore(pack): sync accelerator slicing shims"
  memory:
    directory: .auto-sync/memory/slicing-sync
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /loopwright
      - /auto-sync
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  limits:
    wallTimeSeconds: 3600
    commandTimeoutSeconds: 2400
    overlay:
      maxFiles: 256
      maxBytes: 16777216
  output:
    formats:
      - json
      - github-step-summary
