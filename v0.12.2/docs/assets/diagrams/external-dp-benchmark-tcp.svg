<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1168" role="img" aria-labelledby="title desc">
<title id="title">Wide TP vs External DP over TCP, concurrency sweep</title>
<desc id="desc">Six-panel line chart comparing 8-GPU single-Pod wide TP (NVLink) against 4-Pod External DP (DP=4, TP=2, EP=8) over TCP across concurrency 1 to 64 on 1024/256 and 4096/128 shapes for TTFT p50 (ms, log scale), ITL p99 (ms, log scale) and output throughput (tok/s). Wide TP delivers 2.27x to 6.99x higher output throughput across all 12 cells and lower ITL p99 everywhere, while External DP lowers median TTFT at concurrency 64 on both shapes (1,863.100 vs 4,798.411 ms; 3,094.017 vs 3,814.139 ms).</desc>
<style>
:root{color-scheme:light dark;--bg:#f8fbff;--card:#fff;--ink:#12233d;--muted:#52677f;--line:#c9d9e7;--grid:#e4edf5;--axis:#8aa0b6;--c1:#2563eb;--c2:#c2410c;--c3:#0f766e;--c4:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#101d30;--card:#1a2c43;--ink:#f1f6ff;--muted:#bdcde0;--line:#526b83;--grid:#2a4058;--axis:#7f97ae;--c1:#80adff;--c2:#ffa36b;--c3:#58d6c8;--c4:#c4b5fd}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:var(--muted)}
.title{font-size:26px;font-weight:750;letter-spacing:-.3px}
.sub{font-size:14px;fill:var(--muted)}
.legend{font-size:13px;font-weight:600}
.panel{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.shape{font-size:15px;font-weight:700}
.cap{font-size:11px;fill:var(--muted)}
.val{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tick{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted)}
.axis-title{font-size:13px;font-weight:700;fill:var(--ink)}
.x-title{font-size:12px;fill:var(--muted)}
.note{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1.2}
.s1{stroke:var(--c1);fill:none;stroke-width:2.4;stroke-linejoin:round}
.s2{stroke:var(--c2);fill:none;stroke-width:2.4;stroke-linejoin:round}
.s3{stroke:var(--c3);fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:7 4}
.s3-solid{stroke:var(--c3);fill:none;stroke-width:2.4;stroke-linejoin:round}
.s4{stroke:var(--c4);fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:4 3}
.s1-dash{stroke:var(--c1);fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:6 4}
.s2-dash{stroke:var(--c2);fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:6 4}
.m1{fill:var(--card);stroke:var(--c1);stroke-width:2.1}
.m2{fill:var(--c2);stroke:var(--card);stroke-width:1}
.m3{fill:var(--card);stroke:var(--c3);stroke-width:2.0;stroke-linejoin:miter}
.m4{fill:var(--c4);stroke:var(--card);stroke-width:1}
.v1{fill:var(--c1)}
.v2{fill:var(--c2)}
.v3{fill:var(--c3)}
.v4{fill:var(--c4)}
</style>
