{{- if .Values.worker.enabled }}
{{- $certmanager := eq (include "gpustack-operator.worker.certmanager.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpustack-operator.worker.fullname" . }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.worker.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "gpustack-operator.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpustack-operator.worker.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gpustack-operator.worker.fullname" . }}
      restartPolicy: Always
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ if kindIs "string" . }}{{ . }}{{ else }}{{ .name }}{{ end }}
        {{- end }}
      {{- end }}
      {{- with (.Values.worker.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          {{- if not .labelSelector }}
          labelSelector:
            matchLabels:
              {{- include "gpustack-operator.worker.selectorLabels" $ | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      # Deliberately `preferred`: spreading replicas across nodes must never leave one
      # unschedulable on a cluster with fewer nodes than replicas. Node spread that has to hold
      # belongs in `worker.topologySpreadConstraints`.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "gpustack-operator.worker.selectorLabels" . | nindent 20 }}
      {{- end }}
      containers:
        - name: main
          image: {{ include "gpustack-operator.image" (dict "root" . "overrides" .Values.worker.image) | quote }}
          imagePullPolicy: {{ include "gpustack-operator.imagePullPolicy" (dict "root" . "overrides" .Values.worker.image) }}
          args:
            - gpustack-operator
            - worker
            - -v=2
            - --secure-port={{ .Values.worker.securePort }}
            {{- if $certmanager }}
            - --cert-dir=/var/run/gpustack/certs
            {{- end }}
            {{- if .Values.global.manufacturers }}
            - --manufacturer={{ keys .Values.global.manufacturers | sortAlpha | join "," }}
            {{- end }}
            {{- with .Values.worker.disableApplications }}
            # One flag carrying the whole list: the flag accumulates across occurrences, so a
            # second one could only ever disable more.
            - --disable-applications={{ join "," . }}
            {{- end }}
            {{- with .Values.worker.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          env:
            # User-supplied env first, so a misconfiguration can never shadow the
            # managed downward-API variables below (last value wins).
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBERNETES_SERVICE_NAME
              value: {{ include "gpustack-operator.worker.fullname" . | quote }}
            # Propagate the chart's image configuration so the applications the worker
            # installs at runtime (Kueue/NFD/CSI/device-manager) share the same registry,
            # namespace, pull secrets and pull policy.
            - name: GPUSTACK_CONTAINER_REGISTRY
              value: {{ .Values.global.imageRegistry | quote }}
            - name: GPUSTACK_CONTAINER_NAMESPACE
              value: {{ .Values.global.imageNamespace | quote }}
            - name: GPUSTACK_IMAGE_PULL_SECRETS
              value: "{{ range $i, $s := .Values.global.imagePullSecrets }}{{ if $i }},{{ end }}{{ if kindIs "string" $s }}{{ $s }}{{ else }}{{ $s.name }}{{ end }}{{ end }}"
            - name: GPUSTACK_IMAGE_PULL_POLICY
              value: {{ include "gpustack-operator.imagePullPolicy" (dict "root" . "overrides" .Values.worker.image) | quote }}
            # Propagate each manufacturer's identity, so the worker reads the same facts the
            # chart states: its NodeFeatureRule, its resource accounting and the RuntimeClass
            # it attaches to a workload all come from these.
            {{- range $manu := (keys .Values.global.manufacturers | sortAlpha) }}
            {{- include "gpustack-operator.manufacturer.env"
                  (dict "name" $manu "identity" (index $.Values.global.manufacturers $manu))
                  | trim | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.worker.securePort }}
          # The worker installs NFD/Kueue/CSI on boot and can self-heal a stranded Kueue
          # (reap orphaned finalizers, then a Kueue upgrade that recreates its controller);
          # give startup generous headroom so a long first boot is not killed mid-repair,
          # which would strand the Kueue release pending-rollback and never converge.
          startupProbe:
            failureThreshold: 60
            periodSeconds: 5
            httpGet:
              scheme: HTTPS
              port: https
              path: /readyz
          readinessProbe:
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 5
            httpGet:
              scheme: HTTPS
              port: https
              path: /readyz
          livenessProbe:
            failureThreshold: 10
            timeoutSeconds: 5
            periodSeconds: 10
            httpGet:
              scheme: HTTPS
              port: https
              path: /livez
          volumeMounts:
            - name: gpustack-data-dir
              mountPath: /var/lib/gpustack
            {{- if $certmanager }}
            - name: gpustack-cert-dir
              mountPath: /var/run/gpustack/certs
            {{- end }}
      volumes:
        - name: gpustack-data-dir
          hostPath:
            path: {{ .Values.worker.dataDir }}
            type: DirectoryOrCreate
        {{- if $certmanager }}
        - name: gpustack-cert-dir
          secret:
            secretName: {{ include "gpustack-operator.worker.fullname" . }}-cert
        {{- end }}
{{- end }}
