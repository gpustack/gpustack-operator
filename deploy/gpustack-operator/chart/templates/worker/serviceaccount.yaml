{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpustack-operator.worker.fullname" . }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.worker.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- /*
  The worker is bound to cluster-admin, so this binding already covers the routing
  resources it manages: the service and the legacy endpoints of the system routing,
  and the endpoint slices of the discovery.k8s.io group it writes when it runs
  outside a nearby cluster. The grant those operations need is get, list, create,
  update and delete on endpointslices, plus the same set on services and endpoints.
  A narrower binding has to keep all of them, or the worker stops routing.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpustack-operator.worker.fullname" . }}
  labels:
    {{- include "gpustack-operator.worker.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpustack-operator.worker.fullname" . }}
    namespace: {{ include "gpustack-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
{{- end }}
