{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gpustack-operator.worker.fullname" . }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.worker.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gpustack-operator.worker.selectorLabels" . | nindent 6 }}
{{- end }}
