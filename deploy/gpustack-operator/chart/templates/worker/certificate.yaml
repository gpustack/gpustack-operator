{{- if and .Values.worker.enabled (eq (include "gpustack-operator.worker.certmanager.enabled" .) "true") }}
{{- $name := include "gpustack-operator.worker.fullname" . }}
{{- $namespace := include "gpustack-operator.namespace" . }}
{{- if not .Values.worker.certmanager.issuer.name }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned-issuer
  namespace: {{ $namespace }}
  labels:
    {{- include "gpustack-operator.worker.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-cert
  namespace: {{ $namespace }}
  labels:
    {{- include "gpustack-operator.worker.labels" . | nindent 4 }}
spec:
  secretName: {{ $name }}-cert
  issuerRef:
    {{- if .Values.worker.certmanager.issuer.name }}
    name: {{ .Values.worker.certmanager.issuer.name }}
    kind: {{ .Values.worker.certmanager.issuer.kind }}
    {{- else }}
    name: {{ $name }}-selfsigned-issuer
    kind: Issuer
    {{- end }}
  commonName: {{ $name }}
  dnsNames:
    - {{ printf "%s.%s.svc.cluster.local" $name $namespace }}
    - {{ printf "%s.%s.svc" $name $namespace }}
    - {{ printf "%s.%s" $name $namespace }}
    - {{ $name }}
{{- end }}
