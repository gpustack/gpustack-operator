{{- if and .Values.deviceManager.enabled .Values.deviceManager.createRuntimeClasses }}
{{- range $manu := (keys .Values.global.manufacturers | sortAlpha) }}
{{- /*
  Creating a class is gated on runtimeInjectsDriver, not on runtimeName, and the two say different
  things. runtimeName is the class the operator will USE for that vendor; runtimeInjectsDriver marks
  a vendor whose user-space driver reaches a container ONLY through that runtime, which is also the
  only case where the runtime's presence can be inferred — if such a vendor's accelerators work at
  all, its container toolkit registered the handler.
  Every other vendor's driver arrives over a hostPath mount and its device plugin needs no
  RuntimeClass, so the handler may well be absent while the accelerators work fine. Creating a class
  there would be actively harmful: the operator attaches a RuntimeClass to a workload whenever one
  exists (pkg/worker/controllers/worker/instance.go), so the kubelet would then reject every Pod of
  that vendor for a runtime nothing configured. A class such a vendor's own operator created is
  still used — that is what runtimeName is for; this chart just never conjures one.
*/}}
{{- $identity := index $.Values.global.manufacturers $manu }}
{{- $runtimeName := $identity.runtimeName }}
{{- if and $runtimeName $identity.runtimeInjectsDriver }}
{{- $existing := lookup "node.k8s.io/v1" "RuntimeClass" "" $runtimeName }}
{{- /*
  A RuntimeClass is a cluster-scoped, fixed-name object that another component (e.g. a vendor GPU
  operator) may already own. Render it only when it is absent, or when this release already owns it.
  Skipping a foreign one avoids an install ownership conflict; still rendering our own keeps Helm
  managing it so upgrades don't prune it (lookup would otherwise hide it from the manifest).
*/}}
{{- if or (not $existing) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) $.Release.Name) }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $runtimeName }}
  labels:
    {{- include "gpustack-operator.deviceManager.labels" $ | nindent 4 }}
handler: {{ $runtimeName }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
