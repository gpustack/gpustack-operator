{{- if and .Values.deviceManager.enabled .Values.deviceManager.createRuntimeClasses }}
{{- range $manu := (keys .Values.global.manufacturers | sortAlpha) }}
{{- /*
  Creating a class is NOT gated on runtimeName. runtimeName is only the class the operator will USE
  for that vendor; it says nothing about whether one exists. What licenses creating one is a vendor
  being unable to work without its runtime, because then the runtime's presence can be inferred: if
  such a vendor's accelerators work at all, its container toolkit registered the handler. Two
  independent facts put a vendor in that position, and either is sufficient:
    - runtimeInjectsDriver — the user-space driver reaches a container only through the runtime.
    - runtimeInjectsDevices — the allocator contributes no device node of its own, so the runtime is
      the only thing that turns an allocation into /dev entries inside the container. This is the
      workload's need alone: such a device-manager still reads its management library from a
      hostPath mount and does not itself run under the class.
  A vendor with neither injects its own device nodes and needs no RuntimeClass, so the handler may
  well be absent while its accelerators work fine. Creating a class there would be actively harmful:
  the operator attaches a RuntimeClass to a workload whenever one exists
  (pkg/worker/controllers/worker/instance.go), so the kubelet would then reject every Pod of that
  vendor for a runtime nothing configured. A class such a vendor's own operator created is still
  used — that is what runtimeName is for; this chart just never conjures one.
*/}}
{{- $identity := index $.Values.global.manufacturers $manu }}
{{- $runtimeName := $identity.runtimeName }}
{{- if and $runtimeName (or $identity.runtimeInjectsDriver $identity.runtimeInjectsDevices) }}
{{- $existing := lookup "node.k8s.io/v1" "RuntimeClass" "" $runtimeName }}
{{- /*
  A RuntimeClass is a cluster-scoped, fixed-name object that another component (e.g. a vendor GPU
  operator) may already own. Render it only when it is absent, or when this release already owns it.
  Skipping a foreign one avoids an install ownership conflict; still rendering our own keeps Helm
  managing it so upgrades don't prune it (lookup would otherwise hide it from the manifest).
*/}}
{{- if or (not $existing) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) $.Release.Name) }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $runtimeName }}
  labels:
    {{- include "gpustack-operator.deviceManager.labels" $ | nindent 4 }}
handler: {{ $runtimeName }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
