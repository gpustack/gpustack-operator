{{- if .Values.deviceManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpustack-operator.deviceManager.fullname" . }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.deviceManager.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    # The container's port, not this Service's. Under endpoint-role discovery the target
    # address is already podIP:securePort, and the conventional annotation relabel overwrites
    # its port with whatever this says — so naming 443 here pointed every scrape at a port
    # nothing listens on.
    prometheus.io/port: {{ .Values.deviceManager.securePort | default 32443 | quote }}
    prometheus.io/path: "/metrics"
    prometheus.io/scheme: "https"
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    {{- include "gpustack-operator.deviceManager.selectorLabels" . | nindent 4 }}
  sessionAffinity: ClientIP
  ports:
    - name: https
      port: 443
      targetPort: https
{{- end }}
