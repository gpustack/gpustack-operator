{{- if .Values.deviceManager.enabled }}
{{- $root := . }}
{{- $image := include "gpustack-operator.image" (dict "root" $root "overrides" $root.Values.deviceManager.image) }}
{{- $imagePullPolicy := include "gpustack-operator.imagePullPolicy" (dict "root" $root "overrides" $root.Values.deviceManager.image) }}
{{- $name := include "gpustack-operator.deviceManager.fullname" . }}
{{- $securePort := .Values.deviceManager.securePort }}
{{- range $manu := (keys .Values.global.manufacturers | sortAlpha) }}
{{- $identity := index $root.Values.global.manufacturers $manu }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}-{{ $manu }}
  namespace: {{ include "gpustack-operator.namespace" $root }}
  labels:
    {{- include "gpustack-operator.deviceManager.labels" $root | nindent 4 }}
    gpustack.ai/manufacturer: {{ $manu }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "gpustack-operator.deviceManager.selectorLabels" $root | nindent 6 }}
      gpustack.ai/manufacturer: {{ $manu }}
  template:
    metadata:
      labels:
        {{- include "gpustack-operator.deviceManager.labels" $root | nindent 8 }}
        gpustack.ai/manufacturer: {{ $manu }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ if kindIs "string" . }}{{ . }}{{ else }}{{ .name }}{{ end }}
        {{- end }}
      {{- end }}
      {{- /*
        This manufacturer's user-space driver reaches a container only through its container
        runtime, so the device-manager has to run under it to read the management library at all.
        Every other vendor's is on a hostPath mount below.
      */}}
      {{- if $identity.runtimeInjectsDriver }}
      runtimeClassName: {{ $identity.runtimeName }}
      {{- end }}
      # A vendor management library reports the host PIDs holding a device and reaches its
      # driver over host IPC; this pod is already privileged with /dev and /sys mounted.
      hostPID: true
      hostIPC: true
      nodeSelector:
        # Rely on NFD to label nodes carrying this manufacturer's PCI vendor.
        feature.node.kubernetes.io/pci-{{ $identity.pciVendorID }}.present: "true"
      serviceAccountName: {{ $name }}
      priorityClassName: system-cluster-critical
      {{- with $root.Values.deviceManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Stage the logical-slicing library tree (preload libs + ld.so.preload) baked
        # into the image at /etc/gpustack/lib onto the host, idempotently (checksum
        # guarded), so the allocator can mount it into sliced workload containers.
        - name: stage-libs
          image: {{ $image | quote }}
          imagePullPolicy: {{ $imagePullPolicy }}
          command:
            - copy-dir.sh
            - /etc/gpustack/lib
            - /var/lib/gpustack/operator/lib
          volumeMounts:
            - name: gpustack-data-dir
              mountPath: /var/lib/gpustack
      containers:
        - name: main
          image: {{ $image | quote }}
          imagePullPolicy: {{ $imagePullPolicy }}
          args:
            - gpustack-operator
            - device-manager
            - serve
            - -v=2
            - --secure-port={{ $securePort }}
            - --manufacturer={{ $manu }}
            {{- with $root.Values.deviceManager.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $root.Values.deviceManager.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: true
            capabilities: {}
            privileged: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          env:
            {{- /*
              This manufacturer's container runtime hides the driver's MIG capability subtree from
              any container which does not declare that it manages MIG, and the management library
              authorizes every partition-scoped call by opening a file under that subtree — so
              without this declaration carving a partition fails with NO_PERMISSION, and a
              partition carved outside this pod is not visible to it at all. Both are declared
              because this pod does both jobs: the allocator configures partitions and the
              detector reads them.

              Keyed by the manufacturer rather than by `runtimeInjectsDriver` + `partitionKind`,
              which describe the same node today: these names, and the privileged container they
              require, are that one runtime's contract rather than anything true of partitioning
              hardware in general. The monitoring half also outlives the partitioning half — an
              accelerator whose partitions this operator does not manage still has to be read.
              https://github.com/NVIDIA/nvidia-container-toolkit/blob/main/cmd/nvidia-container-runtime/README.md#mig-devices
            */}}
            {{- if eq $manu "nvidia" }}
            - name: NVIDIA_MIG_CONFIG_DEVICES
              value: "all"
            - name: NVIDIA_MIG_MONITOR_DEVICES
              value: "all"
            {{- end }}
            # User-supplied env next, so a misconfiguration can never shadow the
            # managed downward-API and PCI-vendor variables below (last value wins),
            # while the vendor-runtime declarations above stay overridable.
            {{- range $key, $value := $root.Values.deviceManager.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBERNETES_SERVICE_NAME
              value: {{ $name | quote }}
            {{- with $root.Values.deviceManager.containerdConfigDir }}
            - name: GPUSTACK_CONTAINERD_CONFIG_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- include "gpustack-operator.manufacturer.env"
                  (dict "name" $manu "identity" $identity) | trim | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ $securePort }}
          startupProbe:
            failureThreshold: 10
            periodSeconds: 5
            httpGet:
              port: https
              path: /readyz
              scheme: HTTPS
          readinessProbe:
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 5
            httpGet:
              port: https
              path: /readyz
              scheme: HTTPS
          livenessProbe:
            failureThreshold: 10
            timeoutSeconds: 5
            periodSeconds: 10
            httpGet:
              port: https
              path: /livez
              scheme: HTTPS
          volumeMounts:
            - name: dev-dir
              mountPath: /dev
            - name: sys-dir
              mountPath: /sys
            - name: tmp-dir
              mountPath: /tmp
            - name: containerd-run-dir
              mountPath: /run/containerd
            - name: docker-run-dir
              mountPath: /run/docker
            - name: gpustack-data-dir
              mountPath: /var/lib/gpustack
            {{- /*
              Both CDI specification directories, read-only: a container engine loads what an
              administrator placed in the static one and what a vendor generator refreshes into the
              dynamic one, so a device manager reading only one of them would miss what the engine
              will resolve. Read to decide whether a granted accelerator can be requested as a CDI
              device; never written.
            */}}
            - name: cdi-static-dir
              mountPath: /etc/cdi
              readOnly: true
            - name: cdi-dir
              mountPath: /var/run/cdi
              readOnly: true
            {{- with $root.Values.deviceManager.containerdConfigDir }}
            {{- /*
              The container engine's configuration, read-only and at the host's own path so a log line
              naming it names the file an operator would open. It says whether the engine resolves CDI
              requests and which runtime handler a Pod naming no runtimeClassName runs under.
            */}}
            - name: containerd-config-dir
              mountPath: {{ . }}
              readOnly: true
            {{- end }}
            - name: kubelet-device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
            {{- if eq $manu "amd" }}
            - name: gpustack-amd-driver
              mountPath: /opt/rocm
              readOnly: true
            {{- /*
              The library directory, named again as a source of its own. ROCm's packaging puts a
              symlink somewhere in this path on every install measured, and where it falls decides
              whether the mount survives it: a link at or above the mount source is resolved by the
              host and is harmless, while one inside the mounted tree dangles in here.

              Both shapes exist on Ubuntu 24.04. On a single-version host /opt/rocm is itself the
              link -- resolved, harmless. On one carrying ROCm 7.14 and 10.0, /opt/rocm is a real
              directory and /opt/rocm/lib links to /etc/alternatives/rocm-lib: mounting /opt/rocm
              alone leaves that dangling, all three ROCm libraries fail to load, and a node with an
              accelerator detects as empty. Naming the directory as its own source fixes it, because
              the host resolves it before mounting.

              Mounting /etc/alternatives instead would also work, and was rejected: it shadows this
              container's own alternatives with the host's 165 entries, which was measured to take
              awk out of the image for no benefit on the hosts that do not need the indirection.
            */}}
            - name: gpustack-amd-driver-lib
              mountPath: /opt/rocm/lib
              readOnly: true
            {{- end }}
            {{- if eq $manu "ascend" }}
            - name: gpustack-ascend-driver
              mountPath: /usr/local/dcmi
              readOnly: true
            - name: gpustack-ascend-toolkit
              mountPath: /usr/local/Ascend
              readOnly: true
            {{- end }}
            {{- if eq $manu "cambricon" }}
            - name: gpustack-cambricon-driver
              mountPath: /usr/local/neuware
              readOnly: true
            {{- end }}
            {{- if eq $manu "hygon" }}
            - name: gpustack-hygon-driver
              mountPath: /opt/hyhal
              readOnly: true
            - name: gpustack-hygon-toolkit
              mountPath: /opt/dtk
              readOnly: true
            # Writable, unlike every other vendor mount here. The library materializes a partition
            # by writing this registry from inside THIS process, so a read-only mount lets the
            # device manager enumerate partitions but not create or destroy one -- measured, and it
            # surfaces as an opaque UNKNOWN from the teardown rather than a permission error.
            - name: gpustack-hygon-mig-config
              mountPath: /etc/dmi_mig_config
            {{- end }}
            {{- if eq $manu "iluvatar" }}
            - name: gpustack-iluvatar-toolkit
              mountPath: /usr/local/corex
              readOnly: true
            {{- end }}
            {{- if eq $manu "metax" }}
            - name: gpustack-metax-driver
              mountPath: /opt/mxdriver
              readOnly: true
            - name: gpustack-metax-toolkit
              mountPath: /opt/maca
              readOnly: true
            {{- end }}
            {{- if eq $manu "thead" }}
            - name: gpustack-thead-toolkit
              mountPath: /usr/local/PPU_SDK
              readOnly: true
            {{- end }}
      volumes:
        - name: dev-dir
          hostPath:
            path: /dev
            type: Directory
        - name: sys-dir
          hostPath:
            path: /sys
            type: Directory
        - name: tmp-dir
          hostPath:
            path: /tmp
        - name: containerd-run-dir
          hostPath:
            path: /run/containerd
            type: DirectoryOrCreate
        - name: docker-run-dir
          hostPath:
            path: /run/docker
            type: DirectoryOrCreate
        - name: gpustack-data-dir
          hostPath:
            path: /var/lib/gpustack
            type: DirectoryOrCreate
        - name: cdi-static-dir
          hostPath:
            path: /etc/cdi
            type: DirectoryOrCreate
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: kubelet-device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        {{- with $root.Values.deviceManager.containerdConfigDir }}
        - name: containerd-config-dir
          hostPath:
            path: {{ . }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "amd" }}
        - name: gpustack-amd-driver
          hostPath:
            path: /opt/rocm
            type: DirectoryOrCreate
        # Created rather than required, like the one above it: a host with no ROCm carries no such
        # directory, and failing its device manager over one it does not need would cost a working
        # node for nothing.
        - name: gpustack-amd-driver-lib
          hostPath:
            path: /opt/rocm/lib
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "ascend" }}
        - name: gpustack-ascend-driver
          hostPath:
            path: /usr/local/dcmi
            type: DirectoryOrCreate
        - name: gpustack-ascend-toolkit
          hostPath:
            path: /usr/local/Ascend
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "cambricon" }}
        - name: gpustack-cambricon-driver
          hostPath:
            path: /usr/local/neuware
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "hygon" }}
        - name: gpustack-hygon-driver
          hostPath:
            path: /opt/hyhal
            type: DirectoryOrCreate
        - name: gpustack-hygon-toolkit
          hostPath:
            path: /opt/dtk
            type: DirectoryOrCreate
        # The vendor's registry of live compute instances: what maps a partition's UUID back to the
        # instance the driver enumerates, what a workload container binds to use one, and what the
        # library writes when it creates or destroys one. The directory only exists while the node is
        # in Multi-Instance mode, so it is created rather than required: a node that is not
        # partitioned simply mounts an empty one.
        - name: gpustack-hygon-mig-config
          hostPath:
            path: /etc/dmi_mig_config
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "iluvatar" }}
        - name: gpustack-iluvatar-toolkit
          hostPath:
            path: /usr/local/corex
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "metax" }}
        - name: gpustack-metax-driver
          hostPath:
            path: /opt/mxdriver
            type: DirectoryOrCreate
        - name: gpustack-metax-toolkit
          hostPath:
            path: /opt/maca
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $manu "thead" }}
        - name: gpustack-thead-toolkit
          hostPath:
            path: /usr/local/PPU_SDK
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
{{- end }}
