{{- if .Values.cleanupOnUninstall }}
{{- /*
  Carries the shared teardown scripts (the same files/ the e2e skills run on the
  host) so the hook Jobs can mount and execute them in-cluster.
  Declared on BOTH delete hooks, because the two Jobs run in different phases and
  each needs the mount: helm creates this once per phase and the delete-policy
  removes it in between. Weight -5 so it (and the RBAC) exist before either Job
  at weight 0.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpustack-operator.fullname" . }}-cleanup
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete,post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
data:
  drain.sh: |-
{{ .Files.Get "files/drain.sh" | indent 4 }}
  cleanup.sh: |-
{{ .Files.Get "files/cleanup.sh" | indent 4 }}
{{- end }}
