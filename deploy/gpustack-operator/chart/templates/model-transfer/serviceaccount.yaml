{{- if .Values.modelTransfer.enabled }}
{{- $name := include "gpustack-operator.modelTransfer.fullname" . }}
{{- with .Values.modelTransfer.serviceAccount.name }}
{{- $name = . }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelTransfer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- /*
  What a source broker runs under, and nothing more.

  The eligibility reads: ModelPrefetch, ModelArtifact and ModelStoreBinding state what a
  namespace prepared and granted; NodeModelStore, ModelStore, InstanceType and KVCachePool
  state what every node already holds and what the cluster can place; Node says where a
  candidate lives; Setting carries the CPU-aware placement setting. Binding
  patch/update is the one write: the initial annotation a broker stamps when a Binding's
  reservation authority is first materialized. This cluster-wide annotation write is a
  deliberate trust requirement for source Pods across tenant namespaces. TokenReview admits a session's bearer token —
  the audience-scoped token a remote replica mounts — and nothing else about authentication
  is granted here.

  What is deliberately absent: any tenant Secret (the serving certificate reaches the Pod
  through its volume, and no warm-up path reads secrets), any configmap or lease outside the
  operator namespace (the Role below scopes the Binding CAS authority to exactly that
  namespace), any status write (the model-manager reporter stays NodeModelStore's single
  writer), and every device, cache path and CRD write a disk-only warm-up might suggest.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "gpustack-operator.modelTransfer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gpustack.ai"]
    resources: ["settings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["resourceflavors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["worker.gpustack.ai"]
    resources: ["modelprefetches", "modelartifacts", "modelstores", "nodemodelstores", "instancetypes", "kvcachepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["worker.gpustack.ai"]
    resources: ["modelstorebindings"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "gpustack-operator.modelTransfer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "gpustack-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
---
{{- /*
  The Binding-wide reservation authority lives in one ConfigMap per Binding in the operator's
  own namespace, claimed with a resourceVersion compare-and-swap per change. Scoped to this
  namespace by a Role rather than the ClusterRole: no other namespace's configmaps are the
  authority's business, and the document carries no credentials in any case.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelTransfer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelTransfer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "gpustack-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
