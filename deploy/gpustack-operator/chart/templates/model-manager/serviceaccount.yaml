{{- if .Values.modelManager.enabled }}
{{- $name := include "gpustack-operator.modelManager.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- /*
  Only what the plugin reads and writes: the artifacts a mount is authorized by, its NodeModelStore
  and that object's status. No Secret: a tenant's token reaches the plugin through kubelet, from the
  volume's nodePublishSecretRef. RBAC cannot narrow the status update to the plugin's own node; the
  worker's admission webhook does.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  {{- if .Values.modelTransfer.enabled }}
  # Read public source discovery ConfigMaps; no tenant Secret.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["worker.gpustack.ai"]
    resources: ["modelartifacts", "modelkernelartifacts", "nodemodelstores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["worker.gpustack.ai"]
    resources: ["modeldeploymentforgers"]
    verbs: ["get"]
  - apiGroups: ["worker.gpustack.ai"]
    resources: ["nodemodelstores/status"]
    verbs: ["update"]
  {{- /* Token authentication for local kernel ingestion and peer endpoints reviews the bearer
    token each request carries. */}}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "gpustack-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
---
{{- /* The CA bundle the model-artifact-ca-bundle Setting names lives in this namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  {{- if gt (.Values.modelManager.port | int) 0 }}
  {{- /* Peer discovery: the other plugins' Pods carry the addresses the peer endpoints answer
    at. */}}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "gpustack-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
