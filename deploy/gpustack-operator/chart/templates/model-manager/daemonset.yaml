{{- if .Values.modelManager.enabled }}
{{- $name := include "gpustack-operator.modelManager.fullname" . }}
{{- $image := include "gpustack-operator.image" (dict "root" . "overrides" .Values.modelManager.image) }}
{{- $imagePullPolicy := include "gpustack-operator.imagePullPolicy" (dict "root" . "overrides" .Values.modelManager.image) }}
{{- $registrarImage := include "gpustack-operator.image" (dict "root" . "overrides" .Values.modelManager.registrar.image) }}
{{- $registrarPullPolicy := include "gpustack-operator.imagePullPolicy" (dict "root" . "overrides" .Values.modelManager.registrar.image) }}
{{- $kubeletDir := .Values.modelManager.kubeletDir | trimSuffix "/" }}
{{- $pluginDir := printf "%s/plugins/model.csi.gpustack.ai" $kubeletDir }}
{{- $rootPath := .Values.modelManager.rootPath | trimSuffix "/" }}
{{- $securePort := .Values.modelManager.securePort }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
spec:
  {{- /*
    One node at a time: a mounted Pod keeps its bind mount through a restart, and a mount asked
    for while this node's plugin restarts is retried by kubelet until the new Pod serves.
  */}}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "gpustack-operator.modelManager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpustack-operator.modelManager.labels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ if kindIs "string" . }}{{ . }}{{ else }}{{ .name }}{{ end }}
        {{- end }}
      {{- end }}
      {{- $nodeSelector := merge (deepCopy (.Values.modelManager.nodeSelector | default dict)) (deepCopy (.Values.global.nodeSelector | default dict)) }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $name }}
      priorityClassName: system-node-critical
      {{- with .Values.modelManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: main
          image: {{ $image | quote }}
          imagePullPolicy: {{ $imagePullPolicy }}
          args:
            - gpustack-operator
            - model-manager
            - -v=2
            - --secure-port={{ $securePort }}
            - --node-name=$(KUBERNETES_NODE_NAME)
            - --kubelet-dir={{ $kubeletDir }}
            - --cache-root={{ $rootPath }}
            - --csi-socket={{ $pluginDir }}/csi.sock
            {{- with .Values.modelManager.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.modelManager.resources | nindent 12 }}
          {{- /*
            Privileged for the bind mounts it makes into kubelet's pods directory, which reach the
            host only through Bidirectional propagation. It needs neither the host's PID nor its IPC
            namespace, nor its network: it downloads over the Pod network, through the configured
            proxy.
          */}}
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
          env:
            - name: KUBERNETES_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: https
              containerPort: {{ $securePort }}
          startupProbe:
            failureThreshold: 10
            periodSeconds: 5
            httpGet:
              port: https
              path: /readyz
              scheme: HTTPS
          readinessProbe:
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 5
            httpGet:
              port: https
              path: /readyz
              scheme: HTTPS
          livenessProbe:
            failureThreshold: 10
            timeoutSeconds: 5
            periodSeconds: 10
            httpGet:
              port: https
              path: /livez
              scheme: HTTPS
          volumeMounts:
            {{- /*
              kubelet's whole directory at its own path: the pods directory holds the targets, the
              plugins directory the socket, and config.yaml the thresholds the watermark cap reads.
            */}}
            - name: kubelet-dir
              mountPath: {{ $kubeletDir }}
              mountPropagation: Bidirectional
            - name: cache-root
              mountPath: {{ $rootPath }}
            - name: tmp-dir
              mountPath: /tmp
        - name: registrar
          image: {{ $registrarImage | quote }}
          imagePullPolicy: {{ $registrarPullPolicy }}
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $pluginDir }}/csi.sock
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: kubelet-dir
          hostPath:
            path: {{ $kubeletDir }}
            type: Directory
        - name: cache-root
          hostPath:
            path: {{ $rootPath }}
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: {{ $pluginDir }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ $kubeletDir }}/plugins_registry
            type: Directory
        - name: tmp-dir
          emptyDir: {}
{{- end }}
