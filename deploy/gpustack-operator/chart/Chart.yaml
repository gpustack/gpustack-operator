apiVersion: v2
name: gpustack-operator
description: A Kubernetes operator that turns raw node hardware into a Kueue-based scheduling chain for accelerators (GPU/NPU/TPU), built on Node Feature Discovery (NFD) and Kueue.
type: application
# NB(thxCode): version and appVersion are kept in sync on purpose, so that the
# operator image tag can default to "v<appVersion>" and the chart input stays simple.
# The release workflow overrides both from the pushed git tag.
version: 0.0.0
appVersion: dev
kubeVersion: ">=1.23.0-0"
home: https://github.com/gpustack/gpustack-operator
sources:
  - https://github.com/gpustack/gpustack
  - https://github.com/gpustack/gpustack-operator
keywords:
  - gpustack-operator
  - operator
  - kueue
  - node-feature-discovery
  - gpu
  - npu
  - accelerator
maintainers:
  - name: GPUStack Authors
    url: https://github.com/gpustack
icon: https://raw.githubusercontent.com/gpustack/gpustack/main/docs/assets/logo.png
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
# NB(thxCode): the dependencies are vendored unpacked and patched under "charts/" by
# `make deps`, so they carry an empty repository, the Helm convention for "already
# present in charts/". Declaring them is mandatory: a "condition" only applies to a
# declared dependency, while an undeclared tree under "charts/" always renders.
dependencies:
  - name: kueue
    version: 0.18.4
    repository: ""
    condition: kueue.enabled
  - name: kueue-legacy
    version: 0.17.8
    repository: ""
    condition: kueue-legacy.enabled
  - name: node-feature-discovery
    version: 0.19.0
    repository: ""
    condition: node-feature-discovery.enabled
  - name: csi-driver-nfs
    version: 4.13.2
    repository: ""
    condition: csi-driver-nfs.enabled
  - name: csi-driver-s3
    version: 0.43.7
    repository: ""
    condition: csi-driver-s3.enabled
