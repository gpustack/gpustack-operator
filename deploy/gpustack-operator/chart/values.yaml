# yaml-language-server: $schema=values.schema.json
# Default values for gpustack-operator.

# -- Run a post-delete cleanup Job on `helm uninstall` that removes the leftovers
# the worker creates at runtime but Helm does not manage: the Kueue / Node Feature
# Discovery / CSI Helm releases, their CRDs, the finalizers pinning Kueue and
# Instance objects, and the aggregated APIServices / webhooks. Disabled by default
# because those CRDs may be shared with other workloads; enable only when this
# release exclusively owns them (e.g. CI / e2e).
cleanupOnUninstall: false

# -- Global values shared across the chart and its subcharts.
global:
  # -- Image registry override applied to every image this chart renders, the subcharts'
  # workloads, sidecars and hook Jobs included (e.g. "docker.io"). When empty, the registry
  # each image reference already encodes is used as-is.
  imageRegistry: ""
  # -- Image namespace override applied to every image this chart renders, the subcharts'
  # workloads, sidecars and hook Jobs included. When non-empty it replaces the namespace
  # segment of each image reference (e.g. "gpustack").
  imageNamespace: ""
  # @schema
  # enum: ["", Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy applied to every workload, the subcharts' included. It outranks a
  # component's own pull policy; when empty, each component's own is used.
  imagePullPolicy: ""
  # -- Image pull secrets applied to all workloads.
  imagePullSecrets: []
  # -- Node selector applied to all workloads when a component does not set its own.
  nodeSelector: {}

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified release name used as the base of resource names.
fullnameOverride: ""
# -- Namespace to deploy the resources into; defaults to the release namespace.
namespaceOverride: ""

# -- Extra labels added to every resource.
commonLabels: {}
# -- Extra annotations added to every resource.
commonAnnotations: {}

# -- Default operator image (shared by the worker and the device-manager). Each
# component may override any of these keys via its own `image` block.
image:
  # -- Operator image repository (shared by the worker and the device-manager).
  repository: gpustack/gpustack-operator
  # @schema
  # type: string
  # @schema
  # -- Operator image tag; defaults to "v<.Chart.AppVersion>" when empty.
  tag: ""
  # @schema
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Operator image pull policy.
  pullPolicy: IfNotPresent

# -- Accelerator manufacturers to manage, mapped to their PCI vendor ID. This is the
# single source for the worker `--manufacturer` list, the per-manufacturer device-manager
# DaemonSets, and the GPUSTACK_<MANUFACTURER>_PCI_VENDOR_ID environment variable propagated
# to both the worker and the device-managers. The manufacturer list is derived from these
# keys (sorted for stable rendering); each device-manager DaemonSet only schedules on nodes
# labelled by NFD with the matching PCI vendor.
manufacturers:
  amd: "1002"
  ascend: "19e5"
  cambricon: "cabc"
  hygon: "1d94"
  iluvatar: "1e3e"
  metax: "9999"
  mthreads: "1ed5"
  nvidia: "10de"
  thead: "1ded"

worker:
  # -- Deploy the worker (control plane). Disable to deploy only the device-managers.
  enabled: true
  # -- Configure cert-manager integration for the worker webhook serving certificate.
  certmanager:
    # @schema
    # type: [string, boolean]
    # enum: [auto, "true", "false", true, false]
    # @schema
    # -- Whether to issue the worker webhook serving certificate with cert-manager.
    # Accepts a string (or the equivalent boolean): "auto" creates the cert-manager
    # resources only when the cert-manager CRDs are detected in the cluster; "true"
    # always creates them (cert-manager must be installed); "false" never creates
    # them and the worker generates and manages its own certificate.
    enabled: auto
    issuer:
      # -- Existing issuer name to use; when empty a self-signed Issuer is created.
      name: ""
      # -- Issuer kind ("Issuer" or "ClusterIssuer"); only used when `issuer.name` is set.
      kind: Issuer
  # -- Number of operator (control plane) replicas.
  replicas: 1
  # -- Secure serving port of the worker container.
  securePort: 31443
  # -- Per-worker image overrides (`repository`/`tag`/`pullPolicy`); unset keys fall
  # back to the chart-level `image`.
  image: {}
  # -- Host path mounted at /var/lib/gpustack for persistent operator data.
  dataDir: /var/lib/gpustack
  # -- Resource requests and limits for the worker container.
  resources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 128Mi
  # -- Node selector for the worker; falls back to `global.nodeSelector` when empty.
  nodeSelector: {}
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Tolerations for the worker. Defaults let the control plane run on
  # control-plane/master nodes.
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/controlplane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  # -- Extra command-line arguments appended to the worker container args.
  extraArgs: []
  # -- Extra environment variables for the worker, as a name/value map.
  env: {}

deviceManager:
  # -- Deploy the per-manufacturer device-manager DaemonSets.
  enabled: true
  # -- Secure serving port of the device-manager container.
  securePort: 32443
  # -- Per-device-manager image overrides (`repository`/`tag`/`pullPolicy`); unset keys
  # fall back to the chart-level `image`.
  image: {}
  # -- Create the nvidia/mthreads RuntimeClass objects. Disable when the cluster
  # already provides them (e.g. via the NVIDIA GPU operator).
  createRuntimeClasses: true
  # -- Resource requests and limits for each device-manager container.
  resources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 128Mi
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Tolerations for the device-manager DaemonSets. Defaults tolerate every taint
  # so a manager schedules on any node carrying the matching accelerator.
  tolerations:
    - operator: "Exists"
  # -- Extra command-line arguments appended to each device-manager container args.
  extraArgs: []
  # -- Extra environment variables for the device-manager, as a name/value map.
  env: {}

# -- [Kueue](https://kueue.sigs.k8s.io) subchart (chart 0.18.4).
# @default -- see the `kueue.*` keys below
kueue:
  # -- Deploy the bundled Kueue.
  enabled: true
  # -- Name the Kueue resources after a fixed "kueue" prefix instead of the release, so
  # that this subchart and the runtime install render identical resource names.
  fullnameOverride: kueue
  controllerManager:
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations for the Kueue controller manager. Defaults tolerate every taint, so
    # the manager keeps admitting workloads wherever the control plane runs.
    tolerations:
      - operator: "Exists"
    manager:
      image:
        # -- Kueue controller manager image repository.
        repository: docker.io/gpustack/mirrored-kueue
        # -- Kueue controller manager image tag. Both Kueue lines run this same image;
        # only the CRD schema their charts ship differs.
        tag: v0.18.4
        # @schema
        # enum: [Always, IfNotPresent, Never]
        # @schema
        # -- Kueue controller manager image pull policy.
        pullPolicy: IfNotPresent
      # -- Annotations of the Kueue controller manager pods, marking them as managed by
      # the operator.
      podAnnotations:
        gpustack.ai/managed: "true"
      # -- Resource requests and limits for the Kueue controller manager container.
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 100m
          memory: 128Mi
  managerConfig:
    # -- Kueue's controller_manager_config.yaml, delivered through the manager-config
    # ConfigMap. The "resources.transformations" list is generated from `pkg/nodefeature`
    # by `make generate chart` between its markers; everything else is maintained here.
    # The managed-jobs namespace selector names "gpustack-system" literally because Helm
    # merges subchart values instead of rendering them, so the release namespace cannot
    # reach this string.
    # @default -- controllerManagerConfigYaml
    controllerManagerConfigYaml: |-
      apiVersion: config.kueue.x-k8s.io/v1beta2
      kind: Configuration
      featureGates:
        AssignQueueLabelsForPods: false
        TASBalancedPlacement: true
        # Enables resources.quotaCheckStrategy below (alpha in Kueue 0.18). The bundled
        # controller image is always 0.18, so the gate is always available.
        QuotaCheckStrategy: true
      health:
        healthProbeBindAddress: :8081
      metrics:
        bindAddress: :8443
      # enableClusterQueueResources: true
      webhook:
        port: 9443
      leaderElection:
        leaderElect: true
        resourceName: c1f6bfd2.kueue.x-k8s.io
      controller:
        groupKindConcurrency:
          Job.batch: 5
          Pod: 5
          Workload.kueue.x-k8s.io: 5
          LocalQueue.kueue.x-k8s.io: 1
          ClusterQueue.kueue.x-k8s.io: 1
          ResourceFlavor.kueue.x-k8s.io: 1
      clientConnection:
        qps: 50
        burst: 100
      #pprofBindAddress: :8083
      #waitForPodsReady:
      #  timeout: 5m
      #  recoveryTimeout: 3m
      #  blockAdmission: false
      #  requeuingStrategy:
      #    timestamp: Eviction
      #    backoffLimitCount: null # null indicates infinite requeuing
      #    backoffBaseSeconds: 60
      #    backoffMaxSeconds: 3600
      #manageJobsWithoutQueueName: true
      managedJobsNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: [ kube-system, gpustack-system ]
      integrations:
        frameworks:
        - "batch/job"
        - "kubeflow.org/mpijob"
        - "ray.io/rayjob"
        - "ray.io/raycluster"
        - "jobset.x-k8s.io/jobset"
        - "trainer.kubeflow.org/trainjob"
        - "kubeflow.org/paddlejob"
        - "kubeflow.org/pytorchjob"
        - "kubeflow.org/tfjob"
        - "kubeflow.org/xgboostjob"
        - "kubeflow.org/jaxjob"
        - "workload.codeflare.dev/appwrapper"
        - "pod"
        - "deployment"
        - "statefulset"
        - "leaderworkerset.x-k8s.io/leaderworkerset"
      #  externalFrameworks:
      #  - "Foo.v1.example.com"
      #fairSharing:
      #  preemptionStrategies: [LessThanOrEqualToFinalShare, LessThanInitialShare]
      #admissionFairSharing:
      #  usageHalfLifeTime: "168h" # 7 days
      #  usageSamplingInterval: "5m"
      #  resourceWeights: # optional, defaults to 1 for all resources if not specified
      #    cpu: 0    # if you want to completely ignore cpu usage
      #    memory: 0 # ignore completely memory usage
      #    example.com/gpu: 100 # and you care only about GPUs usage
      resources:
        # Kueue is not the authoritative ledger in this operator — the Devices CR
        # is. A ClusterQueue advertises exactly one coarse admission dimension (cpu
        # for general pools, the manufacturer credits for accelerated pools), while a
        # Workload still carries the Pod resources the queue does not cover: memory
        # and ephemeral-storage on every pool, cpu on accelerated pools, and the
        # node-level .sliced.* counters the scheduler/kubelet read. Check only the
        # covered dimension and ignore the rest, instead of refusing to assign a
        # flavor for an uncovered resource (which would mark the Workload inadmissible).
        quotaCheckStrategy: IgnoreUndeclared
        # Credits are scored on the integer base B = D = 1600000 (one whole card = B
        # credits): exclusive→B, shared→B/10, sliced.units→B/D=1 (× multiplyBy
        # .sliced), partitioned.units→B/D=1 (no multiplyBy: a partition request is
        # confined to one card, so its units already carry the whole charge). Every
        # per-mode value stays an integer, so Kueue's ResourceValue int64 quantization
        # (q.Value(), which ceils non-CPU resources) never rounds a fractional credit
        # up to 1.
        #
        # Multiply each manufacturer resource into a single credits resource, so that
        # the queue can be configured with a single credit budget. The multiplyBy
        # factor is the number of credits per unit of the input resource, so that
        # the output credits resource is always an integer. The ".sliced" multiplyBy
        # leaks through unconsumed and the node-level .sliced.* counters pass straight
        # through; quotaCheckStrategy above lets Kueue ignore them.
        #
        # Physical partitions (MIG) count disjoint cards from the logical/sliced
        # family, so those keys are not multiplied by any counting resource: each unit
        # already denotes a fraction of exactly one card.
        # gpustack:chartvalues:kueue-transformations:begin
        transformations:
        - input: amd.com/gpu
          strategy: Replace
          outputs:
            credits.gpustack.ai/amd: "1600000"
        - input: amd.com/gpu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/amd: "160000"
        - input: amd.com/gpu.sliced.units
          strategy: Replace
          multiplyBy: amd.com/gpu.sliced
          outputs:
            credits.gpustack.ai/amd: "1"
        - input: huawei.com/npu
          strategy: Replace
          outputs:
            credits.gpustack.ai/ascend: "1600000"
        - input: huawei.com/npu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/ascend: "160000"
        - input: huawei.com/npu.sliced.units
          strategy: Replace
          multiplyBy: huawei.com/npu.sliced
          outputs:
            credits.gpustack.ai/ascend: "1"
        - input: cambricon.com/mlu
          strategy: Replace
          outputs:
            credits.gpustack.ai/cambricon: "1600000"
        - input: cambricon.com/mlu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/cambricon: "160000"
        - input: cambricon.com/mlu.sliced.units
          strategy: Replace
          multiplyBy: cambricon.com/mlu.sliced
          outputs:
            credits.gpustack.ai/cambricon: "1"
        - input: hygon.com/dcu
          strategy: Replace
          outputs:
            credits.gpustack.ai/hygon: "1600000"
        - input: hygon.com/dcu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/hygon: "160000"
        - input: hygon.com/dcu.sliced.units
          strategy: Replace
          multiplyBy: hygon.com/dcu.sliced
          outputs:
            credits.gpustack.ai/hygon: "1"
        - input: iluvatar.com/gpu
          strategy: Replace
          outputs:
            credits.gpustack.ai/iluvatar: "1600000"
        - input: iluvatar.com/gpu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/iluvatar: "160000"
        - input: iluvatar.com/gpu.sliced.units
          strategy: Replace
          multiplyBy: iluvatar.com/gpu.sliced
          outputs:
            credits.gpustack.ai/iluvatar: "1"
        - input: metax-tech.com/gpu
          strategy: Replace
          outputs:
            credits.gpustack.ai/metax: "1600000"
        - input: metax-tech.com/gpu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/metax: "160000"
        - input: metax-tech.com/gpu.sliced.units
          strategy: Replace
          multiplyBy: metax-tech.com/gpu.sliced
          outputs:
            credits.gpustack.ai/metax: "1"
        - input: mthreads.com/gpu
          strategy: Replace
          outputs:
            credits.gpustack.ai/mthreads: "1600000"
        - input: mthreads.com/gpu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/mthreads: "160000"
        - input: mthreads.com/gpu.sliced.units
          strategy: Replace
          multiplyBy: mthreads.com/gpu.sliced
          outputs:
            credits.gpustack.ai/mthreads: "1"
        - input: nvidia.com/gpu
          strategy: Replace
          outputs:
            credits.gpustack.ai/nvidia: "1600000"
        - input: nvidia.com/gpu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/nvidia: "160000"
        - input: nvidia.com/gpu.sliced.units
          strategy: Replace
          multiplyBy: nvidia.com/gpu.sliced
          outputs:
            credits.gpustack.ai/nvidia: "1"
        - input: nvidia.com/gpu.partitioned.units
          strategy: Replace
          outputs:
            credits.gpustack.ai/nvidia: "1"
        - input: alibabacloud.com/ppu
          strategy: Replace
          outputs:
            credits.gpustack.ai/thead: "1600000"
        - input: alibabacloud.com/ppu.shared
          strategy: Replace
          outputs:
            credits.gpustack.ai/thead: "160000"
        - input: alibabacloud.com/ppu.sliced.units
          strategy: Replace
          multiplyBy: alibabacloud.com/ppu.sliced
          outputs:
            credits.gpustack.ai/thead: "1"
        # gpustack:chartvalues:kueue-transformations:end
      #objectRetentionPolicies:
      #  workloads:
      #    afterFinished: null # null indicates infinite retention, 0s means no retention at all
      #    afterDeactivatedByKueue: null # null indicates infinite retention, 0s means no retention at all

# -- [Node Feature Discovery](https://kubernetes-sigs.github.io/node-feature-discovery)
# subchart (chart 0.19.0).
node-feature-discovery:
  # -- Deploy the bundled Node Feature Discovery.
  enabled: true

# -- [csi-driver-nfs](https://github.com/kubernetes-csi/csi-driver-nfs) subchart (chart
# 4.13.2).
csi-driver-nfs:
  # -- Deploy the bundled NFS CSI driver.
  enabled: true

# -- [csi-driver-s3](https://github.com/thxcode/k8s-csi-s3) subchart (chart 0.43.7).
csi-driver-s3:
  # -- Deploy the bundled S3 CSI driver.
  enabled: true
