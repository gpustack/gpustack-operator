# yaml-language-server: $schema=values.schema.json
# Default values for gpustack-operator.
#
# Two key styles appear below and the difference carries meaning. A kebab-case key — `kueue`,
# `node-feature-discovery`, `csi-driver-nfs`, `csi-driver-s3` — is a vendored subchart: Helm
# requires the key to be exactly that subchart's own name, and everything under it is the
# upstream chart's surface, documented upstream. Every other key belongs to this chart and
# follows Helm's camelCase convention (`deviceManager`, `cleanupOnUninstall`).

# -- Run a post-delete cleanup Job on `helm uninstall` that removes the leftovers
# the worker creates at runtime but Helm does not manage: the Kueue / Node Feature
# Discovery / CSI Helm releases, the finalizers pinning Kueue and Instance objects,
# and the aggregated APIServices / webhooks. Of the CRDs it removes this chart's own
# and the Kueue ones this release installed; Node Feature Discovery's are LEFT IN
# PLACE, because its subchart ships them in a way that records no Helm ownership and
# deleting them would be a guess with a cluster-wide blast radius. Disabled by
# default because the CRDs it does remove may be shared with other workloads; enable
# only when this release exclusively owns them (e.g. CI / e2e).
cleanupOnUninstall: false

# -- Global values shared across the chart and its subcharts.
global:
  # -- Image registry override applied to every image this chart renders, the subcharts'
  # workloads, sidecars and hook Jobs included (e.g. "docker.io"). When empty, `global.hub`
  # is consulted next — an alias for umbrella charts that also carry Istio-derived subcharts,
  # which read `hub` and will keep doing so upstream, so one value can mirror every image
  # instead of two that have to be kept equal. When both are empty, the registry each image
  # reference already encodes is used as-is.
  imageRegistry: ""
  # @schema
  # type: [string, null]
  # @schema
  # -- Alias for `imageRegistry`, consulted only when that is empty. Present so an umbrella
  # chart can set a single registry value for Istio-derived subcharts and this one alike.
  hub: ""
  # -- Image namespace override applied to every image this chart renders, the subcharts'
  # workloads, sidecars and hook Jobs included. When non-empty it replaces the namespace
  # segment of each image reference (e.g. "gpustack").
  imageNamespace: ""
  # @schema
  # enum: ["", Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy applied to every workload, the subcharts' included. It outranks a
  # component's own pull policy; when empty, each component's own is used.
  imagePullPolicy: ""
  # -- Image pull secrets applied to all workloads.
  imagePullSecrets: []
  # -- Node selector applied to all workloads when a component does not set its own.
  nodeSelector: {}
  # -- Configure cert-manager integration for every serving certificate this release needs: the
  # worker's webhook certificate and Kueue's. It lives under `global` because Kueue is a vendored
  # subchart and `global` is the only channel Helm gives a subchart to this chart's values. Each
  # component used to be switched on its own, so a cluster with cert-manager installed issued the
  # worker's certificate through it while Kueue went on self-signing — two answers to one question,
  # and the detection behind `auto` could never reach Kueue at all.
  certmanager:
    # @schema
    # type: [string, boolean]
    # enum: [auto, "true", "false", true, false]
    # @schema
    # -- Whether to issue the serving certificates with cert-manager. Accepts a string (or the
    # equivalent boolean): "auto" creates the cert-manager resources only when the cert-manager
    # CRDs are detected in the cluster; "true" always creates them (cert-manager must be
    # installed); "false" never creates them and each component generates and manages its own
    # certificate.
    #
    # Turning it ON later is a plain `helm upgrade`. Turning it OFF again is not: cert-manager
    # owns the Secret Kueue's chart wants to template and writes CA bundles Helm never recorded,
    # so `helm upgrade` refuses the Secret before it starts, and forcing past that fails
    # mid-apply on the visibility APIServices. docs/migration/to-subcharts.md carries the
    # sequence that does work. The same applies when cert-manager is uninstalled from a cluster
    # while this is "auto", which flips the answer without anyone editing a value.
    enabled: auto
    issuer:
      # -- Existing issuer name to use; when empty a self-signed Issuer is created per component.
      name: ""
      # -- Issuer kind ("Issuer" or "ClusterIssuer"); only used when `issuer.name` is set.
      kind: Issuer
  # -- Accelerator manufacturers to manage, one row per manufacturer holding everything the
  # release needs to know about it. `pciVendorID` is what NFD labels its devices with,
  # `resourceName` what its device-plugin advertises to the kubelet, `runtimeName` the
  # RuntimeClass its workloads run under, and `partitionKind` its own name for hardware
  # partitioning ("mig" is NVIDIA's name for the concept, not the concept's). Each of those
  # four is also a `pkg/nodefeature` default overridable by a `GPUSTACK_<MANUFACTURER>_*`
  # variable, and this chart fans every stated one out as that variable to the worker and to
  # the device-managers — so a row here decides them rather than restating them, and a field
  # left out keeps the operator's own default. The two `runtimeInjects*` fields are the
  # exception, deployment facts no Go code holds, and they answer different questions:
  #
  #   `runtimeInjectsDriver` marks a manufacturer whose user-space driver reaches a container
  #   only through its container runtime, so that manufacturer's device-manager runs under the
  #   RuntimeClass too. Every other vendor's device-manager reads its management library from a
  #   hostPath mount the DaemonSet already makes.
  #
  #   `runtimeInjectsDevices` marks a manufacturer whose allocator contributes no device node of
  #   its own, so its container runtime is the only thing that turns an allocation into `/dev`
  #   entries inside the container. This is the WORKLOAD's need, not the device-manager's: such a
  #   device-manager still reads its library from a hostPath and does not run under the class.
  #   Ascend and Iluvatar are the cases in point: their allocators emit `ASCEND_VISIBLE_DEVICES` and
  #   `IX_VISIBLE_DEVICES` and no device node, so without their runtime the container starts with the
  #   variable set and no accelerator behind it — and no error anywhere. AMD used to be a third and
  #   is not any more: its allocator injects `/dev/kfd` and the accelerator's DRM nodes itself.
  #
  # Either of the two — never `runtimeName` — is what decides which RuntimeClasses this chart
  # creates (`deviceManager.createRuntimeClasses`), because either one means the runtime's
  # presence can be inferred: a vendor missing what it names cannot work at all unless its
  # container toolkit registered the handler. `runtimeName` alone is only the class the operator
  # will USE for a vendor. A vendor with neither field injects its own device nodes and needs no
  # RuntimeClass, so the handler may well be absent while its accelerators work — and creating
  # one there would break them: the operator attaches a RuntimeClass to a workload whenever one
  # exists, so the kubelet would reject every Pod of that vendor for a runtime nothing
  # configured. A class the vendor's own operator created is still used; this chart just never
  # conjures one.
  #
  # The keys are the manufacturer list: they become the worker's `--manufacturer` flag (which
  # is where the `gpustack-cpu-info` NodeFeatureRule's vendor IDs come from, since the worker
  # renders that rule itself), one device-manager DaemonSet each, and Kueue's credits mapping.
  # Each DaemonSet only schedules on nodes NFD labelled with the matching PCI vendor, so
  # adding a row is all it takes for a new vendor's devices to be labelled, detected and given
  # a device-manager, and a row no node in the cluster carries simply runs nothing.
  #
  # It lives under `global` because the vendored Kueue subchart reads it too, and `global` is
  # the only channel Helm gives a subchart to this chart's values. The defaults are every
  # manufacturer `pkg/nodefeature` knows, which a Go test asserts. Narrow the list by setting a
  # row to `null` — an unwanted row is otherwise harmless (its DaemonSet schedules on no node),
  # so this is about how much a release renders, not about what works.
  manufacturers:
    amd:
      pciVendorID: "1002"
      resourceName: amd.com/gpu
      runtimeName: amd
    ascend:
      pciVendorID: "19e5"
      resourceName: huawei.com/npu
      runtimeName: ascend
      runtimeInjectsDevices: true
    cambricon:
      pciVendorID: "cabc"
      resourceName: cambricon.com/mlu
      runtimeName: cambricon
    hygon:
      pciVendorID: "1d94"
      resourceName: hygon.com/dcu
      partitionKind: mig
    iluvatar:
      pciVendorID: "1e3e"
      resourceName: iluvatar.com/gpu
      runtimeName: iluvatar
      runtimeInjectsDevices: true
    metax:
      pciVendorID: "9999"
      resourceName: metax-tech.com/gpu
    mthreads:
      pciVendorID: "1ed5"
      resourceName: mthreads.com/gpu
      runtimeName: mthreads
      runtimeInjectsDriver: true
    nvidia:
      pciVendorID: "10de"
      resourceName: nvidia.com/gpu
      runtimeName: nvidia
      runtimeInjectsDriver: true
      partitionKind: mig
    thead:
      pciVendorID: "1ded"
      resourceName: alibabacloud.com/ppu
      partitionKind: mig

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified release name used as the base of resource names.
fullnameOverride: ""
# -- Namespace to deploy the resources into; defaults to the release namespace.
namespaceOverride: ""

# -- Extra labels added to every resource.
commonLabels: {}
# -- Extra annotations added to every resource.
commonAnnotations: {}

# -- Default operator image (shared by the worker and the device-manager). Each
# component may override any of these keys via its own `image` block.
image:
  # -- Operator image repository (shared by the worker and the device-manager).
  repository: gpustack/gpustack-operator
  # @schema
  # type: string
  # @schema
  # -- Operator image tag; defaults to "v<.Chart.AppVersion>" when empty.
  tag: ""
  # @schema
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Operator image pull policy.
  pullPolicy: IfNotPresent

# High availability. Every control-plane component this chart deploys elects a leader, so extra
# replicas stand by instead of sharing the work: they buy failover, not throughput. A highly
# available install raises the replica count of each one and enables the disruption budget that
# goes with it — `worker`, `kueue.controllerManager`, `node-feature-discovery.master`, and the
# `controller` of both CSI drivers. Spreading those replicas across nodes is per-component and
# each key below says what its component supports; the cluster needs as many schedulable nodes as
# the largest replica count for a hard spread to be satisfiable. Everything else here is a
# DaemonSet, one pod per node already. docs/operation/high-availability.md walks through it.

worker:
  # -- Deploy the worker (control plane). Disable to deploy only the device-managers.
  enabled: true
  # -- Number of operator (control plane) replicas. Leader election is always on, so extra
  # replicas stand by; the reconcilers only ever run in one of them.
  replicas: 1
  # @schema
  # enum: [Recreate, RollingUpdate]
  # @schema
  # -- Deployment strategy of the worker. The worker fronts the aggregated API and finishes its
  # whole install (`Prepare`) before it serves, so a `RollingUpdate` keeps the OLD replica
  # answering the old API until the new one turns Ready — which a failed install makes never.
  # The chart's `Recreate` takes the old replica down first: the API pauses during an upgrade
  # instead of serving a stale surface. `RollingUpdate` trades that pause for mixed-version
  # serving — old and new replicas answer TOGETHER for the whole rollout, at any replica
  # count — so set it only where every upgrade pair you roll through is known to be
  # API-compatible in both directions.
  strategyType: Recreate
  # -- Applications the worker must not install at runtime, or `*` for all of them. This chart
  # deploys every one of them itself, so the default takes the worker out of that business
  # entirely. Keep the wildcard: whenever this chart deploys the worker, anything left off the
  # list makes the worker install a SECOND release of this same chart, whose render overlaps this
  # one's. Helm refuses an object another release owns, so that install fails and the worker's
  # startup with it. Handing a component back would mean disabling it here and in this chart's
  # own switch for it, in step, through every upgrade — nothing checks that, which is why the
  # supported split is all or nothing. The worker installs applications only where no chart
  # deploys it, see
  # [Installation Modes](https://github.com/gpustack/gpustack-operator/blob/main/docs/architecture/installation-modes.md).
  # The value is templated rather than appended through `extraArgs` because the flag accumulates across
  # occurrences, so a second one could only ever disable more. Accepted names: `*`, `kueue`,
  # `node-feature-discovery`, `csi-driver-nfs`, `csi-driver-s3`, `device-manager`.
  disableApplications:
    - "*"
  podDisruptionBudget:
    # -- Create a PodDisruptionBudget for the worker. Leave it off on a single-replica install,
    # where it would only block node drains.
    enabled: false
    # @schema
    # type: [integer, string]
    # @schema
    # -- Minimum number of worker pods that must stay available, as a count or a percentage.
    # Keep it below `replicas`, or no node can ever be drained.
    minAvailable: 1
  # -- Secure serving port of the worker container.
  securePort: 31443
  # -- Per-worker image overrides (`repository`/`tag`/`pullPolicy`); unset keys fall
  # back to the chart-level `image`.
  image: {}
  # -- Host path mounted at /var/lib/gpustack for persistent operator data.
  dataDir: /var/lib/gpustack
  # -- Resource requests and limits for the worker container.
  resources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 128Mi
  # -- Node selector for the worker; falls back to `global.nodeSelector` when empty.
  nodeSelector: {}
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Tolerations for the worker. Defaults let the control plane run on
  # control-plane/master nodes.
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/controlplane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Topology spread constraints for the worker. This is where node spread belongs: the
  # default anti-affinity is only `preferred`, on purpose, so three replicas still schedule on a
  # two-node cluster. An entry that omits `labelSelector` gets the worker's own.
  topologySpreadConstraints: []
  # -- Affinity for the worker, replacing the default `preferred` pod anti-affinity that keeps
  # replicas off one node without ever making one unschedulable.
  affinity: {}
  # -- Extra command-line arguments appended to the worker container args.
  extraArgs: []
  # -- Extra environment variables for the worker, as a name/value map.
  env: {}

deviceManager:
  # -- Deploy the per-manufacturer device-manager DaemonSets.
  enabled: true
  # -- Secure serving port of the device-manager container.
  securePort: 32443
  # -- Directory holding the container engine's `config.toml`, mounted read-only into every
  # device manager at that same path and named to them as `GPUSTACK_CONTAINERD_CONFIG_DIR`.
  #
  # A distribution that keeps it elsewhere is served by naming that directory here: k3s uses
  # `/var/lib/rancher/k3s/agent/etc/containerd` and RKE2 `/var/lib/rancher/rke2/agent/etc/containerd`.
  # Set it to the directory itself, never the tree above it — on those two distributions that tree
  # also holds the cluster's tokens and keys. An empty value mounts nothing and passes nothing.
  #
  # It is read for one purpose: a device-injection strategy of `auto` needs to know whether the
  # container engine resolves CDI requests, and which runtime handler a Pod naming no
  # `runtimeClassName` runs under. With the configuration unreadable, `auto` keeps the
  # environment-variable channel. Nothing else depends on it.
  containerdConfigDir: /etc/containerd
  # -- Per-device-manager image overrides (`repository`/`tag`/`pullPolicy`); unset keys
  # fall back to the chart-level `image`.
  image: {}
  # -- Restrict who may reach the device-manager's secure port.
  #
  # That port serves `/metrics`, which lists every Instance running on the node — names,
  # namespaces, declared sizes, live usage and accelerator IDs — to anything that can reach it,
  # and it is unauthenticated. Enabling this is recommended on a multi-tenant cluster.
  networkPolicy:
    # -- Deploy the NetworkPolicy.
    #
    # It only takes effect on a CNI that enforces NetworkPolicy; on one that does not, the
    # object is inert rather than an error. On a CNI that enforces policy but does not exempt
    # node-local traffic it also cuts the kubelet's probes, which would take every
    # device-manager NotReady — see `extraIngress`.
    enabled: false
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Peers admitted to the secure port besides the worker, as NetworkPolicy `from` entries
    # (`podSelector`, `namespaceSelector`, `ipBlock`). This is where a Prometheus living outside
    # the operator's namespace goes, e.g.
    # `[{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]`.
    scrapers: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Whole ingress rules appended verbatim, for what `scrapers` cannot express.
    #
    # NetworkPolicy has no peer meaning "the node this pod runs on", and the kubelet's probes
    # come from the node's host network namespace. Mainstream CNIs exempt that traffic, but
    # upstream leaves it implementation-defined — so on a CNI that does not, admit the node's
    # address range here, e.g. `[{from: [{ipBlock: {cidr: 10.0.0.0/8}}]}]`.
    extraIngress: []
  # -- Create a RuntimeClass for every manufacturer whose `global.manufacturers` row sets
  # `runtimeInjectsDriver` or `runtimeInjectsDevices`, where the cluster does not already have
  # one. That is the set whose container runtime is certain to be installed, since without it
  # those accelerators cannot work at all — see the note on `global.manufacturers`.
  # Disable when something else provides them (e.g. a vendor GPU operator).
  createRuntimeClasses: true
  # -- Resource requests and limits for each device-manager container.
  resources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 128Mi
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Tolerations for the device-manager DaemonSets. Defaults tolerate every taint
  # so a manager schedules on any node carrying the matching accelerator.
  tolerations:
    - operator: "Exists"
  # -- Extra command-line arguments appended to each device-manager container args.
  extraArgs: []
  # -- Extra environment variables for the device-manager, as a name/value map.
  env: {}

# -- Migration hook Jobs. A pre-install/pre-upgrade Job reaps a Kueue left stranded by an
# interrupted teardown, and on an upgrade applies the vendored subcharts' CRDs, which Helm
# itself applies on install only. A post-upgrade Job retires the release records of the
# per-application releases these subcharts replaced and prunes what they left behind. Both run
# the operator image, which bundles kubectl, helm and this chart; `helm upgrade --no-hooks`
# skips them.
migrate:
  # -- Per-hook image overrides (`repository`/`tag`/`pullPolicy`); unset keys fall back to the
  # chart-level `image`. Overridable so an upgrade is never blocked by an operator tag that is
  # not mirrored yet — at the cost that the CRDs the hook applies are then the ones vendored by
  # the image it does run.
  image: {}

# -- [Kueue](https://kueue.sigs.k8s.io) subchart (chart 0.18.4).
# @default -- see the `kueue.*` keys below
kueue:
  # -- Deploy the bundled Kueue.
  enabled: true
  # -- Name the Kueue resources after a fixed "kueue" prefix instead of the release, so
  # that this subchart and the runtime install render identical resource names.
  fullnameOverride: kueue
  controllerManager:
    # -- Number of Kueue controller manager replicas. `managerConfig` below elects a leader, so
    # extra replicas stand by — but every one of them serves the admission webhook, and that is
    # what a highly available install buys: with a single replica, losing its node blocks Pod
    # creation in every namespace Kueue manages until it is rescheduled.
    replicas: 1
    podDisruptionBudget:
      # -- Create a PodDisruptionBudget for the Kueue controller manager. Enable it together with
      # `replicas` above; on a single replica it would only block node drains.
      enabled: false
      # @schema
      # type: [integer, string]
      # @schema
      # -- Minimum number of Kueue controller manager pods that must stay available, as a count or
      # a percentage. Keep it below `replicas`, or no node can ever be drained.
      minAvailable: 1
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Topology spread constraints for the Kueue controller manager, rendered as given. Unlike
    # the worker's, these carry no selector of their own, so a `DoNotSchedule` spread across nodes
    # needs `labelSelector: {matchLabels: {app.kubernetes.io/name: kueue, control-plane:
    # controller-manager}}` spelled out.
    topologySpreadConstraints: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations for the Kueue controller manager. Defaults tolerate every taint, so
    # the manager keeps admitting workloads wherever the control plane runs.
    tolerations:
      - operator: "Exists"
    manager:
      image:
        # -- Kueue controller manager image repository.
        repository: docker.io/gpustack/mirrored-kueue
        # -- Kueue controller manager image tag, stated rather than inherited so a subchart
        # bump cannot move the image without the diff showing it.
        tag: v0.18.4
        # @schema
        # enum: [Always, IfNotPresent, Never]
        # @schema
        # -- Kueue controller manager image pull policy.
        pullPolicy: IfNotPresent
      # -- Annotations of the Kueue controller manager pods, marking them as managed by
      # the operator.
      podAnnotations:
        gpustack.ai/managed: "true"
      # -- Resource requests and limits for the Kueue controller manager container.
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 100m
          memory: 128Mi
  managerConfig:
    # -- Kueue's controller_manager_config.yaml, delivered through the manager-config
    # ConfigMap. Two keys are absent on purpose and rendered by this chart instead, because
    # Helm merges a subchart's values rather than templating them: `resources.transformations`,
    # the credits mapping derived from `global.manufacturers`, which a user copying this string
    # must not be able to drop silently; and `managedJobsNamespaceSelector`, whose default
    # follows the release namespace. Everything else is maintained here, and a selector stated
    # here still wins.
    # @default -- controllerManagerConfigYaml
    controllerManagerConfigYaml: |-
      apiVersion: config.kueue.x-k8s.io/v1beta2
      kind: Configuration
      featureGates:
        AssignQueueLabelsForPods: false
        TASBalancedPlacement: true
        # Enables resources.quotaCheckStrategy below (alpha in Kueue 0.18). The bundled
        # controller image is always 0.18, so the gate is always available.
        QuotaCheckStrategy: true
      health:
        healthProbeBindAddress: :8081
      metrics:
        bindAddress: :8443
      # enableClusterQueueResources: true
      webhook:
        port: 9443
      leaderElection:
        leaderElect: true
        resourceName: c1f6bfd2.kueue.x-k8s.io
      controller:
        groupKindConcurrency:
          Job.batch: 5
          Pod: 5
          Workload.kueue.x-k8s.io: 5
          LocalQueue.kueue.x-k8s.io: 1
          ClusterQueue.kueue.x-k8s.io: 1
          ResourceFlavor.kueue.x-k8s.io: 1
      clientConnection:
        qps: 50
        burst: 100
      #pprofBindAddress: :8083
      #waitForPodsReady:
      #  timeout: 5m
      #  recoveryTimeout: 3m
      #  blockAdmission: false
      #  requeuingStrategy:
      #    timestamp: Eviction
      #    backoffLimitCount: null # null indicates infinite requeuing
      #    backoffBaseSeconds: 60
      #    backoffMaxSeconds: 3600
      #manageJobsWithoutQueueName: true
      # The namespaces Kueue manages jobs in. Deliberately unset: the chart renders the
      # default as every namespace but kube-system and this release's own, which is what
      # lets the release install into any namespace — Kueue refuses to start when this
      # selector matches the namespace it runs in, and a subchart value cannot be
      # templated. State it to take the default over, and own that rule.
      #managedJobsNamespaceSelector:
      #  matchExpressions:
      #    - key: kubernetes.io/metadata.name
      #      operator: NotIn
      #      values: [ kube-system, gpustack-system ]
      integrations:
        frameworks:
        - "batch/job"
        - "kubeflow.org/mpijob"
        - "ray.io/rayjob"
        - "ray.io/raycluster"
        - "jobset.x-k8s.io/jobset"
        - "trainer.kubeflow.org/trainjob"
        - "kubeflow.org/paddlejob"
        - "kubeflow.org/pytorchjob"
        - "kubeflow.org/tfjob"
        - "kubeflow.org/xgboostjob"
        - "kubeflow.org/jaxjob"
        - "workload.codeflare.dev/appwrapper"
        - "pod"
        - "deployment"
        - "statefulset"
        - "leaderworkerset.x-k8s.io/leaderworkerset"
      #  externalFrameworks:
      #  - "Foo.v1.example.com"
      #fairSharing:
      #  preemptionStrategies: [LessThanOrEqualToFinalShare, LessThanInitialShare]
      #admissionFairSharing:
      #  usageHalfLifeTime: "168h" # 7 days
      #  usageSamplingInterval: "5m"
      #  resourceWeights: # optional, defaults to 1 for all resources if not specified
      #    cpu: 0    # if you want to completely ignore cpu usage
      #    memory: 0 # ignore completely memory usage
      #    example.com/gpu: 100 # and you care only about GPUs usage
      resources:
        # Kueue is not the authoritative ledger in this operator — the Devices CR
        # is. A ClusterQueue advertises exactly one coarse admission dimension (cpu
        # for general pools, the manufacturer credits for accelerated pools), while a
        # Workload still carries the Pod resources the queue does not cover: memory
        # and ephemeral-storage on every pool, cpu on accelerated pools, and the
        # node-level .sliced.* counters the scheduler/kubelet read. Check only the
        # covered dimension and ignore the rest, instead of refusing to assign a
        # flavor for an uncovered resource (which would mark the Workload inadmissible).
        quotaCheckStrategy: IgnoreUndeclared
        # `resources.transformations` is absent here on purpose: the chart renders it from
        # `global.manufacturers`, mapping every accelerator resource key onto that
        # manufacturer's single credits resource so a queue can carry one credit budget. It
        # is not stated in this string because a user copying the string to change one
        # feature gate would silently drop the mapping the whole scheduling chain rests on.
        # The `.sliced` multiplyBy leaks through unconsumed and the node-level `.sliced.*`
        # counters pass straight through; `quotaCheckStrategy` above is what lets Kueue
        # ignore them.
      #objectRetentionPolicies:
      #  workloads:
      #    afterFinished: null # null indicates infinite retention, 0s means no retention at all
      #    afterDeactivatedByKueue: null # null indicates infinite retention, 0s means no retention at all

# -- [Node Feature Discovery](https://kubernetes-sigs.github.io/node-feature-discovery)
# subchart (chart 0.19.0).
# @default -- see the `node-feature-discovery.*` keys below
node-feature-discovery:
  # -- Deploy the bundled Node Feature Discovery.
  enabled: true
  # -- Name the NFD resources after a fixed "node-feature-discovery" prefix instead of the
  # release, so that this subchart and an NFD installed by anything else render identical
  # resource names. Without it the two run side by side, each labelling the same nodes.
  fullnameOverride: node-feature-discovery
  image:
    # -- NFD image repository; the master, the worker and the gc all run it.
    repository: docker.io/gpustack/mirrored-node-feature-discovery
    # -- NFD image tag, stated rather than inherited so a subchart bump cannot move the image
    # without the diff showing it.
    tag: v0.19.0-gpustack1
  master:
    # -- Number of NFD master replicas. The master is what turns a device-manager's detections into
    # node labels, so while it is down no node is ever (re)classified and the scheduling chain
    # stalls for new or changed nodes. Above one, NFD's own chart adds `-enable-leader-election`
    # for you; the standbys watch without writing. NFD's templates render no topology spread
    # constraints, so spreading these replicas across nodes means setting `master.affinity` below —
    # which replaces NFD's own preference for control-plane nodes rather than adding to it.
    replicaCount: 1
    # -- Affinity for the NFD master, and the only way to spread its replicas across nodes: NFD
    # renders no topology spread constraints. Stated here because a spread knob a user cannot find
    # in this file is a knob that does not exist, and because replacing it wholesale is what
    # setting it does.
    #
    # It is NFD's own default — a preference for control-plane nodes — with one deliberate change:
    # the role label is matched with `Exists` rather than `In [""]`. That label's value is a
    # convention, not an API: kubeadm and kind set it empty, k3s and RKE2 set it to "true", so a
    # value test silently matches nothing on those and the preference quietly stops existing.
    # `Exists` is also what every other control-plane matcher in this file uses, tolerations and
    # both CSI drivers included. Being stated pins the rest of the block: re-read NFD's default
    # when bumping the subchart, as with every image tag here.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    podDisruptionBudget:
      # -- Create a PodDisruptionBudget for the NFD master. Enable it together with `replicaCount`
      # above; on a single replica it would only block node drains. NFD spells this key `enable`,
      # not `enabled`.
      enable: false
      # @schema
      # type: [integer, string]
      # @schema
      # -- Minimum number of NFD master pods that must stay available, as a count or a percentage.
      # Keep it below `replicaCount`, or no node can ever be drained.
      minAvailable: 1
    # -- Annotations added to the NFD master pods.
    annotations:
      gpustack.ai/managed: "true"
    # -- Annotations added to the NFD master Deployment.
    deploymentAnnotations:
      gpustack.ai/managed: "true"
    serviceAccount:
      # -- Annotations added to the NFD master ServiceAccount.
      annotations:
        gpustack.ai/managed: "true"
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations for the NFD master. Defaults tolerate every taint, so labelling keeps
    # working wherever the control plane runs.
    tolerations:
      - operator: "Exists"
    config:
      # -- What the NFD master is allowed to write. Every value here restates an NFD default,
      # stated because the whole chain depends on it: labels, taints, annotations and extended
      # resources all stay enabled, an existing label may be overwritten, and the labels a
      # NodeFeature asks for are honoured — that last one is how a device-manager's detections
      # reach its node.
      #
      # `nodeFeatureNamespaceSelector` is deliberately absent. Pinned to one namespace it makes
      # the master ignore every NodeFeature created anywhere else, which is exactly what taking
      # over a cluster's existing NFD must not do: a vendor GPU operator keeps its NodeFeatures
      # in its own namespace, and they are the features being adopted. Unset means every
      # namespace, so — together with the two permissive keys above — a NodeFeature anywhere can
      # influence node labels; `denyNodeFeatureLabels` is the lever that tightens it.
      restrictions:
        disableLabels: false
        disableTaints: false
        disableAnnotations: false
        disableExtendedResources: false
        allowOverwrite: true
        denyNodeFeatureLabels: false
  worker:
    # -- Annotations added to the NFD worker pods.
    annotations:
      gpustack.ai/managed: "true"
    # -- Annotations added to the NFD worker DaemonSet.
    daemonsetAnnotations:
      gpustack.ai/managed: "true"
    serviceAccount:
      # -- Annotations added to the NFD worker ServiceAccount.
      annotations:
        gpustack.ai/managed: "true"
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations for the NFD worker. Defaults tolerate every taint, so a node is discovered
    # whatever it is tainted for.
    tolerations:
      - operator: "Exists"
    config:
      core:
        # -- Feature sources the worker collects. `custom` is what makes the
        # `gpustack-cpu-info` NodeFeatureRule the operator applies evaluate.
        labelSources:
          - "cpu"
          - "pci"
          - "custom"
          - "system"
        # -- Only the labels this chart consumes are published, so NFD does not cover the nodes
        # in features nothing reads — `system-os_release.` excepted, which a vendor GPU operator
        # reads.
        labelWhiteList: '^(pci-|cpu-model\.|system-os_release\.|acceleratable)'
      sources:
        pci:
          # -- PCI device classes to label, as class-code prefixes: display controllers,
          # processing accelerators and the co-processors accelerators present as (see
          # https://admin.pci-ids.ucw.cz/read/PD). The `gpustack-cpu-info` NodeFeatureRule
          # matches the same classes, so it sees exactly the devices NFD was told to label; the
          # operator renders that rule from `pkg/nodefeature`, and a Go test holds the two lists
          # equal. Narrowing this list without narrowing that one labels fewer devices than the
          # rule expects.
          deviceClassWhitelist:
            - "02"
            - "03"
            - "0b"
            - "12"
          # -- Device fields to label. `vendor` is what the NodeFeatureRule matches the managed
          # `global.manufacturers`' PCI vendor IDs against.
          deviceLabelFields:
            - vendor
  gc:
    # -- Annotations added to the NFD gc pods.
    annotations:
      gpustack.ai/managed: "true"
    # -- Annotations added to the NFD gc Deployment.
    deploymentAnnotations:
      gpustack.ai/managed: "true"
    serviceAccount:
      # -- Annotations added to the NFD gc ServiceAccount.
      annotations:
        gpustack.ai/managed: "true"
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations for the NFD gc. Defaults tolerate every taint, so stale NodeFeature and
    # NodeResourceTopology objects are collected wherever the control plane runs.
    tolerations:
      - operator: "Exists"

# -- [csi-driver-nfs](https://github.com/kubernetes-csi/csi-driver-nfs) subchart (chart
# 4.13.4).
# @default -- see the `csi-driver-nfs.*` keys below
csi-driver-nfs:
  # -- Deploy the bundled NFS CSI driver.
  enabled: true
  driver:
    # -- CSI driver name. Namespaced to gpustack so this driver coexists with a cluster's own
    # csi-driver-nfs, and matched by `kuberess.CSIProvisionerNFS`, which the worker writes into
    # the StorageClasses it provisions.
    name: nfs.csi.gpustack.ai
  # -- Mirrored images. `baseRepo` is joined with each leading-slash `repository`. Every tag is
  # stated rather than inherited from the chart, so what this release pulls is readable here and a
  # subchart bump cannot move an image without the diff showing it. These are the tags chart
  # 4.13.4 ships, the driver's included, and each one is mirrored — an unmirrored tag would put
  # every install in ImagePullBackOff. The three sidecars this driver shares with `csi-driver-s3`
  # (`csiProvisioner`, `livenessProbe`, `nodeDriverRegistrar`) carry the same tag on both, so a
  # release ships one image per component rather than two versions of each. The
  # `externalSnapshotter` image is absent because that component is off, and turning it on would
  # need a mirror first.
  image:
    baseRepo: docker.io
    nfs:
      repository: /gpustack/mirrored-csi-nfs-driver
      tag: v4.13.4
    csiProvisioner:
      repository: /gpustack/mirrored-csi-provisioner
      tag: v6.3.0
    csiResizer:
      repository: /gpustack/mirrored-csi-resizer
      tag: v2.2.0
    csiSnapshotter:
      repository: /gpustack/mirrored-csi-snapshotter
      tag: v8.6.0
    livenessProbe:
      repository: /gpustack/mirrored-csi-livenessprobe
      tag: v2.19.0
    nodeDriverRegistrar:
      repository: /gpustack/mirrored-csi-node-driver-registrar
      tag: v2.17.0
  controller:
    # -- Number of NFS controller (provisioner) replicas. Every sidecar runs with
    # `--leader-election`, so extra replicas stand by. Losing the controller delays volume
    # provisioning, resizing and snapshotting; volumes already mounted keep working, because the
    # mounting side is the node DaemonSet. This chart renders neither a PodDisruptionBudget nor
    # topology spread constraints for the controller, and it honours `controller.affinity` only
    # when that affinity carries `nodeSelectorTerms` — a pod anti-affinity is silently dropped —
    # so replicas may share a node.
    replicas: 1
    # @schema
    # enum: [Recreate, RollingUpdate]
    # @schema
    # -- Deployment strategy of the NFS controller. The chart's `Recreate` takes every replica down
    # before starting the new one, which gives up the failover `replicas` above just bought; set
    # `RollingUpdate` alongside it.
    strategyType: Recreate
    # -- Name of the NFS controller Deployment and of the pods it owns.
    name: csi-nfs-controller
    # @schema
    # enum: [Default, ClusterFirst, ClusterFirstWithHostNet]
    # @schema
    # -- DNS policy of the NFS controller pods.
    dnsPolicy: ClusterFirstWithHostNet
    # -- Affinity of the NFS controller pods. Honoured only when it carries `nodeSelectorTerms`
    # (see `replicas` above), which makes it a node-placement knob and nothing else.
    affinity: {}
    # -- Node selector of the NFS controller pods.
    nodeSelector: {}
    # -- Priority class of the NFS controller pods. `system-cluster-critical` keeps provisioning
    # working while a node is under pressure.
    priorityClassName: system-cluster-critical
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations of the NFS controller pods. The defaults let the provisioner run on
    # control-plane nodes.
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/controlplane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
  node:
    # -- Name of the NFS node DaemonSet and of the pods it owns. This is the mounting side: one
    # pod per node, so it has no replica count or disruption budget to configure.
    name: csi-nfs-node
    # @schema
    # enum: [Default, ClusterFirst, ClusterFirstWithHostNet]
    # @schema
    # -- DNS policy of the NFS node pods. `ClusterFirstWithHostNet` is what lets an NFS server
    # named in the cluster's DNS resolve from a host-networked mount.
    dnsPolicy: ClusterFirstWithHostNet
    # -- Affinity of the NFS node pods. Rendered as given, unlike the controller's.
    affinity: {}
    # -- Node selector of the NFS node pods, narrowing which nodes can mount NFS volumes. The
    # chart adds `kubernetes.io/os: linux` on top of whatever is set here.
    nodeSelector: {}
    # -- Priority class of the NFS node pods.
    priorityClassName: system-cluster-critical
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations of the NFS node pods. The defaults tolerate every taint, so a volume can be
    # mounted on any node the scheduler picks.
    tolerations:
      - operator: "Exists"
  nodeDriverRegistrar:
    livenessProbe:
      # -- Leave the node-driver-registrar's own liveness probe off; the node plugin already
      # runs one on its health port.
      enabled: false
  rbac:
    # -- Prefix of the driver's ClusterRole and ClusterRoleBinding names.
    name: csi-nfs

# -- [csi-driver-s3](https://github.com/thxcode/k8s-csi-s3) subchart (chart 0.43.7).
# @default -- see the `csi-driver-s3.*` keys below
csi-driver-s3:
  # -- Deploy the bundled S3 CSI driver.
  enabled: true
  driver:
    # -- CSI driver name. Namespaced to gpustack so this driver coexists with a cluster's own
    # S3 CSI driver, and matched by `kuberess.CSIProvisionerS3`, which the worker writes into
    # the StorageClasses it provisions.
    name: s3.csi.gpustack.ai
  # -- Mirrored images. This chart stores whole `registry/namespace/name:tag` references with
  # no separate tag key. The three sidecars are the same images, at the same tags, that
  # `csi-driver-nfs` pulls: they are shared components, and shipping one tag per component keeps
  # a release from carrying two versions of each. Upstream pins all three lower than the NFS
  # chart does, so they follow the NFS chart rather than this one — which is what the
  # `feature-gates.patch` is for: provisioner v6.3.0 has no `HonorPVReclaimPolicy` gate left to
  # set, and this chart's controller still passed it.
  images:
    s3: docker.io/gpustack/mirrored-csi-s3-driver:v0.43.7
    csiProvisioner: docker.io/gpustack/mirrored-csi-provisioner:v6.3.0
    livenessProbe: docker.io/gpustack/mirrored-csi-livenessprobe:v2.19.0
    nodeDriverRegistrar: docker.io/gpustack/mirrored-csi-node-driver-registrar:v2.17.0
  controller:
    # -- Number of S3 controller (provisioner) replicas. The provisioner sidecar runs with
    # `--leader-election`, so extra replicas stand by. Losing the controller delays volume
    # provisioning; volumes already mounted keep working, because the mounting side is the node
    # DaemonSet. Like the NFS chart, this one renders neither a PodDisruptionBudget nor topology
    # spread constraints for the controller, and it honours `controller.affinity` only when that
    # affinity carries `nodeSelectorTerms` — a pod anti-affinity is silently dropped — so replicas
    # may share a node.
    replicas: 1
    # @schema
    # enum: [Recreate, RollingUpdate]
    # @schema
    # -- Deployment strategy of the S3 controller. The chart's `Recreate` takes every replica down
    # before starting the new one, which gives up the failover `replicas` above just bought; set
    # `RollingUpdate` alongside it.
    strategyType: Recreate
    # -- Name of the S3 controller Deployment and of the pods it owns.
    name: csi-s3-controller
    # -- Affinity of the S3 controller pods. Honoured only when it carries `nodeSelectorTerms`
    # (see `replicas` above), which makes it a node-placement knob and nothing else. This chart
    # renders no `dnsPolicy` for the controller, so there is no key for it.
    affinity: {}
    # -- Node selector of the S3 controller pods.
    nodeSelector: {}
    # -- Priority class of the S3 controller pods. `system-cluster-critical` keeps provisioning
    # working while a node is under pressure.
    priorityClassName: system-cluster-critical
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations of the S3 controller pods. The defaults let the provisioner run on
    # control-plane nodes.
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/controlplane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
  node:
    # -- Name of the S3 node DaemonSet and of the pods it owns. This is the mounting side: one pod
    # per node, so it has no replica count or disruption budget to configure.
    name: csi-s3-node
    # @schema
    # enum: [Default, ClusterFirst, ClusterFirstWithHostNet]
    # @schema
    # -- DNS policy of the S3 node pods. `ClusterFirstWithHostNet` is what lets an in-cluster
    # object store endpoint resolve from a host-networked mount.
    dnsPolicy: ClusterFirstWithHostNet
    # -- Affinity of the S3 node pods. Rendered as given, unlike the controller's.
    affinity: {}
    # -- Node selector of the S3 node pods, narrowing which nodes can mount S3 volumes. The chart
    # adds `kubernetes.io/os: linux` on top of whatever is set here.
    nodeSelector: {}
    # -- Priority class of the S3 node pods.
    priorityClassName: system-cluster-critical
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Tolerations of the S3 node pods. The defaults tolerate every taint, so a volume can be
    # mounted on any node the scheduler picks.
    tolerations:
      - operator: "Exists"
  nodeDriverRegistrar:
    livenessProbe:
      # -- Leave the node-driver-registrar's own liveness probe off; the node plugin already
      # runs one on its health port.
      enabled: false
  rbac:
    # -- Prefix of the driver's ClusterRole and ClusterRoleBinding names.
    name: csi-s3
