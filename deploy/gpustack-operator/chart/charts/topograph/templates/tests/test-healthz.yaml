{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "topograph.fullname" . }}-test-healthz"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "topograph.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with (include "topograph.imagePullSecrets" (dict "root" $ "secrets" .Values.imagePullSecrets)) }}
  imagePullSecrets:
    {{- . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthz
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      image: "{{ include "topograph.image" (dict "root" $ "image" (dict "repository" (.Values.tests.image.repository | default .Values.image.repository) "tag" (.Values.tests.image.tag | default .Values.image.tag))) }}"
      imagePullPolicy: {{ include "topograph.imagePullPolicy" (dict "root" $ "pullPolicy" .Values.image.pullPolicy) }}
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          wget -q -O /dev/null -T 10 \
            "http://{{ include "topograph.fullname" . }}:{{ .Values.service.port }}/healthz"
{{- end }}
